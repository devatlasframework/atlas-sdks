          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource in this org (`ATLAS-SYS-005`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            The caller has read their own transcript too often
            (`ATLAS-SYS-004`, `Retry-After`). A per-LEARNER counter, separate
            from the generation throttle: a transcript is one person's private
            data and one person's cost, so one member looping this route can
            never refuse anybody else's panel, and reopening the rail must not
            spend the daily allowance they need to ask anything.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: The file has been taken down (`ATLAS-CNT-016`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/progress:
