            every link issued before per-type keys existed working - those carry no key and verify
            against the legacy MAC over the account id alone. A client that omits
            this on a peer-review link turns off the WRONG preference and leaves the
            review mail flowing, so it is optional in the schema and required in
            practice for anything but org activity.
        - name: t
          in: query
          required: true
          schema:
            type: string
          description: >
