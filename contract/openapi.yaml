        '200':
          description: Acknowledged - deliberately carries no outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeResponse'
        '400':
          description: >
            `u` or `t` was absent from the query string. **This is the only refusal this
            operation has, and it is about the REQUEST rather than about the link**: a
            bad signature, an unknown account and a key this build does not have all
            answer 200 with the body above, because a differing answer would make the
            endpoint an oracle for which account ids exist. The problem carries
            `ATLAS-VAL-003` and names the missing parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          $ref: '#/components/responses/InternalError'
