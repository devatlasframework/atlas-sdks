      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: >
          The resource being read. Retrieval is document-wide, so the tutor is
          scoped to the resource rather than to a block - and the version is
          resolved server-side from it, which is what supplies the
          takedown check.
    post:
      operationId: askTutorStreamed
      tags: [reader]
      summary: Ask the tutor one question, delivered over an event stream
      description: >
        A2's one-to-one tutor.
        Retrieves passages from the meaning index, answers from those passages
        only, and saves the exchange as private data no org can read.


        **The event vocabulary is the reader's**: `working` once on every path,
        then exactly one of `result` / `nothing` / `error`, then `done`. Every
        event is a JSON payload; the only non-event frame is a `: ping`
        comment keep-alive.


        **`result` carries the whole checked turn** - `mode`, `turnId`, `text`
        and `citations`. Nothing is sent word by word: the faithfulness check
        runs on the completed answer and nothing reaches the learner until it
        passes - deliberately, rather than streaming the answer live, word by
        word. What is streamed is the waiting, not the text.


        **`nothing` carries a `reason`**, and there are exactly three.
        `not-in-sources` means the passages came back and do not answer the
        question - declared by the model itself, because an indexed document
        always returns its nearest passages and so an empty result can never
        mean "not covered". `not-indexed` means the lecture has no meaning
        index and was never searchable. `unavailable` means anything else: a
        provider outage, a spent allowance, a refused draft, no resolved
        learner profile. The rest are folded deliberately, because a learner
        told "the sources don't cover that" when the provider is down has been
        told something false about their own lecture.


        **`guide` swaps the prompt.** It selects guided discovery, which asks one
        question instead of answering, in place of the ordinary answer. It is a
        different call rather than a parameter, and guided discovery carries no
        tone at all - it is deliberately tone-invariant.


        **Citations are computed server-side** from the passages retrieval
        actually returned, never parsed out of the model's reply, and the
        model's own inline `[source: ...]` markers are stripped from `text`
        before it is sent.


        One question, one answer, close. The connection is request-scoped and
        is not held open for the panel's lifetime.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorQuestionRequest'
      responses:
        '200':
          description: >
            The event stream. Every terminal outcome - including a spent
            allowance and an absent learner profile - is an event within it;
            see the operation description.
          content:
            text/event-stream:
              schema:
                type: string
                contentMediaType: application/json
                contentSchema:
                  $ref: '#/components/schemas/TutorAnswer'
        '400':
          description: >
            The question is blank or longer than 500 characters
            (`ATLAS-VAL-001`). Refused rather than truncated: the embedding
            client truncates its input silently, so a longer question would be
            retrieved for by a prefix while the model saw the whole of it.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource in this org (`ATLAS-SYS-005`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            `F6` or `A2` is not switched on for the caller (`ATLAS-PER-002`),
            or the resource has no readable official copy yet
            (`ATLAS-CNT-014`).

            The tutor panel is offered only to a learner who receives BOTH families, so
            the route requires both: the reader renders the panel on the
            conjunction, and a gate that admitted more than the surface offers
            would let a learner who switched the tutor off - which the
            personalisation panel offers as its own switch, separately from the
            engine - reach it by hand.
            Six profile rows grant `A2` without `F6` and one grants `F6`
            without `A2`, so a client cannot infer one from the other.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            The caller's reader budget, or their organisation's tutor
            retrieval budget, is spent (`ATLAS-SYS-004`, `Retry-After`). The
            per-org counter is this route's own and was a precondition of
            exposing the meaning index at all.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: The file has been taken down (`ATLAS-CNT-016`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/tutor/conversation:
