    post:
      operationId: workedExampleForSection
      summary: Work one section as a step-by-step example
      description: >
        F4's worked example, produced by A1. The same throttle, ownership and
        takedown checks, budget ordering and faithfulness check as the concept
        map beside it.


        NO REQUEST BODY, for the concept map's reason exactly: the model is given
        one field, the section, and the section is decided by the block id in the
        path.


        IT RE-PRESENTS, IT DOES NOT INVENT. The model works a procedure the
        section ALREADY contains and is forbidden to invent an example, a dataset
        or a case of its own - which is what makes this A1 rather than A4, and
        what keeps it inside ATLAS's first rule: personalisation changes how,
        never what.


        AT LEAST TWO STEPS, ALWAYS. The array's order IS the step number - there
        is no `n` field, because a model that numbers its own steps can number
        them inconsistently while an array cannot - and the last step states the
        result, so every element is part of the checked sequence. A reply
        carrying fewer than two steps is a non-compliant draft: the server
        retries it under a bounded attempt count and then answers `204`. That is
        NOT a claim that the section holds no procedure.


