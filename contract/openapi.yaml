  /o/{orgId}/billing/downgrade:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: confirmDowngrade
      summary: File a downgrade for the period boundary
      description: >
        The downgrade's confirm. ADMIN ONLY.


        TWO REFUSALS BEFORE THE PLAN CHANGES, never an eviction after it:
        excess members must be removed first, and content must be removed
        until it fits. ATLAS does not choose which member loses their account or
        which lecture is deleted, so the refusal carries the numbers to act on.


        IT TAKES EFFECT AT THE PERIOD BOUNDARY, because the org has already paid
        for the period it is in - and the fit is checked AGAIN then, because an
        org can grow between confirming and the boundary.
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode]
              properties:
                planCode:
                  type: string
                  maxLength: 32
      responses:
        '200':
          description: Filed for the period boundary.
          content:
