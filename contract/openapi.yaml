  /o/{orgId}/discussions/live:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
    get:
      operationId: subscribeToDiscussions
      summary: Subscribe to the organisation's forum (Server-Sent Events)
      description: >
        The live link. Opens a `text/event-stream` that announces activity in this
        organisation until it ends.


        **THE FRAMES CARRY NO CONTENT.** A frame is a `DiscussionLivePoke` - identifiers, a
        `kind` and a timestamp - and a client answers a post or facilitator frame by reading
        `GET .../threads/{threadId}/posts?since=<cursor>`, and a poll frame by re-reading the
        poll. That is deliberate and it is the most important property of this endpoint: every
        byte a member renders still passes a row-level policy on an ordinary request, no
        member-authored text and no model output enters the message broker, and a poke is
        idempotent so a client that missed one loses nothing.


        **A facilitator post arrives under the same `result` event as a member post**, with `kind: FACILITATOR` and the facilitator post's id in `postId`. A client
        need not branch on it: the cursor read returns both lists, and a client written before
        facilitator posts existed re-reads the thread exactly as it would for a post.


        **The subscription cannot outlive the token that authorised it.** Its lifetime is
        `min(a configured ceiling, the access token's expiry minus a skew)`. Ten seconds before
        that it sends an `expiring` event carrying the reason, then `done`, then closes - so a
        reconnect is a scheduled hand-off rather than a discovered dead socket. Clients MUST wait
        a jittered backoff before reopening: every subscription on a replica ends at the same
        moment when that replica drains.


        Event names are `result` (a post or a facilitator post), `poll` (a poll opened, voted
        in or closed), `expiring`, and `done`. Unknown names must be ignored.
      tags:
        - discussions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  SSE frames. A `result` event's `data` is a `DiscussionLivePoke` with `postId`
                  set (`kind` `POST` or `FACILITATOR`); a `poll` event's is one with `pollId`
                  set; an `expiring` event's is `{ "reason": "lifetime" | "shutdown" }`.
                contentMediaType: application/json
                contentSchema:
                  $ref: '#/components/schemas/DiscussionLivePoke'
        '401':
          description: Missing or unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member of this org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '429':
          description: >
            The caller's request budget is spent (`ATLAS-SYS-004`, with `Retry-After`), or
            the live link is at its connection budget for this organisation or this server
            (`ATLAS-FRM-010`, no `Retry-After`: it clears when a connection closes - close a
            tab). Branch on the `errorCode`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: >
            The access token has too little time left to open a link worth having
