  /o/{orgId}/resources/{resourceId}/content/blocks/{blockId}/re-presentation:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The resource being read
      - name: blockId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: >
          A block of that resource's CURRENT document. Resolved against the
          document derived from the resource server-side - a block belonging to
          another document is `204`, never that block's content
    post:
      operationId: rePresentBlock
      summary: Re-present one block the way this learner prefers
      description: >
        A1's reader surface. One block of the official copy, rewritten into one
        of six forms, labelled and cited. The official copy is never changed
        - this references it.


        POST RATHER THAN GET, ALTHOUGH IT READS. It can cause a paid gateway
        call, so it is neither safe nor cacheable in the sense a GET promises,
        and a proxy or browser replaying one would spend the org's allowance. The
        kind travels in the body for the same reason query strings are avoided
        here: anything logging request URLs on this path is somewhere a learner
        profile could be reconstructed from traffic.


        THE LEARNER COMES FROM THE JWT. No parameter names an account.


        THE FAMILY MUST BE SWITCHED ON FOR THIS LEARNER, and the check is
        against the RESOLVED setting (`enabled` on `RecommendedFeature`) rather
        than the engine's `autoEnabled` - so a learner who overrode the engine
        gets what they chose. A kind whose family is off is REFUSED and never
        quietly replaced by one they do have; a silent substitution would record
        a learner's choice and then overrule it.


        204 MEANS "SHOW THE PLAIN BLOCK", and it is an ordinary outcome rather
        than a failure. A learner with no profile, a block with no text (an
        image, a code listing), an oversized block, a provider outage and a draft
        that failed its faithfulness check all answer identically: the plain copy
        is always available, and learning never stops because an AI step did. A
        client should tell the learner their
        request registered and must not guess why; the api deliberately does not
        distinguish these.


        THE TEXT IS UNTRUSTED. It is model output shaped by an uploaded document
        and is NOT escaped here. Sanitise it at render, exactly like
        the official copy it sits beside.


        EXACTLY ONE CITATION, always: the model rewrites one block and its grounding is
        that block's own text. `citations` is never empty (all AI output is
        cited) and never longer than one (this pipeline
        performs no synthesis).
      tags: [personalisation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RePresentRequest'
      responses:
        '200':
          description: The labelled, cited rewrite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RePresentation'
        '204':
          description: >
            Nothing to show - render the plain block. Ordinary, not an error;
            see the operation description for the several causes this
            deliberately does not tell apart.
        '400':
          description: >
            The kind is missing or is not one of the six (`ATLAS-VAL-001`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource in this org (`ATLAS-SYS-005`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The feature family behind this kind is not switched on for the
            caller (`ATLAS-PER-002`, problem type `.../family-not-enabled`, with
            a `family` property naming it). Point them at the personalisation
            panel.


            409 rather than 403: nothing is forbidden and no role is missing -
            the feature exists, works, and is off for this learner, which is one
            toggle away. Every plan includes the whole feature set, so this must
            never read as an entitlement.


            DISTINCT FROM `ATLAS-PER-001`, which means nothing consumes the
            family yet and is a release away rather than a toggle away.


            THE MESSAGE DOES NOT SAY WHETHER THE LEARNER SWITCHED IT OFF OR
            NEVER SWITCHED IT ON. Both produce this code, the remedy is the
            same, and asserting either would be false for half the callers who
            see it. A client must not add that claim back in its own copy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            TWO DIFFERENT CONDITIONS SHARE THIS STATUS AND A CLIENT MUST NOT
            CONFLATE THEM. Branch on the `errorCode`, never on the status
            alone.


            `.../problems/rate-limited` (`ATLAS-SYS-004`) - too many requests.
            TRANSIENT, NOTHING WAS SPENT, and `Retry-After` says how many
            seconds to wait. THIS IS NOT ALWAYS PER-USER: the per-org
            request limit applies here too, so it may be the organisation's
            budget rather than the caller's, and any message shown must stay
            subject-neutral - a learner refused because a colleague was busy did
            nothing unusual.


            `.../problems/ai-budget-exhausted` (`ATLAS-BIL-001`) - the ORG's AI
            allowance for today is spent. Not transient, not about this learner,
            and it clears tomorrow rather than in seconds.


            `.../problems/personal-ai-budget-exhausted` (`ATLAS-BIL-002`) - the
            CALLER's OWN daily allowance is spent, and their organisation may
            have plenty left. Also clears tomorrow. WHEN BOTH
            CEILINGS ARE SPENT THIS IS THE ONE RETURNED, deliberately: a member
            at their own limit must never be told their organisation is out of
            credit, which is a claim about somebody else's money made to the one
            person who cannot check it. Any message shown must not mention the
            organisation.


            Telling a learner who clicked twice quickly that their organisation
            is out of AI credit is the specific failure this split exists to
            prevent. All three degrade to plain content, so learning never stops.


            NEITHER SHOULD DRIVE AN "AI EXTRAS PAUSED" BANNER. Read
            `GET /o/{orgId}/ai-allowance` for that - it answers the question
            directly and has a third value for "cannot tell".
          headers:
