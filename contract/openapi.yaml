  /o/{orgId}/resources:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
    get:
      operationId: listResources
      summary: List the org's resource library
      description: >
        One page of the org's resources, newest first. Open to any
        member - browsing is what a library is for, and the org scope is what
        bounds it. In-flight resources ARE listed, with their processing state,
        rather than hidden.
        Soft-deleted resources are NOT - they are listed by
        `/resources/trash`, behind its own Admin/Moderator gate.
        Filtering by course arrives with that step.


        **What a USER sees is narrower than what an Admin/Moderator sees**: a FAILED display version is omitted entirely for a USER -
        no row and no placeholder - because a learner can do nothing about a failed
        upload, while retry, re-upload and reading the failure reason are all
        Admin/Moderator acts. Requesting `status=FAILED` as a USER therefore yields
        an empty page rather than an error.


        This hides fewer resources than it first appears: the display version is
        current-else-latest and supersede only fires on a READY seal, so a failed
        v2 over a live v1 still displays the v1 and stays visible to everyone. What
        a USER loses is a first upload that never succeeded.
      tags: [content]
      security:
        - bearerAuth: []
        - apiKeyAuth: [content:read]
        - delegatedPassAuth: [content:read]
      parameters:
        - name: status
          in: query
          required: false
          description: >
            Restrict to these states; repeat the parameter to pass several. Omitted
            means all of them. For a USER the result is always intersected with the
            non-FAILED states (see above).
          schema:
            type: array
            items:
              type: string
              enum: [AWAITING_UPLOAD, SCANNING, READING, BUILDING, READY, FAILED]
        - name: q
          in: query
          required: false
          description: >
            Keyword search: restrict to resources whose TITLE
            contains this, case-insensitively. Blank or omitted means all of them.


            It NARROWS rather than replaces - it composes with `status`, with the
            USER rule above, with the org scope and with the trash exclusion, so no
            search reaches anything the plain listing would not have shown.


            `%` and `_` match THEMSELVES; they are not wildcards to the caller.


            Searching inside a document's content is a different question answered
            by meaning rather than substring. It is served for ONE lecture at a time
            by `POST /o/{orgId}/resources/{resourceId}/search`. An org-wide
            search inside content still does not exist: it has no single version
            to authorise against and no per-document bound on its cost, and is
            tracked separately.


            The length ceiling is measured on what you SEND, before the api trims
            surrounding whitespace - so a 100-character term padded with a space is
            101 characters and is refused.
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size; capped so a caller cannot request an unbounded page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
      responses:
        '200':
          description: One page of the library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
        '400':
          description: An out-of-range page or size, or a search term over 100 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createResource
      summary: Create a resource and get a presigned upload URL
      description: >
        Creates a resource in AWAITING_UPLOAD and returns a short-lived presigned
        PUT URL the client uploads the file to, DIRECT to object storage. Admin/Moderator only (a private org's owner holds ADMIN);
        a User is refused by role. After the PUT, call the complete endpoint to
        confirm receipt and fingerprint the bytes.


        The URL is bound to `sizeBytes` and to the object not already existing,
        both SIGNED, so the store accepts exactly one body of
        exactly that length, once. The client MUST send `If-None-Match: *` with
        the PUT and a body of exactly `sizeBytes` - omitting either breaks the
        signature. Both upload gates run HERE, before a URL exists: an oversize
        declared size is 413 and an unaccepted content type is 415, so a refused
        upload never reaches storage at all.
      tags: [content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '201':
          description: The resource was created; PUT the bytes to uploadUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResourceResponse'
        '400':
          description: Validation failed - e.g. a blank title (problem type `.../problems/validation`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not an Admin/Moderator of this org (`ATLAS-ORG-003`), or not a member /
            no such org (`ATLAS-ORG-002`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The organisation's storage allowance would be exceeded by this upload
            (`ATLAS-CNT-025`). The problem carries `storedBytes`; retire an old version or
            remove a resource, then try again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: >
            The declared `sizeBytes` exceeds the upload size ceiling (`ATLAS-CNT-002`).
            Refused before a URL is issued, so no bytes move.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: >
            The declared `contentType` is not an accepted document type
            (`ATLAS-CNT-007`). The detail names the
            accepted set; `GET .../resources/upload-policy` returns it too.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/trash:
