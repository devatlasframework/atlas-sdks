    get:
      operationId: listWebhookEndpoints
      summary: An application's webhook endpoints
      description: >
        The addresses ATLAS calls for this application, newest first. Readable by ADMIN, MODERATOR and USER.


        **No response here ever contains a signing secret.** The listed shape has
        no field one could occupy. Unlike an API key the secret IS retrievable -
        it is encrypted rather than hashed, because the webhooks screen shows it
        beside the address - but it is retrieved through
        `revealWebhookSecret`, which is an operation of its own.


        `nextCursor` is always null: an application holds a bounded number of
        endpoints, so one response is always the whole list.
      tags: [developer]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The application's endpoints, newest first - never with a secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointPage'
        '401':
          description: Missing/unusable credential (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            An API key (no webhook operation is key-reachable, `ATLAS-ORG-003`), or
            not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such application, or not a developer account (`ATLAS-SYS-005` /
            `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: >
        Registers an address for ATLAS to call and mints its signing secret. Requires ADMIN or MODERATOR.


        **`https` only, in every environment, and the address is checked again
        at send.** A registration is refused if it is not `https`, carries a
        fragment, contains whitespace or is longer than 512 characters. That is
        a shape check. The one that matters happens each time a message is
        sent: ATLAS resolves the host and refuses to call it if any resolved
        address is not a public one - loopback, link-local, private, unique-local
        and carrier-grade-NAT ranges are all refused, and redirects are never
        followed. A name that resolves publicly today and privately tomorrow is
        refused tomorrow, because the check is at send and not here.


        **Your endpoint must be reachable from the public internet.** There is no
        setting that relaxes this, including in development - use a public tunnel
        rather than `localhost`.


        **The secret is returned here and is also retrievable later.** Store it
        with your application's other secrets and verify every message with it;
        see the `webhooks` section of this document for the exact algorithm.
      tags: [developer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: The endpoint was registered, with its signing secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCreatedResponse'
        '400':
          description: >
            Validation failed - not an `https` address, a fragment or whitespace
            in the URL, or an empty event list
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable credential (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A USER (registering is ADMIN/MODERATOR, `ATLAS-ORG-003`), an API key
            (no webhook operation is key-reachable), or not a member / no such org
            (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such application, or not a developer account (`ATLAS-SYS-005` /
            `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The application is archived (`ATLAS-DEV-003`), it already holds the
            maximum number of endpoints (`ATLAS-DEV-015`), or that address is
            already registered on it (`ATLAS-DEV-016`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/dev/apps/{appId}/webhooks/{webhookId}:
    parameters:
