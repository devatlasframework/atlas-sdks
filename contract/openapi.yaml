      summary: The author acknowledges a review
      description: >
        Only the submission's AUTHOR, and only from `SUBMITTED`.


        A `BEFORE UPDATE` trigger bounds this to the two state stamps: a policy's
        `WITH CHECK` pins the post-image's predicate and never the SET list, so without
        it this transition would also admit rewriting the marks and the reviewer's name.
      tags:
        - peer-review
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerReviewResponse'
        '403':
          description: The caller is not this submission's author (`ATLAS-REV-004`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such review (`ATLAS-SYS-005`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Not `SUBMITTED` (`ATLAS-REV-003`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/achievements:
    get:
      operationId: getAchievements
      summary: The learner's points, badges, streak and board (F8)
      description: >
        The achievements hub in one read. `User+`, and the
        caller is always the JWT subject - there is no route in ATLAS that returns
        another member's points, attempts, progress or mastery, because per-member
        detail is never shown to an organisation.


        **200 WHETHER THE LEARNER HAS OPTED IN OR NOT.** `F8` is opt-in, and
        opted-out is a STATE of this screen - "a single 'Turn on achievements?'
        card". So an opted-out learner gets `optedIn: false` with every other field
        absent, and the screen renders the offer. A 403 or 404 here would leave the
        opt-in gate nowhere to live.


        **Absent, never zeroed.** A learner with nothing to show gets nulls and an
        empty badge list rather than zeros: a region asserts data, so a region with
        no data is not a region with zeros in it, and "0 points" is a claim about the
        learner rather than about the feature being off.
      tags: [gamification]
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The organisation's id
      responses:
        '200':
          description: The hub, in whichever of its two states applies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementsView'
        '401':
          description: Missing or unusable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such organisation, or one the caller does not belong to -
            deliberately indistinguishable (`ATLAS-SYS-005`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/achievements/board:
    put:
      operationId: publishToBoard
      summary: Publish the caller's total to their organisation's leaderboard
      description: >
        Copies the caller's current total onto the org's board, or restates it. **A deliberate act every time** - the board is a ledger a learner
        PUBLISHES, never a projection of their activity, so nothing here happens
        automatically and no other member's figure is ever derived.


        A PUT rather than a POST: publishing twice is publishing once, and "this
        learner's entry on this board" has exactly one identity.
      tags: [gamification]
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The organisation's id
      responses:
        '200':
          description: The hub, with the board as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementsView'
        '401':
          description: Missing or unusable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such organisation, or not a member (`ATLAS-SYS-005`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            Either the caller has not switched `F8` on (`ATLAS-GAM-001`), or this
            organisation cannot have a board at all (`ATLAS-GAM-002`) - a PRIVATE org
            has one member, so there is nobody to compare with and publishing would be
            a promise the product cannot keep.


            409 rather than 403 in both cases: the caller is permitted, and the state
            is one that can change.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            Too many board writes (`ATLAS-SYS-004`). A per-caller budget only — a publish
            touches one row and pushes to nobody, so an organisation-wide window would let
            one member's enthusiasm refuse their colleagues. Nothing is written.
            `Retry-After` says how long to wait.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: leaveBoard
      summary: Leave the leaderboard
      description: >
        Leave the leaderboard. A DELETE of the published row rather than a flag: a
        withdrawal that leaves a row behind is a row somebody has to remember to
        filter, and the first read that forgets discloses what the learner withdrew.


        Idempotent - leaving a board you are not on succeeds, because the state it
        asks for is the state you are in. Answers the hub rather than 204 so the
        screen re-renders without a second round-trip.
      tags: [gamification]
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The organisation's id
      responses:
        '200':
          description: The hub, with the entry gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementsView'
        '401':
          description: Missing or unusable access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such organisation, or not a member (`ATLAS-SYS-005`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The caller has not switched `F8` on (`ATLAS-GAM-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            Too many board writes (`ATLAS-SYS-004`). The same per-caller budget the publish
            draws on, and it applies to leaving as well: withdrawing repeatedly is the same
            write. Nothing is changed. `Retry-After` says how long to wait.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          $ref: '#/components/responses/InternalError'
webhooks:
  resource.ready:
    post:
      operationId: onResourceReady
      summary: A lecture finished processing
      description: >
        Sent when a resource's first version finished processing and became the
        official copy.


        Fetch the resource with `getResource` to read its title, versions and
        block tree; this message carries ids and nothing else, because a webhook
        body leaves ATLAS for a machine on the public internet and nothing
        derived from an uploaded document travels without a reason.


        You will receive this for EVERY route to READY, including when the same
        bytes were already processed for somebody else and ATLAS reused the
        result. There is no way to tell the two apart, and that is deliberate.
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceWebhookEvent'
      responses:
        '2XX':
          description: >
            Any 2xx means you accepted it and ATLAS stops trying. Answer as soon
            as you have durably recorded the message, and do the work afterwards
            - ATLAS gives you ten seconds.
        default:
          description: >
            Anything that is not a 2xx - including a redirect, which ATLAS does
            not follow - is a failure and will be retried.
  resource.updated:
    post:
      operationId: onResourceUpdated
      summary: A lecture was replaced by a newer version
      description: >
        Sent when a new version superseded one that was already the official
        copy. `data.version_id` is the new one.


        Distinct from `resource.ready` because the difference cannot be
        recovered afterwards: once the pointer has moved, nothing in the data
        says whether this was a first publication or a replacement, and version
        numbers cannot answer it either.
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceWebhookEvent'
      responses:
        '2XX':
          description: Any 2xx means you accepted it and ATLAS stops trying
        default:
          description: Anything else is a failure and will be retried
  resource.failed:
    post:
      operationId: onResourceFailed
      summary: A lecture could not be processed
      description: >
        Sent when processing failed terminally. That version will never become
        the official copy, and nothing further will be attempted for it.


        **Subscribe to this one.** Without it, a pipeline waiting for
        `resource.ready` waits for ever on a document that cannot be parsed, and
        polling is the only way to find out - which is the thing this section
        exists to replace.


        `data.reason` is ATLAS's own name for the stage that refused. It is
        never a parser message and never a byte of the document.
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceWebhookEvent'
      responses:
        '2XX':
          description: Any 2xx means you accepted it and ATLAS stops trying
        default:
          description: Anything else is a failure and will be retried
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The short-lived signed access token from `/auth/login` or
        `/auth/refresh`, sent as `Authorization: Bearer <token>`.
    apiKeyAuth:
      type: http
      scheme: bearer
      description: >
        A developer API key, sent as `Authorization: Bearer atl_sk_live_...`. It is a **server-side** secret: ATLAS answers no cross-origin
        request, so a key a browser can send has already been exposed.


        Keys are created in the developer portal and the secret is shown once.
        Rotating one mints a successor and leaves the old key working for a
        short overlap; revoking one takes effect on the very next call, because
        key checks are not cached.


        Only the operations that declare this scheme accept a key. Everything
        else refuses one with 403, identically for the key's own organisation
        and any other, so the refusal cannot be used to probe what exists.


        **Scopes.** Every operation that accepts a key names the one
        scope it costs, and a key holding a different set is refused `403`
        with `ATLAS-SYS-007`, naming the scope required. There is no scope
        meaning "everything", no hierarchy and no implication: `content:write`
        does not grant `content:read`. An operation that names no scope is one
        no key reaches.
      x-atlas-scopes:
        content:read: Read your organisation's lectures, courses and their official content
        content:write: Upload new lectures and change your organisation's content
        profiles:read: Read learner profile scores and highlights
        ai:use: Get ATLAS's personalisation recommendations for your learners
        search:use: Search inside your organisation's lectures
        end-users:manage: Link and unlink your own learners
        webhooks:manage: Add, change and remove webhook addresses
        usage:read: Read how much of your allowance your apps have used
    delegatedPassAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A delegated pass, sent as `Authorization: Bearer eyJ...`. A person
        signed in, read a consent screen and approved specific permissions; the
        pass acts **as that person**, limited to what they agreed to.


        **The third scheme, and the one whose reach is a person's own data rather
        than an organisation's.** An API key publishes an organisation and no
        person. A delegated pass publishes a real ATLAS user, so every row-level
        rule keyed to that user matches - which is why what a pass may reach is a
        deliberately short allow-list rather than everything the person can see.
        Today that is the content-read operations and nothing else, and
        `x-atlas-scopes` lists exactly the permissions a pass can be granted.


        **How to get one.** Send the person to `/oauth/authorize` on the ATLAS web
        address you were given, with `client_id`, `org_id`, `redirect_uri` (exactly
        as registered on your application), `scope` (space-separated), `state`,
        `code_challenge` and `code_challenge_method=S256`. They sign in if they need
        to, read what you are asking for and decide. On Allow, ATLAS sends them back
        to your `redirect_uri` with a one-time `code`; your server exchanges it at
        `exchangeDelegatedToken` (`POST /oauth/token`) together with the
        `code_verifier`, and renews the pass there with the refresh token.
        `x-atlas-issued-by` on this scheme names that operation, so a client
        generator can find the exchange without reading this paragraph. It names an
        operation for your server to call, never a flow for a tool to run.


        **Declared as a bearer token, not as an OAuth flow, and on purpose.** This
        contract names no host: no environment has a public one yet, and the
        consent page and the token endpoint are served from different addresses, so
        no URL written here could be right everywhere. The token exchange also takes
        JSON rather than RFC 6749's form encoding, so an OAuth flow declared here
        would send documentation tools and generated clients through an "Authorize"
        step the endpoint refuses. A tool rendering this contract may accept a pass
        to send with requests; it must not try to obtain one itself.


        **`profiles:read` is not among the permissions**, and will not be by
        accident: a learner's profile and questionnaire answers are in the tier no
        plan, setting or role unlocks. Serving them to a third party the person has
        themselves authorised is a coherent thing to want and a product decision
        with its own public announcement, not a side effect of building this flow.


        **Withdrawal is immediate.** Every request re-reads the grant, so a person
        who disconnects an application in their settings has disconnected it before
        its next call - not at the end of the pass's lifetime.
      x-atlas-scopes:
        content:read: Read your organisation's lectures, courses and their official content
      x-atlas-issued-by: exchangeDelegatedToken
  headers:
    RetryAfter:
      description: >
        Seconds to wait before retrying. Sent with every `429` raised by a request-rate
        limit. A `429` reporting an exhausted AI credit allowance or a full discussion
        live-link carries no wait, because neither clears after an interval — see the
        response-header note in the API description.
      schema:
        type: integer
    RateLimitLimit:
      description: >
        The caller's own request ceiling for one window. See the response-header note in
        the API description for when these are sent and what their absence means.
      schema:
        type: integer
    RateLimitRemaining:
      description: >
        Requests the caller has left in the current window against their overall request
        rate, floored at zero. Reading it does not consume budget. A `429` raised by a
        narrower per-operation limit leaves this value unchanged, so it can read a healthy
        number beside a refusal — see the response-header note in the API description.
      schema:
        type: integer
    RateLimitReset:
      description: >
        Seconds until the caller's current window ends and the count starts again.
      schema:
        type: integer
  responses:
    InternalError:
      description: >
        An unexpected failure (`ATLAS-SYS-001`). **The one response shape every operation
        in this API shares**, which is why it is declared on all of them rather than left
        implicit: a generated client cannot type a failure the contract does not describe.


        **Quote the `errorId`.** It is a UUID generated per failure and recorded on the
        server beside the failure itself, and it is the only thing that connects a report
        to the cause. Nothing else about the failure crosses the wire — the response never
        carries internals, stack traces, or any indication of whether the resource
        involved exists — so `detail` is deliberately the same sentence every time. That
        is a guarantee rather than a limitation: quote the `errorId` and support can find
        the rest. A failure the server reports before ATLAS's own handling runs carries the code
        but no `errorId`, and its `detail` says only that an unexpected error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Throttled:
      description: >
        Too many requests (`ATLAS-SYS-004`): the caller's own request budget for this
        window is spent, or their organisation's is. Wait `Retry-After` seconds and send
        the request again; nothing was done.


        `RateLimit-Remaining` reads zero on this refusal whichever budget refused - the
        caller's own, or their organisation's - because zero is what is available to them;
        `RateLimit-Limit` and `RateLimit-Reset` stay the caller's own. How much an
        organisation has collectively spent is not something any member's response carries.


        This is the request-rate refusal every authenticated operation can answer, declared
        on each so a generated client can type it. An operation with a narrower budget of its
        own, or one that spends AI credit, declares that `429` in its own words instead.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: >
        Too many requests (problem type `.../problems/rate-limited`,
        `ATLAS-SYS-004`). Deliberately ONE shape for both the per-IP/global
        request budget and the account lockout after repeated wrong
        passwords - the two must be indistinguishable, or the difference
        would reveal whether an account exists.


        On the sign-in endpoints this carries `Retry-After` and **no** rate-limit counters:
        a remaining count would tell the two cases above apart at a glance and rebuild the
        difference this shape exists to remove. Authenticated operations that answer with
        this shape do carry the counters, like every other authenticated response.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, acceptTerms]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          maxLength: 255
          description: Optional; derived from the email local-part when absent
        timeZone:
          type: string
          maxLength: 64
          description: >
            Optional. The learner's IANA zone NAME, detected by the browser and
            CONFIRMED by them at sign-up. Absent is a real
            answer - a headless caller, or a client that cannot resolve one, stores
            null and falls back to UTC.


            **An offset is refused.** `+05:30`, `UTC+05:30` and `Z` all parse as
            zones in most libraries and are exactly what ATLAS refuses, because
            an offset cannot survive a daylight-saving change. So are the legacy
            single-word ids (`Japan`, `UTC`, `EST5EDT`). A rejected value is a 400
            on this field, never a 500.
        acceptTerms:
          type: boolean
          description: Must be true; the accepted ToS/privacy versions are recorded
    UpdateTimeZoneRequest:
      type: object
      required: [timeZone]
      properties:
        timeZone:
          type: string
          maxLength: 64
          description: >
            An IANA zone NAME such as `Asia/Colombo`. Offsets
            and legacy single-word ids are refused with a 400.
        pinned:
          type: [boolean, 'null']
          description: >
            Pin this as the HOME zone, which suppresses the zone-mismatch
            prompt. Omit or null to leave the pin as it was.


            **The zone is required even when only the pin is changing**, and that is
            deliberate: pinning is a statement about a PARTICULAR zone, so a request
            that set the pin alone could pin a learner to a value they were in the
            middle of changing.
    AchievementsView:
      type: object
      required:
        [
          optedIn,
          points,
          level,
          pointsToNext,
          levelProgress,
          currentStreak,
          longestStreak,
          badges,
          board,
        ]
      description: >
        The achievements hub.


        **Every field but `optedIn` and `badges` is ABSENT rather than zeroed when
        there is nothing to say.** A region asserts data, so a region with no data is
        not a region with zeros in it - "0 points" is a claim about the learner
        rather than about the feature being off. A client must omit those regions,
        never render a zero in them.
      properties:
        optedIn:
          type: boolean
          description: >
            Whether this learner has switched `F8` on. **False is a screen, not an
            error** - opted-out is a state of this hub ("a single 'Turn
            on achievements?' card"), and every other field is then absent.
        points:
          type: [integer, 'null']
          format: int64
          description: The learner's own total in this org, summed from the award ledger
        level:
          type: [integer, 'null']
          description: The level that total reaches. Never 0 - a learner with no points is level 1.
        pointsToNext:
          type: [integer, 'null']
          description: >
            Points remaining to the next level, or null at the top of the curve.
            Null rather than 0, because 0 would render as a full meter about to tick
            over - a different and false statement.
        levelProgress:
          type: [integer, 'null']
          description: >
            How far through the CURRENT level this total is, 0-100. Null when the
            learner is opted out.


            **Sent rather than derived, and a client must not recompute it.** The
            obvious client sum - `points / (points + pointsToNext)` - measures from
            zero instead of from the level's own floor, so at 149 points it renders
            60% for a learner who is 99 of the way through a 100-point level. The
            level curve lives in one place so the meter and the caption beside it
            cannot disagree.
        currentStreak:
          type: [integer, 'null']
          description: >
            Consecutive active days ending today OR YESTERDAY, counted in the
            LEARNER's own time zone.


            Yesterday counting is what makes a streak usable: if a run had to include
            today, every learner's streak would read as 0 from local midnight until
            they next studied, so someone opening this over breakfast would be told
            they had broken a streak they had not.
        longestStreak:
          type: [integer, 'null']
          description: The learner's best run ever, which is what the streak badge reads
        badges:
          type: array
          description: >
            Earned badges oldest first, plus the NEXT unearned one - "earned
            + next-up". Empty when the learner is opted out.
          items:
            $ref: '#/components/schemas/BadgeView'
        board:
          oneOf:
            - $ref: '#/components/schemas/BoardView'
            - type: 'null'
          description: >
            Null in two distinct cases, and a client renders nothing for both: the
            learner is opted out, OR this organisation cannot have a leaderboard at
            all because it has one member ("in a private org
            the board does not render at all, because there is nobody to compare
            with").


            That second case is NOT the same as `ranked: false`, which means "too few
            publishers YET" - a wait rather than a never. Conflating them puts a Join
            button in front of a learner in their private org that can only ever
            answer 409.


            An opted-out learner who is still PUBLISHED is the exception: they get a
            board with `published: true` and `ranked: false`, so the screen can offer
            to remove their entry. Turning achievements off does not withdraw a
            publication, and the control that does must stay reachable.
    BadgeView:
      type: object
      required: [code, label, earned]
      properties:
        code:
          type: string
          description: Stable constant name, for keys and tests
        label:
          type: string
          description: The learner-facing label
        earned:
          type: boolean
          description: >
            Whether this learner has it. **A client must put this in the accessible
            NAME**, not only in colour, opacity or a padlock glyph - an icon never
            carries meaning without a label, and the
            prototype's shelf carried the distinction in exactly those three visual
            channels and nothing else.
    BoardView:
      type: object
      required: [ranked, published, entries, yourRank, yourPoints, percentile, publisherCount]
      description: >
        The organisation's leaderboard. **Read from a table members
        PUBLISH into**, never projected from anyone's activity: per-member scores
        are never shown to an organisation, so no route
        returns another member's points, attempts, progress or mastery.
      properties:
        ranked:
          type: boolean
          description: >
            Whether the ranked list may be shown. **FALSE IS A PRIVACY STATE, NOT AN
            EMPTY ONE, AND THE TWO MUST NOT RENDER THE SAME.** Below the anonymity
            floor there is a real board this deliberately withholds: ATLAS
            suppresses an aggregate below a minimum group size so a "team average" of
            two cannot expose an individual, and a ranked list of two names is the
            sharpest form of that. A client that renders "no one here yet" states
            something false about the org.
        published:
          type: boolean
          description: Whether the caller has published their own entry
        entries:
          type: array
          description: The top N, highest first. Empty when `ranked` is false.
          items:
            $ref: '#/components/schemas/BoardRow'
        yourRank:
          type: [integer, 'null']
          description: >
            The caller's position, or null when they have not published OR sit
            outside the returned top N. The percentile is what tells an off-board
            learner where they stand.
        yourPoints:
          type: [integer, 'null']
          description: >
            The figure the caller published, which may LAG their own total: it is
            copied at publish time rather than joined live, because joining it would
            make the board a projection of every member's ledger.
        percentile:
          type: [integer, 'null']
          description: >
            Where the caller stands among publishers: `F8`'s non-interactive
            item, and what stands in for the ranked list below
            the floor - a percentile discloses nothing about a SPECIFIC member.
        publisherCount:
          type: integer
          format: int64
          description: >
            How many members have published - a HEAD COUNT, the quantity the floor is
            checked against.


            ZERO when `ranked` is false, deliberately, and not the real number: in a
            two-member org "1 person has published" tells the reader whether their one
            colleague did - a per-member fact escaping the branch whose entire purpose
            is to suppress per-member facts.
    BoardRow:
      type: object
      required: [userId, name, points, rank]
      properties:
        userId:
          type: string
          format: uuid
          description: >
            The member. A client marks the reader's own row from this, never by
            matching the name.
        name:
          type: string
          description: >
            Their display name - already visible to every member in the member list
            and on every forum post. What the board discloses is the FIGURE, which is
            why publishing is a choice.
        points:
          type: integer
        rank:
          type: integer
          description: 1-based position
    RegisterResponse:
      type: object
      required: [id, email, name, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        emailVerified:
          type: boolean
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The raw token from the emailed link
    VerifyEmailResponse:
      type: object
      required: [verified]
      properties:
        verified:
          type: boolean
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          maxLength: 100
          description: The raw token from the emailed reset link
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: The new password; same length floor as sign-up
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          maxLength: 128
          description: >
            No minimum here (unlike register) - only the generic 401 may
            speak about a submitted password
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken]
      properties:
        accessToken:
          type: string
          description: 'Signed JWT; send as `Authorization: Bearer <token>`'
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds; refresh before it elapses
        refreshToken:
          type: string
          description: >
            Opaque single-use secret; rotated on every refresh, revoked
            server-side by logout (and by password reset / session
            management later)
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    GoogleExchangeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 100
          description: >
            The raw single-use code from the finish page's `?code=` param
    MfaChallengeResponse:
      type: object
      description: >
        The password (or Google) round passed but a second factor is owed -
        NO tokens yet. Clients branch on `mfaRequired` to tell
        this login-200 variant from `TokenResponse`.
      required: [mfaRequired, mfaToken, enrollmentRequired]
      properties:
        mfaRequired:
          type: boolean
          enum: [true]
        mfaToken:
          type: string
          description: >
            Opaque, short-lived (minutes), single-use pending-login token.
            Spend it at `/auth/mfa/challenge` - or, when
            `enrollmentRequired`, at `/auth/mfa/setup` +
            `/auth/mfa/confirm` - never both
        enrollmentRequired:
          type: boolean
          description: >
            True only for a super admin who has not enrolled yet: route to
            MFA setup instead of the code screen (A8)
    MfaChallengeRequest:
      type: object
      required: [mfaToken, code]
      properties:
        mfaToken:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 32
          description: >
            A 6-digit authenticator code or a backup code - one field, the
            shapes are disjoint; case and grouping (dashes/spaces) forgiven
    MfaSetupRequest:
      type: object
      properties:
        mfaToken:
          type: string
          maxLength: 100
          description: >
            ENROLL-mode pending-login token - only for the unenrolled-super-
            admin mid-login path; ignored when a valid bearer is presented.
            The Settings path may send no body at all.
    MfaSetupResponse:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: >
            The shared secret, unpadded Base32 - shown once for manual entry
        otpauthUri:
          type: string
          description: >
            `otpauth://totp/...` provisioning URI; render as a QR
            client-side - the api never generates images
    MfaConfirmRequest:
      type: object
      required: [code]
      properties:
        mfaToken:
          type: string
          maxLength: 100
          description: As in `MfaSetupRequest`
        code:
          type: string
          maxLength: 32
          description: >
            A current authenticator code (backup codes do not exist until
            confirm succeeds)
    MfaConfirmResponse:
      type: object
      required: [backupCodes, tokens]
      properties:
        backupCodes:
          type: array
          items:
            type: string
          description: >
            Single-use recovery codes (`XXXX-XXXX-XXXX`), shown exactly
            once - only hashes survive server-side
        tokens:
          oneOf:
            - $ref: '#/components/schemas/TokenResponse'
            - type: 'null'
          description: >
            The token pair when confirm was driven by an ENROLL `mfaToken`
            (enrolment completed the sign-in); null on the bearer path - a
            session already exists
    MfaDisableRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 32
          description: >
            A CURRENT second-factor code - TOTP or backup; factor
            possession is the proof, not the password
    MeResponse:
      type: object
      required:
        [
          id,
          email,
          name,
          emailVerified,
          superAdmin,
          mfaEnabled,
          welcomed,
          privateOrgId,
          timeZone,
          timeZonePinned,
        ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        emailVerified:
          type: boolean
        superAdmin:
          type: boolean
        mfaEnabled:
          type: boolean
          description: >
            Whether a confirmed TOTP enrolment exists - the security settings
            render their MFA on/off state from this
        welcomed:
          type: boolean
          description: >
            Whether this ACCOUNT has been shown the welcome screen and chose one of
            its two doors. The web first-run gate turns on this plus
            questionnaire progress; false sends the learner to `/welcome`.


            Derived from a timestamp the api keeps but never serialises, the way
            `mfaEnabled` is. Per account rather than per device on purpose: the
            cookie this replaced was inherited by whoever signed in next on the
            same browser, so the second account on a shared machine never saw the
            welcome screen.
        privateOrgId:
          type: string
          format: uuid
          description: >
            The account's automatic single-member PRIVATE org - the
            web app's default landing. Every account has
            exactly one; the org switcher lists the rest.
        timeZone:
          type: [string, 'null']
          maxLength: 64
          description: >
            The learner's IANA zone NAME - `Asia/Colombo`, never an offset such
            as `+05:30`. Absent or null means the account
            has never set one, which is a real state: everything then falls back
            to UTC, as it did before the field existed.


            Sent verbatim rather than derived, unlike `welcomed`: the allow-list
            this response is bars credentials and TIMESTAMPS, and this is neither.
            It rides here specifically so the zone-mismatch check - compare
            the browser's current zone with the saved one - costs no extra call.


            **A client must never write this from a detected value on its own.**
            The rule is "detect the change; don't switch silently": a
            mismatch may ASK, and only the learner's answer may call
            `PATCH /v1/auth/me/time-zone`.
        timeZonePinned:
          type: boolean
          description: >
            Whether the learner pinned this as their HOME zone. When
            true, a client must not show the zone-mismatch prompt at all - that is
            what the pin is for. It does not lock the field: the learner can still
            change their zone in their settings.
    SessionSummary:
      type: object
      description: >
        One active session (refresh-token rotation family) in the security settings listing. No device/IP/location fields - the platform does not capture them
        yet; the id and timestamps are enough to manage sessions.
      required: [sessionId, startedAt, lastActiveAt, expiresAt, current]
      properties:
        sessionId:
          type: string
          format: uuid
          description: The rotation-family id a revoke targets
        startedAt:
          type: string
          format: date-time
          description: When this session first signed in (its first token)
        lastActiveAt:
          type: string
          format: date-time
          description: The most recent token rotation in this session
        expiresAt:
          type: string
          format: date-time
          description: When the session lapses if left unused (furthest live token)
        current:
          type: boolean
          description: >
            True for the caller's own session (matched by the access token's
            `sid` claim) - the "this device" marker
    OrgContextResponse:
      type: object
      description: >
        The active org as the caller may see it (scope, not identity - the
        caller's own account lives on `/auth/me`)
      required: [orgId, name, type, role]
      properties:
        orgId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [PRIVATE, SHARED, DEVELOPER]
        role:
          type: string
          enum: [ADMIN, MODERATOR, USER]
          description: The caller's role in THIS org (roles are per-org)
    ApiScope:
      type: string
      description: >
        One permission an API key can hold. ATLAS publishes the whole
        vocabulary here, including the names that reach nothing yet: a name that
        appears later is a new version of the vocabulary, while a name that
        exists and reaches no operation is a promise this contract can be checked
        against.


        `content:write`, `profiles:read`, `search:use` and `webhooks:manage` are
        **reserved** at this release and name zero operations. `profiles:read` is
        reserved for a privacy reason rather than a scheduling one - a
        learner's profile is in the tier no plan, setting or role unlocks.
        `webhooks:manage` is reserved for a SECURITY reason: the webhook operations
        shipped at 1.5.0 and are reachable by a signed-in person only, because
        changing the address ATLAS dials and reading back what answered are, together,
        a port scanner - and a key is a credential that may sit in a CI job.
      enum:
        - content:read
        - content:write
        - profiles:read
        - ai:use
        - search:use
        - end-users:manage
        - webhooks:manage
        - usage:read
    ResourceWebhookEvent:
      type: object
      description: >
        The body of every message ATLAS sends you.


        ## Verifying it


        Every request carries an `ATLAS-Signature` header:


        `t=1758499200,v1=5a3f...`


        where `t` is a Unix timestamp in seconds and each `v1` is a lower-case
        hex HMAC-SHA256. To verify:


        1. Read the RAW request body as bytes, before any JSON parsing. Parsing
           and re-serialising will change the bytes and the signature will not
           match.

        2. Split the header on `,` and read the `t=` value and every `v1=` value.
           There can be MORE THAN ONE `v1` - see rotation below.

        3. Build the signed string as `t + "." + body` - the timestamp, a single
           full stop, then the raw body.

        4. Compute `HMAC-SHA256(secret, signedString)` with your endpoint's
           signing secret and render it as lower-case hex.

        5. Compare it against each `v1` using a CONSTANT-TIME comparison. If any
           matches, the message is authentic.

        6. Check that the `t` WHICH PRODUCED THE MATCH is within 300 seconds of
           your own clock. Use that one, not the last `t` you parsed - a header
           can carry more than one, and checking the freshness of a different
           timestamp from the one you verified defeats the window entirely.


        ## Rotation


        When you rotate a signing secret, ATLAS signs with the new secret AND the
        old one for the overlap window, sending two `v1` values. A verifier that
        tries every `v1` until one matches - step 5 above - keeps working
        throughout. A verifier that checks only the first will reject roughly
        half of what arrives during the window.


        ## Delivery is at-least-once, and `delivery_id` is how you deduplicate


        **You may receive the same message more than once.** That is expected
        rather than a fault: ATLAS retries a delivery whose outcome it did not
        observe, and a process that died after your server answered is
        indistinguishable from one that died before. Exactly-once delivery
        across a network is not available, and this contract says so rather than
        implying otherwise.


        `delivery_id` is stable for the life of a delivery. Every retry, and
        every replay you trigger from the webhooks screen, carries the SAME
        value. Record it and ignore a message whose `delivery_id` you have
        already processed, and duplicates cost you nothing.


        It is inside the signed body, so it cannot be forged or stripped in
        transit. The `ATLAS-Delivery-Attempt` header carries the attempt number
        as a convenience for your logs; it is OUTSIDE the signature, so do not
        make a decision on it.


        `event_id` identifies the OCCURRENCE. If you registered two endpoints
        that feed one system, both will receive the same `event_id` with
        different `delivery_id`s - deduplicate on `event_id` in that case.


        ## Ordering


        Nothing is promised. A retried `resource.ready` can arrive after the
        `resource.updated` that superseded it, because a failed delivery waits
        out its backoff while later ones go straight through. Use
        `occurred_at`.


        ## Answering


        Any 2xx means accepted. ATLAS waits ten seconds and follows no
        redirects, so answer as soon as you have durably recorded the message
        and do the work afterwards. A failure is retried with exponential
        backoff; after eight attempts the delivery is abandoned and shows in
        your delivery log, and after five consecutive abandoned deliveries ATLAS
        stops calling the endpoint until somebody re-enables it.
      required: [delivery_id, event_id, type, occurred_at, data]
      properties:
        delivery_id:
          type: string
          format: uuid
          description: >
            **The value to deduplicate on.** Stable across every retry and
            replay of this delivery, and inside the bytes the signature covers.
        event_id:
          type: string
          format: uuid
          description: >
            The occurrence. Shared by every endpoint that received this event;
            use it instead of `delivery_id` if two of your endpoints feed one
            system.
        type:
          type: string
          enum:
            - resource.ready
            - resource.updated
            - resource.failed
          description: Which event this is
        occurred_at:
          type: string
          format: date-time
          description: When it happened, UTC. Use this to order, not arrival time.
        data:
          $ref: '#/components/schemas/ResourceWebhookEventData'
    ResourceWebhookEventData:
      type: object
      description: >
        Ids, and one closed vocabulary. No title, no file name, no parser
        output: this body leaves ATLAS for a machine on the public internet, and
        nothing derived from an uploaded document travels without a reason. Read
        the rest with `getResource`, authenticated, under your own scope.
      required: [resource_id, version_id]
      properties:
        resource_id:
          type: string
          format: uuid
          description: The resource
        version_id:
          type: string
          format: uuid
          description: The version this event is about
        reason:
          type: string
          description: >
            On `resource.failed` only: ATLAS's own name for the stage that
            refused (for example `EXTRACT_FAILED`). Never a parser message.
    WebhookEventType:
      type: string
      description: >
        An event ATLAS can tell you about. Every name here is one the
        sender actually emits; a test binds this list to the emitter in both
        directions, so a name published and never sent is a defect rather than a
        plan.
      enum:
        - resource.ready
        - resource.updated
        - resource.failed
    WebhookEndpointState:
      type: string
      description: >
        Where an endpoint stands.


        `failing` means at least one delivery has been abandoned since the last
        success - ATLAS is still calling. `disabled` means it has stopped, after
        five consecutive abandoned deliveries or because somebody paused it; a
        person re-enables it from the webhooks screen.
      enum: [active, failing, disabled]
    WebhookDeliveryState:
      type: string
      description: >
        Where one delivery stands. `pending` covers both "not yet
        attempted" and "waiting out its backoff" - `attempts` and `dueAt` tell
        them apart.
      enum: [pending, delivered, abandoned]
    CreateWebhookRequest:
      type: object
      description: Register an address for ATLAS to call.
      required: [url, events]
      properties:
        url:
          type: string
          maxLength: 512
          description: >
            An `https` address with no fragment, no whitespace and no control
            characters. It must resolve to a public address every time ATLAS
            calls it - see `createWebhookEndpoint` for what that rules out.
          example: https://example.com/atlas/webhooks
        events:
          type: array
          minItems: 1
          description: Which events to send here. At least one.
          items:
            $ref: '#/components/schemas/WebhookEventType'
    UpdateWebhookRequest:
      type: object
      description: >
        Change an endpoint. Every field is optional; absent means leave
        it alone. `events` REPLACES the whole set when present, which is how you
        unsubscribe from something.
      properties:
        url:
          type: string
          maxLength: 512
          description: The new address, same rules as on registration
        events:
          type: array
          minItems: 1
          description: The complete new subscription set
          items:
            $ref: '#/components/schemas/WebhookEventType'
        enabled:
          type: boolean
          description: >
            `true` re-enables an endpoint ATLAS stopped calling, clearing its
            failure count. `false` pauses it without losing its history.
    WebhookEndpointResponse:
      type: object
      description: >
        A registered endpoint. **Never carries the signing secret** -
        this shape has no field one could occupy. Read it with
        `revealWebhookSecret`.
      required: [id, appId, url, events, state, consecutiveFailures, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        url:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        state:
          $ref: '#/components/schemas/WebhookEndpointState'
        consecutiveFailures:
          type: integer
          format: int32
          description: >
            Deliveries abandoned since the last success. Reset by any delivery
            that succeeds, and by re-enabling the endpoint.
        disabledAt:
          type: [string, 'null']
          format: date-time
          description: When ATLAS stopped calling, or null while it is calling
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WebhookEndpointCreatedResponse:
      type: object
      description: >
        An endpoint with its signing secret - returned by registration, rotation
        and the explicit reveal, and by nothing else.
      required: [endpoint, secret]
      properties:
        endpoint:
          $ref: '#/components/schemas/WebhookEndpointResponse'
        secret:
          type: string
          description: >
            The value to verify signatures with. On a rotation this is the
            SUCCESSOR; the predecessor is still being sent alongside it until
            `previousSecretValidUntil`.
        previousSecretValidUntil:
          type: [string, 'null']
          format: date-time
          description: >
            When the previous secret stops being sent, or null when no rotation is
            in progress.
    WebhookEndpointPage:
      type: object
      description: >
        The paging envelope. `nextCursor` is always null here - an application
        holds a bounded number of endpoints, so one response is the whole list.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointResponse'
        nextCursor:
          type: [string, 'null']
          description: Always null on this operation
    WebhookDeliveryResponse:
      type: object
      description: One message ATLAS owed this endpoint (an entry in the delivery log).
      required: [id, endpointId, eventId, type, state, attempts, dueAt, payload, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: >
            **The same value that travelled inside the signed payload as
            `delivery_id`.** A message your server logged can be found here by it.
        endpointId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
          description: The occurrence, shared with every other endpoint that received it
        type:
          $ref: '#/components/schemas/WebhookEventType'
        state:
          $ref: '#/components/schemas/WebhookDeliveryState'
        attempts:
          type: integer
          format: int32
          description: >
            Counted when ATLAS claims the delivery to send it, not when it
            fails - so an attempt is paid for even if the process sending it
            died before hearing an answer.
        dueAt:
          type: string
          format: date-time
          description: When the next attempt is due
        deliveredAt:
          type: [string, 'null']
          format: date-time
          description: When your server accepted it, or null
        abandonedAt:
          type: [string, 'null']
          format: date-time
          description: When ATLAS gave up, or null
        lastErrorClass:
          type: [string, 'null']
          description: >
            What went wrong, as a class name (`SocketTimeoutException`), a short
            name for a non-2xx (`HttpStatus500`), `AddressRefused` when ATLAS
            declined to dial, or `EndpointDisabled` when the endpoint was switched
            off between the claim and the call. **Never your server's response
            body.** Null on a delivery that succeeded.
        lastResponseStatus:
          type: [integer, 'null']
          format: int32
          description: >
            The numeric HTTP status, or null when nothing answered - and also null
            when a receiver answered outside 100-599, which ATLAS declines to store.
        payload:
          type: string
          description: The exact bytes that were signed and sent
        createdAt:
          type: string
          format: date-time
    WebhookDeliveryPage:
      type: object
      description: >
        The paging envelope, and the one in this section whose `nextCursor`
        really advances: a delivery log is not bounded. Pass it back as `cursor`
        until it is null.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryResponse'
        nextCursor:
          type: [string, 'null']
          description: The position to continue from, or null at the end
    WebhookTestResponse:
      type: object
      description: >
        What happened when ATLAS called the endpoint. Returned with `200`
        whatever the endpoint answered - your server's `500` is not this API's
        error.
      required: [delivered, addressRefused]
      properties:
        delivered:
          type: boolean
          description: Whether your endpoint answered 2xx
        status:
          type: [integer, 'null']
          format: int32
          description: The numeric HTTP status, or null when nothing answered
        reason:
          type: [string, 'null']
          description: >
            ATLAS's own description of what went wrong, or null on success.
            Never your server's response body, and never the address the host
            resolved to.
        addressRefused:
          type: boolean
          description: >
            `true` when ATLAS declined to dial at all - the address resolved to
            a network it will not call. Distinguished from a server that was
            reached and refused, because the two need completely different fixes.
    CreateAppRequest:
      type: object
      description: >
        Create-application request. Just a name - the developer account
        is the route's, never the body's.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Unique among the account's live applications, case-insensitively
        scopes:
          type: array
          description: >
            The scopes keys under this application may be minted with.
            A ceiling, not a grant - the application itself calls nothing.
            Omit it, or send an empty array, for an application whose keys reach
            only their own identity.
          items:
            $ref: '#/components/schemas/ApiScope'
        redirectUris:
          type: array
          maxItems: 8
          description: >
            Where an authorization response may be sent, for sign-in on behalf. **Matched as an exact registered literal** - never by prefix,
            never by host, never by pattern - so register every address you will
            use, spelled exactly as you will send it, including the scheme, any
            port and any trailing slash.


            `https://` only, except on `localhost` and `127.0.0.1`, which are
            allowed plaintext because a native or desktop client has nowhere else
            to listen. No fragment: a browser strips one before redirecting, so a
            registered value carrying `#` could never be matched.


            Replaced whole, never merged - send every address you want, not just
            the additions, because a merge could never express a removal. Omit the
            field to leave it alone; an empty array means none, and an application
            with none cannot be used for sign-in on behalf at all.
          items:
            type: string
            maxLength: 512
    UpdateAppRequest:
      type: object
      description: >
        Rename or archive an application. Both fields are optional: send
        only what you are changing, so a client altering one need not echo the
        other back and cannot revert a concurrent change by doing so.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        archived:
          type: boolean
          description: >
            true archives the application, false restores it. Archiving keeps its
            keys readable and stops new ones being minted; it is not a delete.
        scopes:
          type: array
          description: >
            Replaces the registered set whole - send every scope you want, not
            just the additions, because a merge could never express a removal.
            Omit the field to leave it alone; an empty array means none, and the
            two are different requests.


            **This does not change keys already minted.** A key carries its own
            set, fixed when it was created, so narrowing an application cannot
            break a running integration. To take a permission away from a
            credential that holds it, revoke the credential.
          items:
            $ref: '#/components/schemas/ApiScope'
        redirectUris:
          type: array
          maxItems: 8
          description: >
            Where an authorization response may be sent, for sign-in on behalf. **Matched as an exact registered literal** - never by prefix,
            never by host, never by pattern - so register every address you will
            use, spelled exactly as you will send it, including the scheme, any
            port and any trailing slash.


            `https://` only, except on `localhost` and `127.0.0.1`, which are
            allowed plaintext because a native or desktop client has nowhere else
            to listen. No fragment: a browser strips one before redirecting, so a
            registered value carrying `#` could never be matched.


            Replaced whole, never merged - send every address you want, not just
            the additions, because a merge could never express a removal. Omit the
            field to leave it alone; an empty array means none, and an application
            with none cannot be used for sign-in on behalf at all.
          items:
            type: string
            maxLength: 512
    AppResponse:
      type: object
      description: One application in a developer account
      required: [id, name, archived, keyCount, scopes, redirectUris, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
        keyCount:
          type: integer
          format: int32
          description: >
            Every key ever minted under this application, revoked ones included -
            the same figure the key list shows
        scopes:
          type: array
          description: The scopes keys under this application may be minted with
          items:
            $ref: '#/components/schemas/ApiScope'
        redirectUris:
          type: array
          description: >
            Where an authorization response may be sent, exactly as
            registered. Empty for an application that does not use sign-in on
            behalf.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiKeyStatus:
      type: string
      description: >
        A key's standing, derived from its timestamps rather than stored.
        ACTIVE works. ROTATING has a successor and is inside its overlap window,
        so both work. ROTATED is past that window. EXPIRED is past the date the
        developer set. REVOKED was switched off deliberately, and wins over the
        others because it is the fact somebody acted on.
      enum: [ACTIVE, ROTATING, ROTATED, EXPIRED, REVOKED]
    CreateApiKeyRequest:
      type: object
      description: >
        Create-key request. No IP allowlist yet - one is planned and
        arrives in a later release, so a client sending it today would have it
        silently ignored. Scopes are accepted and enforced.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: What to call this key, so two can be told apart in the list
        expiresAt:
          type: string
          format: date-time
          description: >
            When the key should stop working. Optional - omit it for a key with no
            expiry. When given it must be in the future and within the maximum key
            lifetime.
        scopes:
          type: array
          description: >
            What this key may do. Every scope must be one the application
            declares, or the request is refused with `400` `ATLAS-DEV-008` -
            refused rather than quietly narrowed, because a key weaker than the
            one you asked for fails later, in production, on a call you believed
            was permitted.


            **Fixed once minted.** Widening is a new key and narrowing is a
            revoke; there is no request that edits this set. A rotation carries
            it forward unchanged, so rotating a leaked key can never grant it
            more than it had.
          items:
            $ref: '#/components/schemas/ApiScope'
    ApiKeySummaryResponse:
      type: object
      description: >
        A key as it is listed. **It never carries the secret.** The
        plaintext is returned exactly once, when the key is created or rotated,
        and only a hash is stored - so there is no field here for one and no
        request that can retrieve it. `keyPrefix` and `last4` are kept
        for display: four characters of a forty-three-character secret, enough
        to tell two keys apart and no more.
      required: [id, appId, name, keyPrefix, last4, status, scopes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
          description: The environment marker, e.g. `atl_sk_live_`
        last4:
          type: string
          description: The last four characters of the secret
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        scopes:
          type: array
          description: What this key may do, fixed when it was minted
          items:
            $ref: '#/components/schemas/ApiScope'
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: >
            When this key was last seen on a request, recorded at most once a
            minute per key. Null if it has never been used.
        expiresAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        rotationExpiresAt:
          type: [string, 'null']
          format: date-time
          description: When this key's overlap window closes, if it has been rotated
        rotatedToId:
          type: [string, 'null']
          format: uuid
          description: The successor minted by a rotation, if any
    ApiKeyCreatedResponse:
      type: object
      description: >
        A newly minted key, **and the only response in this API that carries a
        secret**. Store `secret` before leaving this response: it is never
        persisted in plaintext and can never be retrieved again. If it is lost,
        rotate the key. A separate shape from the listed one, deliberately, so
        there is no response type in which a secret could ever be served twice.
      required: [id, appId, name, keyPrefix, last4, scopes, createdAt, secret]
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
        last4:
          type: string
        scopes:
          type: array
          description: What this key may do, fixed when it was minted
          items:
            $ref: '#/components/schemas/ApiScope'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        secret:
          type: string
          description: >
            The full key, exactly as it must be sent in
            `Authorization: Bearer <secret>`. Shown once.
    ScopeCatalogueEntry:
      type: object
      description: One scope, as a person should see it offered
      required: [scope, description, reserved]
      properties:
        scope:
          $ref: '#/components/schemas/ApiScope'
        description:
          type: string
          description: >
            ATLAS's own wording, written for somebody deciding whether to grant
            it. Render this rather than the machine name - a consent screen that
            says `profiles:read` has told the reader nothing.
        reserved:
          type: boolean
          description: >
            True when the name is published and reaches no operation yet. A key
            can carry it and every call will be refused, so offer it as
            unavailable rather than as a working permission.
    ScopeCatalogueResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScopeCatalogueEntry'
    AuthorizationRequest:
      type: object
      description: >
        An application asking ATLAS to show somebody a consent screen.


        **A POST body rather than query parameters**, which is where this departs
        from what OAuth2 usually looks like. RFC 6749 puts the authorization
        request in the query string of a browser redirect; ATLAS splits that in
        two. The browser is sent to the web app's `/oauth/authorize` with these
        values in the query as usual, and the web app posts them here to be
        validated once, receiving an opaque handle. The screen and the decision
        then both name the handle.


        The reason is that the list of permissions somebody reads and the list
        recorded against their account must not be able to differ - and neither may
        the address a code is sent to and the address that was checked.
      required: [clientId, orgId, redirectUri, scopes, codeChallenge, codeChallengeMethod]
      properties:
        clientId:
          type: string
          maxLength: 64
          description: The application's id, as shown in the developer portal.
        orgId:
          type: string
          format: uuid
          description: >
            The ONE organisation the pass may act in. Required: a pass is scoped
            to a single organisation, and a person typically belongs to several -
            their own private one plus each institution they were invited to.


            Membership is checked when the person reads the consent screen, not
            here: this operation takes no credential, so there is nobody to check
            yet. An organisation the person is not a member of, and one that does
            not exist, both answer `404` at that point - alike, so a consent link
            cannot be used to learn which organisations somebody belongs to.
        redirectUri:
          type: string
          maxLength: 512
          description: >
            Where to send the code. **Matched as an exact registered literal** -
            never by prefix, never by host, never by pattern. Register every
            address you will use, exactly as you will send it.
        scopes:
          type: array
          description: >
            The permissions being asked for. Refused if it exceeds what the
            application declares, and **never quietly narrowed**: a screen showing
            less than was asked for would leave your integration failing later on a
            call nobody refused. A reserved scope is refused for the same reason -
            it reaches no operation, so granting it would mint a pass refused
            everywhere.
          items:
            $ref: '#/components/schemas/ApiScope'
        state:
          type: string
          maxLength: 512
          description: >
            Your own value, returned untouched on the redirect. ATLAS neither
            interprets nor validates it; it exists so you can recognise your own
            request.
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 128
          description: >
            The PKCE challenge (RFC 7636): base64url, unpadded, of the SHA-256 of
            your verifier's ASCII bytes. Required - there is no non-PKCE path.
        codeChallengeMethod:
          type: string
          enum: [S256]
          description: >
            `S256` only. `plain` is not implemented, so it cannot be downgraded
            to.
    ScopePermission:
      type: object
      description: One permission, as a machine name and as a sentence.
      required: [scope, description]
      properties:
        scope:
          $ref: '#/components/schemas/ApiScope'
        description:
          type: string
          description: >
            ATLAS's own wording for it. **Render this rather than the machine
            name** - a consent screen that says `profiles:read` has told the
            reader nothing.
    AuthorizationContextResponse:
      type: object
      description: >
        Everything a consent screen renders, and nothing it should have to look up.


        The permission sentences travel with the request they describe rather than
        being fetched separately, because a consent screen is read by somebody who
        may not have a session yet - and because two copies of these words are a
        consent list and a grant that can disagree.
      required: [requestId, appName, orgName, permissions, tosVersion, privacyVersion]
      properties:
        requestId:
          type: string
          description: >
            The opaque handle. Everything else about this request is read back
            from it; the decision carries nothing but this.
        appName:
          type: string
          description: >
            The application's own name. **Developer-supplied, untrusted content**, shown on ATLAS's origin above an Allow button - contain it,
            and never let it read as ATLAS's own copy.
        orgName:
          type: string
          description: >
            The organisation the pass will act in, resolved from the reader's own
            membership. **ATLAS's own data rather than the developer's** - unlike
            `appName` - so a screen may present it as a fact rather than as a
            claim. Empty on the response from
            `createAuthorizationRequest`, which has no reader to resolve it for.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ScopePermission'
        tosVersion:
          type: string
          description: >
            The Terms version this screen must display, and the one the grant
            will record.
        privacyVersion:
          type: string
          description: The privacy notice version, likewise.
    AuthorizationDecision:
      type: object
      description: >
        Allow, or deny.


        **It names the request and nothing else.** No scopes, no redirect address,
        no application id: every one of those is read back from the validated
        request the handle points at, so a click cannot disagree with the screen
        and somebody who has never seen a screen cannot assemble a grant.
      required: [approved]
      properties:
        approved:
          type: boolean
          description: >
            `true` for Allow. Required rather than defaulted - a decision that
            defaulted either way would turn a malformed request into a consent or
            into a refusal.
    AuthorizationDecisionResponse:
      type: object
      required: [redirectTo]
      properties:
        redirectTo:
          type: string
          description: >
            Where to send the browser, built from the **registered** address the
            request was validated against, carrying the code or the error and the
            original `state`. On a denial this still carries an address: RFC 6749
            §4.1.2.1 requires the application to be told rather than left waiting.
    TokenExchangeRequest:
      type: object
      description: >
        A code exchange, or a renewal. Called by your server; there is no
        client secret, and PKCE binds the exchange instead.
      required: [grantType, clientId]
      properties:
        grantType:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
          maxLength: 128
          description: The one-time code, for `authorization_code`. Single-use and short-lived.
        redirectUri:
          type: string
          maxLength: 512
          description: >
            The address the code was sent to. Re-checked against the one recorded
            with the code (RFC 6749 §4.1.3), which is what stops a code
            intercepted at one registered address being redeemed as though it had
            arrived at another.
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          description: The verifier your challenge was derived from.
        refreshToken:
          type: string
          maxLength: 128
          description: The renewal secret, for `refresh_token`. Rotated on every use.
        clientId:
          type: string
          maxLength: 64
          description: >
            Your application. Re-checked against the code's own record, so a code
            cannot be redeemed by an application it was not issued to.
    DelegatedPassResponse:
      type: object
      description: >
        A delegated pass and its renewal secret (RFC 6749 §5.1). The field
        names are RFC 6749's rather than this document's usual camelCase, because
        these are the names every OAuth2 client expects to read off a token
        response.
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token:
          type: string
          description: >
            The pass. Short-lived - but note that what makes a withdrawal take
            effect is not this lifetime: every delegated request re-reads the
            grant.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: The pass's remaining life, in seconds.
        refresh_token:
          type: string
          description: >
            The renewal secret, returned once per issue. Only its SHA-256 is
            stored. **Presenting a spent one is treated as theft** and revokes
            every unspent refresh token under the grant.
        scope:
          type: string
          description: Space-delimited wire names, exactly as the person consented to them.
    ConnectedApp:
      type: object
      required: [id, appName, permissions, grantedAt, tosVersion, privacyVersion]
      properties:
        id:
          type: string
          format: uuid
          description: The grant, which is what a withdrawal names.
        appName:
          type: string
          description: >
            The application's own name. **Untrusted content**, exactly as
            on the consent screen.
        permissions:
          type: array
          description: >
            The scopes, in ATLAS's own words - the **same sentences** the consent
            screen showed, from the same vocabulary.
          items:
            $ref: '#/components/schemas/ScopePermission'
        grantedAt:
          type: string
          format: date-time
        tosVersion:
          type: string
          description: The Terms version displayed when they agreed.
        privacyVersion:
          type: string
          description: The privacy notice version displayed when they agreed.
    ConnectedAppResponse:
      type: object
      description: >
        What a person has connected.


        `nextCursor` is honestly `null`: this list is bounded by how many
        applications somebody has personally authorised, which is not a set that
        needs paging. The paging envelope is kept so a cursor can start advancing
        later without a response shape changing.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedApp'
        nextCursor:
          type: [string, 'null']
          description: >
            The opaque position to continue from, or null at the end. Always null
            today: the list is bounded by how many applications somebody has
            personally authorised, so one response holds all of it.
    LinkEndUserRequest:
      type: object
      description: >
        Link one of your own learners. **You are the data controller for
        this person and ATLAS is your processor**, which is why the only
        thing this carries is your own reference for them.


        ATLAS hashes `ref` and stores the digest. The value itself is never
        persisted, never logged and never returned - there is no field on any
        response that could carry it back, and no request that can retrieve it.
        Send whatever identifier your own system already uses; ATLAS neither
        needs nor wants to know what it means.
      required: [ref]
      properties:
        ref:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Your identifier for this learner. Stable across calls, because the
            digest of it is what makes two calls the same learner.
    EndUserResponse:
      type: object
      description: >
        A linked end user. Carries no `ref`, and could not: ATLAS holds
        only a digest of it.
      required: [id, appId, active, linkedAt]
      properties:
        id:
          type: string
          format: uuid
          description: What ATLAS will know this learner by on later calls
        appId:
          type: string
          format: uuid
          description: The application that linked them, taken from the key you presented
        active:
          type: boolean
          description: False once the link is revoked. A revoked link reaches nothing.
        linkedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
    EndUserPage:
      type: object
      description: >
        A page of end users (the `{items, nextCursor}` paging envelope). Null
        `nextCursor` means there is no next page.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EndUserResponse'
        nextCursor:
          type: [string, 'null']
    PresentEndUserRequest:
      type: object
      description: >
        A personalised read for a linked end user.


        **The profile comes with the request, every time.** ATLAS stores no
        profile for an end user - a learner profile is derived from stored
        questionnaire answers, and an end user has no ATLAS account to hold any -
        so this is the input rather than a lookup key. That is also what keeps a
        retake instant on this surface: there is no cached copy to invalidate,
        because there is no copy.
      required: [profile]
      properties:
        profile:
          $ref: '#/components/schemas/LearnerProfile'
    DeveloperAppUsage:
      type: object
      description: One application's metered activity over the period
      required: [appId, calls, tokens]
      properties:
        appId:
          type: [string, 'null']
          format: uuid
        name:
          type: [string, 'null']
          description: >
            Null when the application has since been removed. Usage outlives what
            it names, because it is a billing record.
        calls:
          type: integer
          format: int64
        tokens:
          type: integer
          format: int64
    DeveloperRateLimitStanding:
      type: object
      description: >
        Where this account stands against its request budget. Reading it does not
        spend it.
      required: [limit, remaining, resetSeconds]
      properties:
        limit:
          type: integer
          format: int64
        remaining:
          type: integer
          format: int64
        resetSeconds:
          type: integer
          format: int64
    DeveloperUsageState:
      type: string
      description: >
        Two named states, decided by ATLAS rather than by the screen, so
        a client and the filter that actually refuses cannot disagree.
      enum: [WITHIN_LIMITS, THROTTLED]
    DeveloperUsageResponse:
      type: object
      description: >
        API usage for a developer account. **Carries no figure
        denominated in money** - commercial data is the account Admin's
        alone, and it is served by a separate operation this one cannot reach.
        Operational allowance state is not commercial data, so every role reads
        this, and so does a key holding `usage:read`.


        Two usage panels are absent. **Errors** needs a queryable
        record of failed requests and ATLAS mints none today; it is tracked and
        will arrive as an additive change.
      required: [periodStart, periodEnd, calls, apps, state]
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        calls:
          type: integer
          format: int64
          description: Metered requests over the period, across every scope
        apps:
          type: array
          description: >
            The per-app breakdown. Empty when nothing has been metered against an
            application - an empty list, never a list of zeroes.
          items:
            $ref: '#/components/schemas/DeveloperAppUsage'
        rateLimit:
          $ref: '#/components/schemas/DeveloperRateLimitStanding'
        state:
          $ref: '#/components/schemas/DeveloperUsageState'
    DeveloperCreditsResponse:
      type: object
      description: >
        What a developer account has consumed, in tokens and in money. **Admin only, and no API key reaches it** - no scope in the key
        vocabulary names a commercial figure, so a leaked key cannot read what an
        account is spending.
      required: [periodStart, periodEnd, tokensUsed]
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        tokensUsed:
          type: integer
          format: int64
        allowanceTokens:
          type: [integer, 'null']
          format: int64
        state:
          $ref: '#/components/schemas/AllowanceState'
        costUsd:
          type: [string, 'null']
          description: >
            A decimal string, never a floating-point number. Null when the
            period's calls carry no measured cost, which is a different fact from
            zero.
    AppPage:
      type: object
      description: >
        A page of applications (the `{items, nextCursor}` paging envelope). A null `nextCursor` means there is no
        next page.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppResponse'
        nextCursor:
          type: [string, 'null']
          description: >
            The opaque position to continue from, or null at the end. Always null
            today, because the list is bounded and one response holds all of it.
    ApiKeyPage:
      type: object
      description: >
        A page of API keys (the `{items, nextCursor}` paging envelope). **No item
        here ever carries a secret** - see `ApiKeySummaryResponse`.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeySummaryResponse'
        nextCursor:
          type: [string, 'null']
          description: The opaque position to continue from, or null at the end.
    KeyIdentityResponse:
      type: object
      description: >
        Who an API key is, and what it may do. It discloses
        nothing the caller did not already hold - no names, no members, no
        content, and no permission the presented key does not itself carry - so
        a stolen key is not also a way to learn about the account it came from.


        This is where a `403 ATLAS-SYS-007` is diagnosed: that refusal names the
        scope it wanted and deliberately never names what your key holds, so the
        two halves of the answer come from different places and only the holder
        can put them together.
      required: [keyId, appId, orgId, keyPrefix, last4, scopes]
      properties:
        keyId:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
          description: The developer account this key belongs to
        keyPrefix:
          type: string
        last4:
          type: string
        scopes:
          type: array
          description: >
            What this key may do. Fixed when the key was minted - widening is a
            new key and narrowing is a revoke - so this is the set every call
            you make will be judged against.
          items:
            $ref: '#/components/schemas/ApiScope'
        expiresAt:
          type: [string, 'null']
          format: date-time
    CreateOrgRequest:
      type: object
      description: >
        Create-organisation request, for a shared org or a developer account - just a
        name. The type is never client-supplied: it is decided by which path you post to,
        and the caller always becomes ADMIN.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    OrgResponse:
      type: object
      description: A newly created org as its creator sees it - on create the role is always ADMIN
      required: [id, name, type, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [PRIVATE, SHARED, DEVELOPER]
        role:
          type: string
          enum: [ADMIN, MODERATOR, USER]
          description: The caller's role in the new org (ADMIN on create)
    OrgSummaryResponse:
      type: object
      description: >
        One organisation in the caller's org-switcher list - the org
        plus the caller's role in it (roles are per-org)
      required: [id, name, type, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [PRIVATE, SHARED, DEVELOPER]
          description: >
            PRIVATE is the account's automatic org (pinned first, badged "Private");
            DEVELOPER is a developer account, which owns apps and API keys and is
            otherwise a shared workspace in every respect
        role:
          type: string
          enum: [ADMIN, MODERATOR, USER]
          description: The caller's role in THIS org
    OrgSettingsResponse:
      type: object
      description: The org settings an Admin manages - the name, logo, and description members see
      required: [name, hasLogo]
      properties:
        name:
          type: string
        logoUrl:
          type: [string, 'null']
          description: An external logo URL; null when unset (distinct from an uploaded image - see hasLogo)
        description:
          type: [string, 'null']
          description: Short org description; null when unset
        hasLogo:
          type: boolean
          description: >
            True when an image has been uploaded - served from
            GET /o/{orgId}/settings/logo, distinct from an external logoUrl.
    NewSubmissionRequest:
      type: object
      description: Work a member offers for peer review
      required: [title, body]
      properties:
        title:
          type: string
          maxLength: 200
          description: A headline somebody scans in a queue, not prose
        body:
          type: string
          maxLength: 2000
          description: >
            Plain text. Not markdown and not HTML - there is no sanitiser in the api,
            no renderer in the web app, and `react/no-danger` is an eslint error.
    SubmissionSummaryResponse:
      type: object
      description: >
        One row of the queue. Carries no body - the queue is for choosing
        what to read - and no review count, because a review is party-readable so any
        count would only ever read 0 or 1.
      required: [id, title, authorId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        authorId:
          type: string
          format: uuid
        authorName:
          type: [string, 'null']
          description: >
            The name, never the address. Reviewing is not blind: the
            author is shown, which is what the prototype does.
        createdAt:
          type: string
          format: date-time
    SubmissionResponse:
      type: object
      description: One submission and the reviews of it the CALLER is a party to
      required: [id, title, body, authorId, mine, createdAt, reviews]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        authorId:
          type: string
          format: uuid
        authorName:
          type: [string, 'null']
        mine:
          type: boolean
          description: >
            Whether the caller wrote it. A client uses this to hide the claim control -
            the api refuses it either way (`ATLAS-REV-001`).
        createdAt:
          type: string
          format: date-time
        reviews:
          type: array
          description: >
            The reviews the caller may see, NOT all of them: an author sees every review
            of their work, a reviewer sees only their own, anybody else sees none.
          items:
            $ref: '#/components/schemas/PeerReviewResponse'
    RubricCriterion:
      type: object
      description: One thing a reviewer is asked to judge
      required: [key, label, levels]
      properties:
        key:
          type: string
          description: Stable across wordings; what a stored score names
        label:
          type: string
        levels:
          type: array
          description: >
            LOWEST FIRST, so index 0 is always the "not yet" end. A client renders them
            in this order; reordering them would change what a stored score means.
          items:
            $ref: '#/components/schemas/RubricLevel'
    RubricLevel:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
          description: >
            The lowest is "Not yet", never "poor" or "fail" - a learner's
            shortfall is info-blue, never red, on the surface where it is
            most tested because the judgement is another learner's.
    RubricResponse:
      type: object
      description: The current platform rubric
      required: [version, criteria]
      properties:
        version:
          type: integer
          description: >
            Moves when the criteria or levels change. A review stores its own rubric by
            value, so this tells a client that the form it is showing is not the form an
            older review was written against.
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/RubricCriterion'
    CriterionScore:
      type: object
      description: One criterion answered. Both halves are stable KEYS, never labels.
      required: [criterion, level]
      properties:
        criterion:
          type: string
        level:
          type: string
    SubmitReviewRequest:
      type: object
      description: >
        A reviewer's completed marks, from the rubric-guided review form.


        Validated against the rubric PINNED ON THE REVIEW at claim time, not against the
        current platform rubric: one score per criterion, in the rubric's own order,
        each naming a level that criterion offers.
      required: [scores, overall]
      properties:
        scores:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/CriterionScore'
        overall:
          type: string
          maxLength: 2000
          description: The reviewer's prose. Plain text, for the submission's reason.
    PeerReviewResponse:
      type: object
      description: >
        One review, as its two parties see it.


        A review is readable by the reviewer and by the submission's author, and by
        nobody else - not by another member and not by an org Admin. That asymmetry
        with the submission is the design: a submission is OFFERED by its author, while
        a review is a judgement of someone who did not choose to have it published.
      required: [id, submissionId, state, reviewerId, iAmTheReviewer, rubric, claimedAt]
      properties:
        id:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        submissionTitle:
          type: [string, 'null']
        state:
          type: string
          enum: [ASSIGNED, SUBMITTED, RECEIVED]
          description: >
            The review's three steps, read from the REVIEW's point of view. `RECEIVED` means
            the AUTHOR has acknowledged it - which is why the notification that fires one
            step earlier is `PEER_REVIEW_SUBMITTED` and not `PEER_REVIEW_RECEIVED`.
        reviewerId:
          type: string
          format: uuid
        reviewerName:
          type: [string, 'null']
        iAmTheReviewer:
          type: boolean
          description: >
            Which party the caller is. The two see the same review and can take
            different actions on it, so a client needs this rather than comparing ids.
        rubric:
          type: array
          description: >
            The rubric this review was written AGAINST, from the row rather than from
            the current platform definition - so a review written against version 1
            still renders against version 1 after version 2 ships.
          items:
            $ref: '#/components/schemas/RubricCriterion'
        scores:
          type: [array, 'null']
          description: Null until `SUBMITTED`
          items:
            $ref: '#/components/schemas/CriterionScore'
        overall:
          type: [string, 'null']
        claimedAt:
          type: string
          format: date-time
        submittedAt:
          type: [string, 'null']
          format: date-time
        receivedAt:
          type: [string, 'null']
          format: date-time
    NotificationResponse:
      type: object
      description: >
        One row of the notifications centre: what happened, to which
        resource, when, and whether this member has seen it.


        The resource's VERSION is deliberately absent although the stored
        notification names one. A notification links to the resource, which shows the current
        edition; nothing on the screen reads an edition id, and a field in this
        description is a contract that outlives the reason it was added.
      required: [id, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Used to mark this one read
        type:
          type: string
          enum: [RESOURCE_READY, RESOURCE_UPDATED, PEER_REVIEW_SUBMITTED]
          description: >
            What happened. `RESOURCE_READY` - a resource became readable for the
            first time. `RESOURCE_UPDATED` - a newer edition of one members may
            already have read became current, superseding the previous one.


            Both are the single "org activity" type, which is why one channel
            preference governs them; they are split because a learner who
            already studied the old edition needs a different sentence from one
            meeting the material for the first time.


            `PEER_REVIEW_SUBMITTED` is the first type that is NOT org
            activity: a peer submitted a review of work this member offered. It carries `subjectId` and NO resource, has its own channel
            preference (`peerReviewEmail`), and is named from the recipient's
            moment - deliberately not `PEER_REVIEW_RECEIVED`, which would collide
            with the review state of that name while meaning the opposite thing.
        resourceId:
          type: [string, 'null']
          format: uuid
          description: >
            The resource the row links to. ABSENT for a notification whose
            subject is not a resource - see `subjectId`. Exactly one of the two
            shapes is present, and the database enforces it.
        resourceTitle:
          type: [string, 'null']
          description: >
            Its title as it stands NOW - a rename since the event shows the name the
            learner will actually find, not a stale one.


            NULL whenever `resourceId` is. A client MUST render a type-appropriate
            label in that case rather than the title: this field used to be
            documented "never null", and a renderer that believed it shows a blank
            row with an empty accessible name.
        subjectId:
          type: [string, 'null']
          format: uuid
          description: >
            What a non-resource notification is about. For
            `PEER_REVIEW_SUBMITTED` this is the REVIEW - not the submission -
            because "notified once per review" has to hold when two people review
            the same work. The row links to
            `/o/:org/peer-review/reviews/:subjectId`.
        createdAt:
          type: string
          format: date-time
          description: When ATLAS recorded it (UTC; converted for display at the edge)
        readAt:
          type: [string, 'null']
          format: date-time
          description: When this member marked it read; absent while it is unread
    NotificationListResponse:
      type: object
      description: >
        One page of a member's own notifications in this org, with the
        totals the panel's paging needs and the one number the bell shows.
      required: [items, page, size, totalItems, totalPages, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        page:
          type: integer
          description: The zero-based page index
        size:
          type: integer
          description: The requested page size
        totalItems:
          type: integer
          format: int64
          description: How many notifications this member has in this org
        totalPages:
          type: integer
          description: >
            How many pages that is at this size; at least 1, so an empty centre
            reads as one empty page rather than none
        unreadCount:
          type: integer
          format: int64
          description: >
            How many are unread IN TOTAL - not merely on this page. A badge answers
            "how many things are waiting", and a page-scoped count would shrink as
            the learner pages. It travels with the list so the panel reconciles the
            badge against the same snapshot it is about to render.
    UnreadNotificationsResponse:
      type: object
      description: >
        How many notifications the caller still has unread in this org - the
        bell's badge. Returned by the count endpoint and by both mark endpoints, so
        a write never leaves the caller to guess the new number or re-read for it.
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          format: int64
    GoalKind:
      type: string
      description: >
        What shape a goal has. Append-only: a value, once published, is never
        renamed.


        `STUDY_MINUTES_PER_DAY` is the one kind whose progress ATLAS cannot measure - no duration
        column exists anywhere in the schema - so it ships as a commitment the learner tracks
        themselves, never as a bar the platform fills in. Its `progress` is null rather than 0.
      enum: [FINISH_COURSE, MASTER_TOPIC, STUDY_MINUTES_PER_DAY]
    ReminderKind:
      type: string
      description: >
        What a study reminder nudges toward. `GOAL` is the learner's goals; `REVIEW` is
        the spaced-review prompt.


        BOTH ARE COVERED BY ONE PREFERENCE (`studyReminderEmail`) and one unsubscribe key, and that
        is a ruling rather than an economy: the "review prompts" notification type is
        already held by peer review, so a second preference of that name would let two unrelated
        things mute each other.
      enum: [GOAL, REVIEW]
    Goal:
      type: object
      description: One of the caller's goals. Private to the learner.
      required: [id, kind]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/GoalKind'
        courseId:
          type: [string, 'null']
          format: uuid
          description: Set for `FINISH_COURSE` only.
        resourceId:
          type: [string, 'null']
          format: uuid
          description: Set for `MASTER_TOPIC` only.
        subjectTitle:
          type: [string, 'null']
          description: >
            The course or lecture title. **Uploaded content** - render as a text node, never as
            markup. Null when the subject has been withdrawn, or for a kind that names no subject.
        targetValue:
          type: [integer, 'null']
          description: A mastery percentage (1-100) or a number of minutes, depending on `kind`.
        targetDate:
          type: [string, 'null']
          format: date
          description: >
            The learner's deadline in THEIR zone's calendar. A date rather than an instant: two
            learners choosing "the end of this month" at the same moment mean different instants.
        achievedAt:
          type: [string, 'null']
          format: date-time
          description: >
            Null while the goal is open. There is deliberately no separate status field, and no
            `open` boolean beside it: a client tests `achievedAt === null`.


            An earlier version of this schema declared `open` as required. The server never
            sends it - it is derived, not serialised, and neither is a reading position's
            `finished` - so a generated SDK with strict deserialisation would have rejected every goal,
            and the web client that read it rendered a control saying the opposite of what it did.
        progress:
          type: [integer, 'null']
          description: >
            0-100, or **null when ATLAS cannot measure it**.


            NULL IS NOT ZERO and a client must render the difference: a
            `STUDY_MINUTES_PER_DAY` goal has no measurable progress, so it gets NO bar rather than
            an empty one. A bar at 0% would assert the learner did nothing.
    CreateGoalRequest:
      type: object
      description: >
        Set a goal. The per-kind shape is validated server-side and refused with
        `ATLAS-GOAL-001`: `FINISH_COURSE` takes a course alone, `MASTER_TOPIC` a lecture and a
        target percentage, `STUDY_MINUTES_PER_DAY` a number of minutes and nothing else.
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/GoalKind'
        courseId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        targetValue:
          type: integer
          minimum: 1
          maximum: 1000
        targetDate:
          type: string
          format: date
    Reminder:
      type: object
      description: One of the caller's study reminders.
      required: [id, kind, localTime, daysOfWeek, enabled]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ReminderKind'
        localTime:
          type: string
          format: time
          example: '07:00'
          description: >
            The wall time the learner chose, in THEIR zone - never an instant, and a client must
            not convert it.


            This is a requirement rather than a serialisation choice: a learner who
            moves to another zone wants their local 07:00 back, which is precisely what an instant
            cannot express. The server re-resolves `nextDueAt` from this value whenever the
            learner's stored zone changes.
        daysOfWeek:
          type: array
          description: >
            ISO-8601 day numbers: **1 is Monday and 7 is Sunday**, matching `DayOfWeek.getValue()`
            rather than JavaScript's `Date.getDay()`, where 0 is Sunday. A client sending 0 is
            refused with `ATLAS-GOAL-003` rather than silently losing a day.
          items:
            type: integer
            minimum: 1
            maximum: 7
        enabled:
          type: boolean
        nextDueAt:
          type: [string, 'null']
          format: date-time
          description: >
            When it next fires. Null when the reminder is switched off - a sentinel far in the
            future would be a lie the schema tells.
    UpsertReminderRequest:
      type: object
      description: Set or change one reminder kind's schedule.
      required: [localTime, daysOfWeek]
      properties:
        localTime:
          type: string
          format: time
          example: '07:00'
          description: A WALL time in the caller's own zone. See `Reminder.localTime`.
        daysOfWeek:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
            maximum: 7
        enabled:
          type: boolean
          default: true
    CourseCompletion:
      type: object
      description: >
        How far through one course the caller is.


        **COUNTED IN LECTURES FINISHED, not in sections read.** Averaging section fractions would
        let one enormous lecture dominate a course of short ones, so a learner who finished nine of
        ten lectures could read below 50%.
      required: [courseId, title, percent]
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
          description: '**Uploaded content** - render as a text node, never as markup.'
        percent:
          type: integer
          minimum: 0
          maximum: 100
    DashboardAttempt:
      type: object
      description: >
        One recent practice attempt as the progress dashboard shows it.


        **Deliberately NOT `RecentAttempt`, which already exists for the practice screen.** The two
        answer different questions about the same row: the practice screen shows the
        question STEM, so a learner can see what they were asked; the dashboard shows the
        LECTURE, so they can get back to it. Folding them into one schema would make each carry a
        field the other has no use for, and would tie two screens' shapes together for the sake of
        a name.


        **There is no score field, and that is the model rather than an omission.**
        An attempt is one QUESTION and there is no quiz session, so there
        is no session percentage to report.
      required: [attemptId, resourceId, resourceTitle, submittedAt]
      properties:
        attemptId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        resourceTitle:
          type: string
          description: '**Uploaded content** - render as a text node, never as markup.'
        correct:
          type: [boolean, 'null']
          description: >
            Null while the attempt is still awaiting marking (A5's open-response path). A client
            must render null as PENDING, never as wrong - and a wrong answer info-blue, never red.
        submittedAt:
          type: string
          format: date-time
    ProgressSummary:
      type: object
      description: >
        The learner's progress dashboard.


        **There is deliberately no `timeStudied` field.** The dashboard has a place for it, and
        ATLAS records no duration to fill it - it records reading POSITION,
        never time. Its absence from this schema is the enforcement of `HomeDashboard`'s rule: a
        region asserts data, so a region with no data is omitted rather than zeroed. Adding it
        later means adding a store first.
      required: [courseCompletion, activeDates, currentStreak, recentAttempts]
      properties:
        mastery:
          oneOf:
            - $ref: '#/components/schemas/MasterySnapshot'
            - type: 'null'
          description: >
            Null when A6 has no evidence at all. **Explicitly null rather than absent** - the api
            sends a null field as `null` rather than omitting it, so a client testing for absence
            would be wrong.
        courseCompletion:
          type: array
          description: >
            One entry per course the learner has made a start on. Courses they have not started are
            OMITTED rather than listed at 0% - an org's whole catalogue rendered as zero bars is
            the same failure as a zeroed region, at list scale.
          items:
            $ref: '#/components/schemas/CourseCompletion'
        activeDates:
          type: array
          description: >
            The days the learner studied, newest first, **in THEIR zone** - already
            resolved server-side, so a client must not re-parse these as UTC and re-render them
            locally, which shifts every day for anyone west of Greenwich.
          items:
            type: string
            format: date
        currentStreak:
          type: integer
          description: Consecutive days up to today, in the learner's zone. Yesterday still counts.
        recentAttempts:
          type: array
          items:
            $ref: '#/components/schemas/DashboardAttempt'
    NotificationPreferencesResponse:
      type: object
      description: >
        A person's notification settings.
        An OBJECT rather than a bare boolean on purpose - there are four
        notification types and four channel choices, so a naked boolean would
        break on the second preference.
      required: [orgActivityEmail, peerReviewEmail, studyReminderEmail]
      properties:
        orgActivityEmail:
          type: boolean
          description: >
            Whether a new or updated resource in one of the caller's orgs is emailed
            to them. Defaults to true - org activity is
            worth knowing about. Note this is a CHANNEL preference: turning it off
            stops the mail, not the in-app notification.
        peerReviewEmail:
          type: boolean
          description: >
            Whether a peer's review of the caller's own work is emailed to them
            (the "review prompts" type). Defaults to true, and is INDEPENDENT of
            `orgActivityEmail` - the choice is per notification type, so
            muting library announcements must not silently kill review mail.
        studyReminderEmail:
          type: boolean
          description: >
            Whether the caller's own study reminders are emailed to them (the
            "study reminders" type). Defaults to true, and covers BOTH
            reminder kinds - goal nudges and spaced-review prompts.


            One preference rather than two, and that is a ruling: the "review
            prompts" type is already held by `peerReviewEmail`, so a
            second preference of that name would let two unrelated things mute each
            other. A spaced-review prompt is itself delivered as a reminder (F9).


            Note the default is not consent to be contacted: a reminder exists only
            because the learner created one, so this is a mute for something already
            asked for.
        quietHours:
          oneOf:
            - $ref: '#/components/schemas/QuietHours'
            - type: 'null'
          description: >
            The caller's quiet window, or **null** when they have none.


            EXPLICITLY NULL RATHER THAN ABSENT. The api sends a null field
            explicitly, so it crosses the wire as `"quietHours": null` and a
            client testing for absence would be wrong. Described as nullable for that
            reason rather than marked as merely optional.
    QuietHours:
      type: object
      description: >
        A window during which ATLAS sends no study reminders - quiet hours, in the
        learner's local zone.


        BOTH TIMES ARE WALL TIMES IN THE LEARNER'S OWN ZONE, never instants - the
        window means "22:00 to 07:00 where I am" and must keep meaning that after the
        learner travels. The window MAY WRAP MIDNIGHT, which is the
        normal case rather than the edge one.
      required: [start, end]
      properties:
        start:
          type: string
          format: time
          example: '22:00'
        end:
          type: string
          format: time
          example: '07:00'
    UpdateNotificationPreferencesRequest:
      type: object
      description: >
        A change to the caller's notification preferences.


        Every field is OPTIONAL and absent means "leave it as it is". A required
        pair would make a client overwrite whatever it last read, so a settings
        screen open in two tabs would silently revert the other tab's change.
      properties:
        orgActivityEmail:
          type: boolean
        peerReviewEmail:
          type: boolean
        studyReminderEmail:
          type: boolean
        quietHours:
          allOf: [{ $ref: '#/components/schemas/QuietHours' }]
          description: >
            Sets the quiet window. Absent leaves it unchanged; to REMOVE one, send
            `clearQuietHours: true` rather than a null - null already means "leave
            alone" for every other field on this request, and one field meaning two
            different things is how a partial update becomes an unrequested change.
        clearQuietHours:
          type: boolean
          description: Removes the quiet window entirely. See `quietHours`.
    ReaderTheme:
      type: string
      description: >
        A theme. `system` is not a fourth palette - it
        resolves in CSS from prefers-color-scheme/prefers-contrast, which is why an
        account that has never chosen reads as `system` rather than `light`.
      enum: [light, dark, high-contrast, system]
    ReaderFont:
      type: string
      description: >
        The reading face, named as a ROLE rather than as a font: `sans` is Inter,
        `serif` is Source Serif 4, `accessible` is Atkinson Hyperlegible. A stored
        value of `source-serif-4` would mean something different the day the
        product's serif changed; `serif` keeps meaning what the learner chose.
      enum: [sans, serif, accessible]
    ReaderLineSpacing:
      type: string
      description: >
        Leading in the reading column. Three named steps rather than a multiplier,
        for the same reason textSize is a step: storing a number would freeze one
        version of the type scale into every row.
      enum: [compact, normal, relaxed]
    AppearancePreferencesResponse:
      type: object
      description: >
        What a person has CHOSEN about how the reader looks.


        **Any field may be absent, meaning that setting has never been chosen** - which
        is a different answer from the default value, and the distinction is
        load-bearing. The client resolves this against a browser cookie, so a response
        that invented `system` for a theme nobody picked would not merely mislead it:
        the account is authoritative, so the invented value would overwrite the real
        choice the learner made from the app's own theme menu. What a default IS belongs
        to the client, which is where its stylesheet fallbacks already put it.
      properties:
        theme:
          $ref: '#/components/schemas/ReaderTheme'
        readerFont:
          $ref: '#/components/schemas/ReaderFont'
        textSize:
          type: integer
          minimum: 1
          maximum: 5
          description: >
            "Text size +-" as a STEP on the client's scale, not a pixel
            value. Storing px would freeze the type scale into every row; a step
            keeps meaning "two notches up from the default" while the rendering
            stays the design system's business. Absent if never chosen; the client's
            default is 3 (an 18px body).
        lineSpacing:
          $ref: '#/components/schemas/ReaderLineSpacing'
        focusMode:
          type: boolean
          description: >
            The focus-mode DEFAULT - the state a lecture OPENS in, written by
            the in-reader toggle. Note this is the only one of the five that is
            also a live control, so turning focus mode on for one lecture is how a
            learner sets it for the next one. Absent if never chosen; Phase F is what
            turns it on by itself for a quiet profile.
    UpdateAppearancePreferencesRequest:
      type: object
      description: >
        A partial change to the caller's appearance settings. Every
        field is optional; an omitted one leaves that setting alone. "View
        original" is deliberately NOT here - it is a per-reading choice, and a learner who
        reads one lecture plainly has not asked for every future lecture to be plain.
      properties:
        theme:
          $ref: '#/components/schemas/ReaderTheme'
        readerFont:
          $ref: '#/components/schemas/ReaderFont'
        textSize:
          type: integer
          minimum: 1
          maximum: 5
        lineSpacing:
          $ref: '#/components/schemas/ReaderLineSpacing'
        focusMode:
          type: boolean
    UnsubscribeResponse:
      type: object
      description: >
        The answer to an unsubscribe click. Deliberately carries NO outcome - whether
        the link verified, whether the account exists, and whether anything changed are
        all invisible, because the endpoint is unauthenticated and a varying answer
        would let anyone test account ids against it.
      required: [message]
      properties:
        message:
          type: string
          description: What the landing page tells the person
    UpdateOrgSettingsRequest:
      type: object
      description: >
        Update-org-settings request - a full replacement of the
        editable fields. name is required; logoUrl and description are optional
        (null or blank clears them). The values are untrusted input - escape on render.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        logoUrl:
          type: [string, 'null']
          maxLength: 2048
          pattern: '^(\s*|https?://.+)$'
          description: An http(s) URL, or blank to clear. Other schemes (javascript:, data:) are rejected.
        description:
          type: [string, 'null']
          maxLength: 2000
    CreateResourceRequest:
      type: object
      description: >
        Create-resource request - the title and the exact size of the
        file about to be uploaded, plus its declared content type and original
        filename. The real content type and size are re-read from the stored
        object on receipt; the fingerprint is always computed server-side, never
        trusted from the client.
      required: [title, sizeBytes, contentType]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: >
            The exact byte length of the file to upload. SIGNED into the presigned
            URL, so the store accepts a body of exactly this length
            and no other - declaring a smaller size than the file gains nothing,
            the upload then fails at the store. Over the ceiling is a 413 here,
            before any URL exists.
        contentType:
          type: string
          maxLength: 255
          description: >
            The declared MIME type. Must be on the accepted list (see
            `GET .../resources/upload-policy`) or the request is 415. A hint about
            the bytes, not a claim: real type detection is the reader's.
        originalFilename:
          type: [string, 'null']
          maxLength: 255
          description: The client's filename for display (optional)
    ResourceListResponse:
      type: object
      description: >
        One page of the org's resource library, with the totals
        pagination controls need.
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceResponse'
        page:
          type: integer
          description: The zero-based page index
        size:
          type: integer
          description: The requested page size
        totalItems:
          type: integer
          format: int64
          description: How many resources match in the whole org
        totalPages:
          type: integer
          description: >
            How many pages that is at this size; at least 1, so an empty library
            reads as one empty page rather than none
    UploadPolicyResponse:
      type: object
      description: >
        The upload limits an upload screen pre-flights against. Client-side
        guidance; the authoritative gates run at create.
      required: [maxBytes, allowedContentTypes]
      properties:
        maxBytes:
          type: integer
          format: int64
          description: The largest file that may be uploaded
        allowedContentTypes:
          type: array
          items:
            type: string
          description: The accepted document content types
    ResourceDownloadResponse:
      type: object
      description: >
        A short-lived URL for a resource's original file. Returned as
        a URL in a JSON body rather than a redirect, so the browser never follows a
        cross-origin redirect with credentials attached and the screen can surface
        a failure as a message.
      required: [downloadUrl, expiresAt, filename]
      properties:
        downloadUrl:
          type: string
          description: >
            The presigned GET URL; forces attachment + application/octet-stream so
            untrusted uploaded bytes can never render as markup
        expiresAt:
          type: string
          format: date-time
          description: When it lapses; re-request rather than caching it
        filename:
          type: string
          description: The name the browser will save it under
    ReaderDocumentResponse:
      type: object
      description: >
        A resource's official copy as the reader receives it. An
        immutable tree of typed blocks, in position order, each node nesting its
        children.


        Deliberately carries no `sourceFingerprint`, no document id, no build time and
        no extractor version, although the stored document has all four - see the
        operation description.
      required:
        [blocks, relations, blockCount, blocksReturned, sectionCount, sectionsReturned, truncated]
      properties:
        sourceContentType:
          type: [string, 'null']
          description: >
            The source file's detected media type, if one was recorded. Kept where the
            identifying fields were cut: it describes the format the caller uploaded,
            which they already know, and is identical for every PDF on the platform
        blocks:
          type: array
          description: The top level, in position order. A PREFIX when `truncated`
          items:
            $ref: '#/components/schemas/BlockNode'
        relations:
          type: array
          description: >
            Cross-block relationships over real block ids, stated in both directions.
            Filtered to pairs whose both endpoints are present in `blocks`
          items:
            $ref: '#/components/schemas/BlockRelation'
        blockCount:
          type: integer
          description: How many blocks the WHOLE document holds, as sealed at creation
        blocksReturned:
          type: integer
          description: How many blocks this response carries
        sectionCount:
          type: integer
          description: How many sections the whole document holds
        sectionsReturned:
          type: integer
          description: How many sections this response carries
        truncated:
          type: boolean
          description: >
            Whether this is only part of the document. Read this rather
            than comparing the counts: a client that derives it will eventually derive
            it wrongly, and a learner silently reading part of a lecture believes they
            read all of it
    BlockNode:
      type: object
      description: >
        One block of the tree ("everything is a block" - a heading, a
        paragraph, a bullet, a table cell and an image are one shape differing only by
        `type`).


        `canonicalContent`, `sourceLocation` and `metadata` are free-form `jsonb`
        whose keys depend on `type`, and they are deliberately not schematised: they
        are built from an uploaded file, so a schema over them would be a promise the
        wire cannot keep. Read them defensively - a renderer that indexes the shape it
        was promised throws on one malformed document and takes the lecture down with
        it.
      required: [id, type, position, children]
      properties:
        id:
          type: string
          format: uuid
          description: >
            Stable and addressable - what notes, highlights, search, citations and the
            embedding index all anchor to
        type:
          type: string
          description: >
            The block's kind, from ATLAS's block catalogue. NOT an enum here on purpose: the
            catalogue is extensible, so a document written by a newer api
            can name a type an older client predates, and a client must fall back
            rather than fail
        position:
          type: integer
          description: Order among siblings, dense from 0
        canonicalContent:
          description: The content in clean structured form; shape depends on `type`
        sourceLocation:
          description: Where it came from in the original file (page, slide, coordinates)
        metadata:
          description: >
            Type-specific extras. AI-authored values carry a `*Source` marker beside
            them (`altTextSource`, `captionSource`, `summarySource`) - a consumer that
            renders one without checking the marker is presenting model output as the
            document's own words, which ATLAS forbids: all AI output is labelled
        children:
          type: array
          description: Nested blocks, already in position order
          items:
            $ref: '#/components/schemas/BlockNode'
    BlockRelation:
      type: object
      description: >
        One directional relationship between two blocks of the same document. A flat
        document-level list rather than a field on the block, because the interesting
        question is usually asked from the far end ("what captions this figure?").


        The api stores exactly the relationships the pipeline stated and synthesises no
        inverse. Today's extractors happen to state caption pairs in BOTH directions -
        `CAPTIONED_BY` from the figure and `CAPTIONS` back from the caption - so a
        consumer that walks both pairs every figure twice, and should follow one
        direction only. Treat that as a property of the current producer rather than a
        guarantee of this wire format: neither direction is promised to be present.
      required: [sourceBlockId, targetBlockId, type]
      properties:
        sourceBlockId:
          type: string
          format: uuid
        targetBlockId:
          type: string
          format: uuid
        type:
          type: string
          description: How they relate (CAPTIONED_BY, CAPTIONS, CONTINUES, REFERENCES, …)
    ReportResourceRequest:
      type: object
      description: >
        A member's report that something is wrong with a resource. The reporter
        is deliberately NOT a field: identity comes from
        the session, and the database pins the same rule, so a report can never be
        filed in someone else's name.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [COPYRIGHT, INAPPROPRIATE, OTHER]
          description: >
            Why it is being reported. COPYRIGHT is treated differently from the
            rest - it is a legal process with a rights holder and a counter-notice
        details:
          type: string
          maxLength: 2000
          description: >
            The reporter's own account, if they gave one (optional). Untrusted text: stored and rendered as text, never as
            markup
        reporterContact:
          type: string
          format: email
          maxLength: 320
          description: >
            An address for following this report up, which need not be their
            account address - they may be relaying a rights holder's complaint
            (optional). Never returned
    ReportResourceResponse:
      type: object
      description: >
        The receipt for a filed report. Carries the
        reference and nothing else - not the resource's state, not who else has
        reported it, not whether anything will happen. Telling the reporter more
        would either expose other members' reports or promise an outcome no one
        has decided.
      required: [reportId, reference, createdAt]
      properties:
        reportId:
          type: string
          format: uuid
          description: The report's id
        reference:
          type: string
          description: >
            The short quotable form of that id shown in the confirmation ("our
            team will review this report. Reference {ref}")
        createdAt:
          type: string
          format: date-time
          description: When it was filed
    CreateResourceResponse:
      type: object
      description: >
        The created resource, its version 1 (a create is the first upload),
        and a short-lived presigned PUT URL the client uploads the file to, DIRECT
        to object storage (not via the api). After the PUT, call the version's
        complete endpoint to confirm receipt and fingerprint the bytes.
      required: [resourceId, versionId, uploadUrl, objectKey, expiresAt]
      properties:
        resourceId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
          description: The id of its version 1 - what the complete call names
        uploadUrl:
          type: string
          description: The presigned PUT URL; upload the bytes here, then call complete
        objectKey:
          type: string
          description: The storage key the bytes will live at (informational)
        expiresAt:
          type: string
          format: date-time
          description: When the presigned URL lapses
    CreateVersionRequest:
      type: object
      description: >
        Upload-new-version request - CreateResourceRequest minus the
        title, which belongs to the resource's IDENTITY and deliberately does not
        change with a new version. The same declarations apply: the stored
        type is re-read on receipt and the fingerprint is computed server-side.
      required: [sizeBytes, contentType]
      properties:
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: >
            The exact byte length of the file to upload; SIGNED into the presigned
            URL. Over the ceiling is a 413 here, before any URL
            exists.
        contentType:
          type: string
          maxLength: 255
          description: >
            The declared MIME type. Must be on the accepted list (see
            `GET .../resources/upload-policy`) or the request is 415.
        originalFilename:
          type: [string, 'null']
          maxLength: 255
          description: The client's filename for display (optional)
    CreateVersionResponse:
      type: object
      description: >
        The new version and its presigned PUT URL, exactly like a
        create. The version becomes current only when it seals READY; until then
        the resource keeps serving its existing current version.
      required: [resourceId, versionId, versionNumber, uploadUrl, objectKey, expiresAt]
      properties:
        resourceId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
          description: The new version's id - what the complete call names
        versionNumber:
          type: integer
          description: Its position in the timeline (1..N)
        uploadUrl:
          type: string
          description: The presigned PUT URL; upload the bytes here, then call complete
        objectKey:
          type: string
          description: The storage key the bytes will live at (informational)
        expiresAt:
          type: string
          format: date-time
          description: When the presigned URL lapses
    ResourceVersionResponse:
      type: object
      description: >
        One version in a resource's timeline. The storage key is
        never exposed; the uploader is a user id the screen resolves against the
        org's member list.
      required: [id, versionNumber, status, uploadedBy, current, retired, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
          description: Its position in the timeline (1..N)
        status:
          type: string
          enum: [AWAITING_UPLOAD, SCANNING, READING, BUILDING, READY, FAILED]
          description: >
            Where the version stands in the upload state machine. A superseded
            version stays READY - being current is the resource's pointer, not a
            state of the version.
        failureReason:
          type: [string, 'null']
          enum:
            [
              TOO_LARGE,
              INFECTED,
              ARCHIVE_LIMITS,
              SCAN_REQUIRED,
              UPLOAD_ABANDONED,
              UPLOAD_MISMATCHED,
              EXTRACT_FAILED,
              BLOCKED,
              INGEST_ABANDONED,
              null,
            ]
          description: Why it failed; null unless `status` is FAILED (see ResourceResponse)
        sizeBytes:
          type: [integer, 'null']
          format: int64
          description: The stored size in bytes; null before receipt
        contentType:
          type: [string, 'null']
          description: The stored content type; null before receipt
        originalFilename:
          type: [string, 'null']
        uploadedBy:
          type: string
          format: uuid
          description: The user who uploaded this version
        current:
          type: boolean
          description: True when this is the resource's live version
        retired:
          type: boolean
          description: >
            True once retired - its bytes were freed and it no longer
            counts against the org's storage; its row stays for the timeline
        retiredAt:
          type: [string, 'null']
          format: date-time
          description: When it was retired, or null while live
        createdAt:
          type: string
          format: date-time
          description: When this version's upload was started
        updatedAt:
          type: string
          format: date-time
          description: When it last changed state
    VersionTimelineResponse:
      type: object
      description: >
        A resource's version timeline plus its storage picture - every version newest first, and the org's LIVE storage
        total (the summed bytes of every kept version across the org). The cap
        itself arrives with billing; until then the total is reported,
        not enforced.
      required: [resourceId, title, versions, orgStorageBytes]
      properties:
        resourceId:
          type: string
          format: uuid
        title:
          type: string
          description: The resource's display title (the screen's heading)
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ResourceVersionResponse'
          description: All versions, newest first
        orgStorageBytes:
          type: integer
          format: int64
          description: The org's total live storage, in bytes
    ResourceResponse:
      type: object
      description: >
        A resource's state - its identity plus the state of its DISPLAY
        version (the current one when set, else its latest) flattened in, so the
        library and detail surfaces read one object per resource. `status`,
        `sizeBytes`, `contentType`, and `originalFilename` describe the display
        version; `versionCount` is the whole timeline's length.


        The bytes' `fingerprint` is deliberately NOT here. It would be harmless as a per-org detail - a member who
        can list a resource can download it and hash it themselves - but it is
        the platform-wide key that content-addressed reuse is decided on, and a
        stable cross-org content identifier on a bulk listing lets two members in
        DIFFERENT orgs establish that both orgs hold the same file, byte for byte.
        That is what ATLAS refuses to let anyone learn by timing, reached another way.
      required: [id, title, status, versionId, versionNumber, versionCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [AWAITING_UPLOAD, SCANNING, READING, BUILDING, READY, FAILED]
          description: >
            Where the display version stands in the upload state machine: uploading
            (AWAITING_UPLOAD) -> virus-scan (SCANNING) -> reading/extracting
            (READING) -> building (BUILDING) -> ready (READY), or FAILED with a
            `failureReason`. READING and BUILDING are ingestion states: the
            finalize call returns READING and the rest happens asynchronously, so a
            client that needs the settled outcome polls. A version becomes the
            resource's current one only on READY, which is why a resource can show a
            READY display version while a NEWER one of its versions is still READING.
        failureReason:
          type: [string, 'null']
          enum:
            [
              TOO_LARGE,
              INFECTED,
              ARCHIVE_LIMITS,
              SCAN_REQUIRED,
              UPLOAD_ABANDONED,
              UPLOAD_MISMATCHED,
              EXTRACT_FAILED,
              BLOCKED,
              INGEST_ABANDONED,
              null,
            ]
          description: >
            Why the resource failed; null unless `status` is FAILED. TOO_LARGE = over
            the upload size ceiling. INFECTED = a malware signature matched.
            ARCHIVE_LIMITS = the content defeated the scanner's archive limits and
            could not be fully inspected (a zip bomb, for example) - unscannable is rejected,
            not trusted. SCAN_REQUIRED = uploaded before virus scanning existed, so it
            was never scanned; re-upload it. UPLOAD_ABANDONED = the upload was never
            finished and has been swept; its object, if any, was discarded.
            UPLOAD_MISMATCHED = the stored object was not the one the upload was
            authorised for (its size differed from the length signed into the URL),
            so it was discarded - distinct from TOO_LARGE because it may be smaller.
            EXTRACT_FAILED = the bytes scanned clean but the document reader could not
            turn them into a block tree: encrypted, corrupt, no text layer, or past
            the structural bounds. Its object is KEPT, unlike every reason above
            it, so a better extractor can make the same file work later without asking
            the uploader to find it again - but the outcome of THIS version is
            terminal, like all the others. BLOCKED = the file's fingerprint is on
            the takedown blocklist, so ATLAS declines to host these bytes for anyone;
            its object is discarded, and the remedy is an appeal rather than a
            re-upload, which would be refused identically. INGEST_ABANDONED = the
            document reader was handed this version repeatedly and never reported back
            - the one reason that blames ATLAS rather than the file or
            its standing, so its object is KEPT and the advice is simply to upload
            again. Distinct from EXTRACT_FAILED, where a reader DID look at the bytes.
            Names the category only,
            never the matched signature and never the parser's own message.
        sizeBytes:
          type: [integer, 'null']
          format: int64
          description: The stored size in bytes; null before receipt
        contentType:
          type: [string, 'null']
          description: The stored content type; null before receipt
        originalFilename:
          type: [string, 'null']
        versionId:
          type: string
          format: uuid
          description: The display version's id
        versionNumber:
          type: integer
          description: The display version's position in the timeline (1..N)
        versionCount:
          type: integer
          description: >
            How many versions the resource has (1 means no history yet)
        createdAt:
          type: string
          format: date-time
          description: When the RESOURCE was created
        updatedAt:
          type: string
          format: date-time
          description: When the display version last changed state
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: >
            When the resource was moved to the trash, or null for a live
            one. Only the trash listing and the restore response ever carry this
            non-null - every other surface refuses a trashed resource as absent - so
            a client reading it can show how much of the grace period is left.
    CreateCourseRequest:
      type: object
      description: >
        Create-course request. A course is born as a
        header only - its modules and resources are added on the builder.
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 2000
          description: A short blurb for the course's card and header
    UpdateCourseRequest:
      type: object
      description: >
        Update-course request. A total replacement
        rather than a patch, so an empty description clears it.
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 2000
          description: A short blurb, or empty/null to clear it
    CourseModuleRequest:
      type: object
      description: >
        A module's title, for both adding one and renaming one. A
        module carries nothing else a caller may set - position is assigned by the
        server and changed only through the reorder endpoint.
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: e.g. "Week 1", "Fundamentals"
    AddCourseResourceRequest:
      type: object
      description: >
        Names an existing resource of the same org to reference from a module
        (from the course builder's picker). The module gains a reference, appended last;
        the resource is untouched.
      required: [resourceId]
      properties:
        resourceId:
          type: string
          format: uuid
    ReorderRequest:
      type: object
      description: >
        The COMPLETE new order, as ids, for one level of a course's structure
        - modules within a course, or resources within a module. Must
        be exactly the set the parent currently holds, each id once; anything else
        is refused with `ATLAS-CNT-012` rather than applied.
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            format: uuid
          description: >
            Every id of the level, in the order they should appear. Bounded above
            by the largest structure the api will build, so a list longer than
            that is rejected (400) before it is walked.
    CourseResponse:
      type: object
      description: >
        A course without its structure - the header plus
        how big the course is. Returned by create/update and as each item of the
        courses list.


        A course card also shows a completion percentage. It is deliberately absent from
        THIS schema rather than stubbed at zero, because a course object is org-scoped
        and returned identically to every member, while a completion figure is about one
        learner. It is served by `GET /o/{orgId}/progress/summary`.
      required: [id, title, moduleCount, resourceCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        moduleCount:
          type: integer
          format: int64
          description: How many modules the course holds
        resourceCount:
          type: integer
          format: int64
          description: >
            How many resource references it holds across its modules (a resource
            in two modules counts twice - this is the size of the course)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the course's header last changed
    CourseListResponse:
      type: object
      description: One page of the org's courses, newest first
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseResponse'
        page:
          type: integer
          description: Zero-based page index
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          description: At least 1, so an org with no courses still reads as one empty page
    CourseEntryResponse:
      type: object
      description: >
        One resource as a course lists it. Every field but
        `position` is read LIVE from the resource, never copied onto the reference
        row - that is what "a reference, not a copy" means in practice: the status
        a course shows follows the resource's own.
      required: [resourceId, title, status, position]
      properties:
        resourceId:
          type: string
          format: uuid
          description: The referenced resource - what a course links to
        title:
          type: string
          description: The resource's current title
        status:
          type: string
          enum: [AWAITING_UPLOAD, SCANNING, READING, BUILDING, READY, FAILED]
          description: >
            Where the resource's DISPLAY version stands in the upload state machine (the
            current version when set, else its latest) - so a course can show a
            still-processing item honestly rather than hiding it
        failureReason:
          type: [string, 'null']
          enum:
            [
              TOO_LARGE,
              INFECTED,
              ARCHIVE_LIMITS,
              SCAN_REQUIRED,
              UPLOAD_ABANDONED,
              UPLOAD_MISMATCHED,
              EXTRACT_FAILED,
              BLOCKED,
              INGEST_ABANDONED,
              null,
            ]
          description: Why it failed; null unless `status` is FAILED. The category only.
        position:
          type: integer
          description: The entry's 0-based rank within its module
        deleted:
          type: boolean
          default: false
          description: >
            True when the referenced resource is in the trash. A course
            keeps listing a trashed resource on purpose - the reference comes back
            intact if it is restored - so render the entry as unavailable rather than
            dropping it: hiding it would conceal the problem from whoever could fix
            it, and the entry must still be nameable in a reorder (which sends the
            module's complete set). A flag rather than the deletion timestamp, because
            a course is member-readable while the trash listing is Admin/Moderator
            only - when something was withdrawn belongs to the surface that can act
            on it.
    CourseModuleResponse:
      type: object
      description: >
        One module and its ordered resources.
      required: [id, title, position, resources]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
          description: The module's 0-based rank within the course
        resources:
          type: array
          items:
            $ref: '#/components/schemas/CourseEntryResponse'
          description: >
            Its resources in order; empty for a module nothing has been added to
            yet - a normal state in the course builder, which offers the picker
    CourseDetailResponse:
      type: object
      description: >
        A whole course - header and full ordered structure.
        One shape serves both the learner's view and the builder: they render the
        same tree and only the actions differ.


        Modules arrive in course order and each module's resources in module
        order, so a client renders by iterating - never by sorting on `position`,
        which is exposed for the reorder payload rather than as a sorting duty.
      required: [id, title, modules, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        modules:
          type: array
          items:
            $ref: '#/components/schemas/CourseModuleResponse'
          description: >
            The course's modules in order; empty for a new course - the "add
            first module" state
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateInvitationRequest:
      type: object
      description: Invite request - the address to invite and the role to grant (the org is the route segment)
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          type: string
          enum: [MODERATOR, USER]
          description: The role granted on accept. ADMIN cannot be invited (owner role, transfer only).
    InvitationResponse:
      type: object
      description: A pending invitation in the Admin list. No raw token - only the stored hash exists.
      required: [id, email, role, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [MODERATOR, USER]
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateInvitationResponse:
      type: object
      description: >
        A freshly issued invitation (create/resend) - the list shape
        PLUS the one-time `inviteLink` carrying the raw token, returned only here
        (to the issuing Admin) so they can "copy invite link". Never stored or
        re-served; a later resend is the only way to obtain a link again.
      required: [id, email, role, status, expiresAt, createdAt, inviteLink]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [MODERATOR, USER]
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        inviteLink:
          type: string
          description: The one-time accept link (token in the URL fragment). Returned only on create/resend.
    InvitationPreviewRequest:
      type: object
      description: Preview request - the raw token from the accept page's URL fragment
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    InvitationPreviewResponse:
      type: object
      description: What the accept page shows before accepting - the org and role a token grants
      required: [orgName, role]
      properties:
        orgName:
          type: string
        role:
          type: string
          enum: [MODERATOR, USER]
    AcceptInvitationRequest:
      type: object
      description: Accept request - the raw token; the caller's id comes from the bearer JWT
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    AcceptInvitationResponse:
      type: object
      description: Result of accepting - the org the caller just joined, for the redirect into its shell
      required: [orgId]
      properties:
        orgId:
          type: string
          format: uuid
    MemberResponse:
      type: object
      description: >
        One member in the members list. `isOwner` marks the org's original admin
        (the owner). "Last active" is deliberately absent - no activity timestamp
        is tracked yet. name/email may be null only if the account vanished.
      required: [membershipId, userId, role, isOwner, joinedAt]
      properties:
        membershipId:
          type: string
          format: uuid
          description: The membership handle for role change / removal
        userId:
          type: string
          format: uuid
        name:
          type: [string, 'null']
        email:
          type: [string, 'null']
        role:
          type: string
          enum: [ADMIN, MODERATOR, USER]
        isOwner:
          type: boolean
          description: True for the org owner (the original admin), whose role is immutable
        joinedAt:
          type: string
          format: date-time
    SeatUsage:
      type: object
      description: >
        Seat usage for the members screen. `used` counts active members plus
        pending invites (both consume a seat).


        ENFORCED: inviting past
        `limit` is refused with `ATLAS-ORG-011`. The refusal is forward-looking
        only - an org already above its limit keeps every member and every
        pending invitation, because the figure was not enforced while those were
        created.
      required: [used, limit, plan]
      properties:
        used:
          type: integer
          description: Active members + pending invitations
        limit:
          type: integer
          description: >
            Seats the org's plan allows, or the configured default where it has
            no plan row. Operational rather than commercial, so every caller who
            may read the member list may read it - it is what makes a refused
            invitation explicable to whoever is inviting.
        plan:
          type: [string, 'null']
          description: >
            The plan's display name. ADMIN-ONLY - the plan and its price
            are the owner's, and Moderators and Users see only their own usage
            - so this is null for a MODERATOR even though they may read
            everything else here. Also null for an org with no plan row, where
            there is no plan name to give rather than a hidden one.
    ViewerSummary:
      type: object
      description: >
        The caller's own standing in the org, returned with the member list
        so a members screen can gate controls without a second call. Server-side
        authorisation is enforced regardless.
      required: [userId, role, isOwner]
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [ADMIN, MODERATOR, USER]
        isOwner:
          type: boolean
    MemberListResponse:
      type: object
      description: The members screen payload - members, seat usage, and the caller's standing
      required: [members, seats, viewer]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberResponse'
        seats:
          $ref: '#/components/schemas/SeatUsage'
        viewer:
          $ref: '#/components/schemas/ViewerSummary'
    UpdateMemberRoleRequest:
      type: object
      description: >
        Set-member-role request - the target role. Whether the
        caller may make this particular transition (owner-tier rules) is decided
        server-side, not by this shape.
      required: [role]
      properties:
        role:
          type: string
          enum: [ADMIN, MODERATOR, USER]
    QuestionnaireOverview:
      type: object
      description: >
        The Learner Profile Questionnaire and the caller's progress through it. A one-line description per area is not here; that
        copy belongs to the screens - the instrument holds statements, examples
        and the taxonomy, not screen prose.
      required: [taxonomyVersion, dimensions]
      properties:
        taxonomyVersion:
          type: string
          description: >
            The instrument this build administers, e.g. `4.1.0-efa`. Answers are
            only meaningful against the bank they were collected with, so it
            travels with everything derived from them.
        dimensions:
          type: array
          description: OD1-OD9 in canonical order
          items:
            $ref: '#/components/schemas/DimensionSummary'
    DimensionSummary:
      type: object
      required: [code, label, layer, questionCount, answeredCount, status]
      properties:
        code:
          type: string
          description: The operational dimension code, `OD1`-`OD9`
        label:
          type: string
        layer:
          type: integer
          minimum: 1
          maximum: 3
          description: >
            1 instructional preference, 2 processing and regulation, 3 cognitive
            and affective - what a questionnaire screen groups by
        questionCount:
          type: integer
          description: Scored questions in this area (attention checks are not counted)
        answeredCount:
          type: integer
          description: How many of them the caller has answered
        status:
          type: string
          enum: [not-started, in-progress, completed]
          description: >
            Derived on every read, never stored. `completed` means
            `answeredCount == questionCount`, and it is the only state that scores. A `not-started` area is skipped, never scored as zero.
    DimensionRound:
      type: object
      description: >
        One preference area's questionnaire as it was drawn for this caller, plus
        the answers already given. The same body answers "start" and
        "resume": the sequence is drawn once and stored.
      required: [dimensionCode, label, layer, taxonomyVersion, questions, answers, status]
      properties:
        dimensionCode:
          type: string
        label:
          type: string
        layer:
          type: integer
          minimum: 1
          maximum: 3
        taxonomyVersion:
          type: string
        questions:
          type: array
          description: >
            The administered sequence, in order. Attention checks are interleaved
            here and are deliberately indistinguishable from scored questions.
          items:
            $ref: '#/components/schemas/PresentedQuestion'
        answers:
          type: array
          description: What the caller has answered so far, in presentation order
          items:
            $ref: '#/components/schemas/GivenAnswer'
        status:
          type: string
          enum: [not-started, in-progress, completed]
    PresentedQuestion:
      type: object
      description: >
        One question as the learner is shown it. A scored question and an
        attention check produce the same four fields and nothing distinguishes
        them - no kind, no category, no reverse marker, and above all no expected
        answer.
      required: [position, itemId, statement, example]
      properties:
        position:
          type: integer
          minimum: 1
          description: 1-based, in the order this round presents them
        itemId:
          type: string
          description: The item's permanent id, which answers are submitted against
        statement:
          type: string
          description: The first-person statement the learner rates 1-5
        example:
          type: string
          description: The everyday illustration shown alongside it
    GivenAnswer:
      type: object
      required: [itemId, rawScore]
      properties:
        itemId:
          type: string
        rawScore:
          type: integer
          minimum: 1
          maximum: 5
          description: The RAW point on the five-point scale, never the reverse-coded value
    SaveAnswersRequest:
      type: object
      description: >
        A batch of answers to save. A list of one is the normal
        per-question save. A repeated item id takes its last value, matching the
        scorer's own rule.
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 64
          description: >
            The ceiling is a bound on abuse rather than a limit any client should
            approach - the largest area has 33 scored questions and a round adds
            at most one attention check per 25 of them.
          items:
            $ref: '#/components/schemas/AnswerSubmission'
    AnswerSubmission:
      type: object
      required: [itemId, rawScore]
      properties:
        itemId:
          type: string
          maxLength: 64
        rawScore:
          type: integer
          minimum: 1
          maximum: 5
          description: >
            The point on the five-point agree-disagree scale: 1 strongly disagree
            to 5 strongly agree, RAW as the learner picked it.
    LearnerProfile:
      type: object
      description: >
        A learner's scored profile. Personal data in the most private tier - never
        visible to an org in any form. Returned from the stored answers on every
        read, with no stored copy to go stale; sent by a developer to
        `presentForEndUser`, where it is held to the instrument and to the bounds
        below.
      required:
        [
          taxonomyVersion,
          completedDimensions,
          categoryScores,
          percentScores,
          subDimensionScores,
          attentionChecks,
        ]
      properties:
        taxonomyVersion:
          type: string
          maxLength: 64
        completedDimensions:
          type: array
          maxItems: 32
          description: >
            The areas these numbers cover, in canonical order - computed from the
            answers, never accepted from a request. An area absent here was not
            scored at all, rather than scored low.
          items:
            type: string
        categoryScores:
          type: object
          maxProperties: 256
          description: >
            `subDimension.category` to its 1-5 mean, rounded to 4 dp, e.g.
            `D1.Read/Write`. Insertion order is the taxonomy's order.
          additionalProperties:
            type: number
        percentScores:
          type: object
          maxProperties: 256
          description: >
            The same keys on a 0-100 scale, 2 dp, computed from the ROUNDED mean -
            the order of those two roundings is part of the scoring contract.
          additionalProperties:
            type: number
        subDimensionScores:
          type: object
          maxProperties: 64
          description: >
            Sub-dimension code to its score. `structureType` discriminates the two
            shapes: a multi-category sub-dimension yields one score per category
            and a dominant category; a bipolar one yields a single combined score
            where 5 is strongly pole A, 1 is strongly pole B and 3 is balanced.
          additionalProperties:
            $ref: '#/components/schemas/SubDimensionScore'
        attentionChecks:
          $ref: '#/components/schemas/AttentionChecksSummary'
    SubDimensionScore:
      oneOf:
        - $ref: '#/components/schemas/MultiCategoryScore'
        - $ref: '#/components/schemas/BipolarScore'
      discriminator:
        propertyName: structureType
        mapping:
          multi-category: '#/components/schemas/MultiCategoryScore'
          bipolar: '#/components/schemas/BipolarScore'
    MultiCategoryScore:
      type: object
      required: [structureType, categories, dominantCategory]
      properties:
        structureType:
          type: string
          enum: [multi-category]
        categories:
          type: object
          maxProperties: 32
          description: Each category's own 1-5 mean, so the categories can be ranked
          additionalProperties:
            type: number
            minimum: 1
            maximum: 5
        dominantCategory:
          type: string
          maxLength: 64
          description: >
            The first strict maximum in canonical category order, so a tie
            resolves to the taxonomy rather than to whatever a sort happened to do
    BipolarScore:
      type: object
      required: [structureType, score, scorePercent, poleALabel, poleBLabel]
      properties:
        structureType:
          type: string
          enum: [bipolar]
        score:
          type: number
          minimum: 1
          maximum: 5
          description: 5 is strongly pole A, 1 is strongly pole B and 3 is balanced.
        scorePercent:
          type: number
        poleALabel:
          type: string
        poleBLabel:
          type: string
    ProfileSummary:
      type: object
      description: >
        The caller's profile, for display (F5) - the scorer's numbers
        joined to the taxonomy and ranked. Personal data in the most private tier.
      required: [taxonomyVersion, dimensions]
      properties:
        taxonomyVersion:
          type: string
        dimensions:
          type: array
          description: >
            The COMPLETED areas in canonical order. An area missing here was not
            answered rather than scored low, so a client must not
            render it as an empty result.
          items:
            $ref: '#/components/schemas/ProfileDimensionSummary'
    ProfileDimensionSummary:
      type: object
      required: [code, label, layer, subDimensions]
      properties:
        code:
          type: string
          description: '`OD1`-`OD9`'
        label:
          type: string
        layer:
          type: integer
          description: 1-3, which a profile screen groups by
        subDimensions:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSubDimensionSummary'
    ProfileSubDimensionSummary:
      description: >
        One sub-dimension's reading, in one of two shapes - and the difference is
        what a display turns on. Only a multi-category sub-dimension has categories to
        rank; a bipolar one is a single score on a line between two opposites,
        where 1 is not "low" but strongly the other pole. Eleven of the eighteen
        sub-dimensions are bipolar and OD4, OD5, OD7 and OD8 are bipolar only, so
        a client that renders rankings alone has nothing to show for four of the
        nine areas.
      oneOf:
        - $ref: '#/components/schemas/ProfileRankedSubDimension'
        - $ref: '#/components/schemas/ProfileBipolarSubDimension'
      discriminator:
        propertyName: structureType
        mapping:
          multi-category: '#/components/schemas/ProfileRankedSubDimension'
          bipolar: '#/components/schemas/ProfileBipolarSubDimension'
    ProfileRankedSubDimension:
      type: object
      required: [structureType, code, label, categories, dominantCategory]
      properties:
        structureType:
          type: string
          enum: [multi-category]
        code:
          type: string
        label:
          type: string
        categories:
          type: array
          description: Best first, already ranked - see `RankedCategory`
          items:
            $ref: '#/components/schemas/RankedCategory'
        dominantCategory:
          type: string
          description: >
            The scorer's own dominant category - the first rank-1 category in
            canonical order. Carried rather than inferred, because when the top
            is tied "the dominant one" and "a rank-1 one" are different claims.
    ProfileBipolarSubDimension:
      type: object
      required: [structureType, code, label, score, scorePercent, poleA, poleB]
      properties:
        structureType:
          type: string
          enum: [bipolar]
        code:
          type: string
        label:
          type: string
        score:
          type: number
          description: The combined 1-5 mean, 4 dp
        scorePercent:
          type: number
          description: >
            A POSITION, not a strength: 100 is strongly pole A, 0 is strongly
            pole B, 50 is balanced. Render it as a marker on a two-ended track,
            never as a bar that fills - a bar says someone at 10 has almost no
            preference, when what they have is a strong preference the other way.
        poleA:
          $ref: '#/components/schemas/ProfilePole'
        poleB:
          $ref: '#/components/schemas/ProfilePole'
    ProfilePole:
      type: object
      description: >
        One end of a bipolar scale. It carries no score of its own, because the
        pair produces exactly one number - a scored pole would invite ranking the
        two ends against each other, which the instrument does not measure.
      required: [code, label, valence]
      properties:
        code:
          type: string
        label:
          type: string
        valence:
          $ref: '#/components/schemas/Valence'
    RankedCategory:
      type: object
      required: [rank, code, label, valence, score, scorePercent]
      properties:
        rank:
          type: integer
          description: >
            1-based place within the sub-dimension. Tied categories SHARE a rank
            and the next place skips, so 1, 2, 2, 4 is valid - printing "2nd" and
            "3rd" for two identical scores would claim a difference the scorer
            does not.
        code:
          type: string
          description: The scoring identity, e.g. `Read/Write`
        label:
          type: string
        valence:
          $ref: '#/components/schemas/Valence'
        score:
          type: number
        scorePercent:
          type: number
    Valence:
      type: string
      enum: [positive, neutral, negative]
      description: >
        Whether a category names something to want more of, less of, or neither.
        A UI hint that carries NO weight in any calculation - the research
        taxonomy scores "Lack of Regulation" exactly as it scores
        "Self-Regulated", so a deficit category ranks 1st whenever the answers
        put it there. What it exists for is the wording underneath: leading with
        a negative category as though it were a strength would misread the
        instrument back to the person who answered it.
    AttentionChecksSummary:
      type: object
      description: >
        The validity signal from the sitting's attention checks. It
        is not a score and changes nothing - a respondent who fails every check
        still gets exactly the profile their answers produce.
      required: [passed, failed, presented]
      properties:
        passed:
          type: integer
        failed:
          type: integer
        presented:
          type: integer
          description: >
            Checks DRAWN into a round, answered or not - so this may exceed
            `passed + failed`. That gap is the whole point: a check shown and
            skipped is the signal a tally derived from answers alone cannot see.
    PersonalisationProfile:
      type: object
      description: >
        What ATLAS personalises for one learner, and why.
        Private to the learner, derived on every read and stored nowhere.
      required:
        [
          taxonomyVersion,
          completedDimensions,
          endorsements,
          features,
          appearanceDefaults,
          presentation,
        ]
      properties:
        taxonomyVersion:
          type: string
        signature:
          type: string
          description: >
            The short code summarising the profile, used to reuse AI work between
            similar learners - `v1:<taxonomyVersion>:<34 band characters>`,
            one per subscale in canonical order, `-` where unscored.


            SERVER-DERIVED ONLY. No ATLAS endpoint accepts this value, and none
            ever will: it keys the platform-wide transformation cache, so a route
            that took it from a client would let a caller read or poison another
            cohort's cached rewrites, across orgs. Treat it as opaque and do not
            send it back.


            ABSENT (omitted, never sent as null) when the learner has completed
            nothing - and absence is not the same as a code of all dashes: it
            means "do not reuse anything on the strength of this", where a
            dashes-only code would pool every unprofiled learner onto one cache
            entry.


            SO ITS PRESENCE IS THE SECOND HALF OF THE GATE ON EVERY `AI`
            FAMILY, alongside that feature's `enabled`. Absence here and
            a `204` from the re-presentation routes are the same fact, derived
            by the same server-side call - a client that reads `enabled` alone
            offers a control the api can only ever refuse.
        completedDimensions:
          type: array
          description: The areas these recommendations rest on, canonical order
          items:
            type: string
        endorsements:
          type: array
          description: >
            The preferences the answers actually expressed, in the instrument's
            canonical order. Only ONE pole of a bipolar sub-dimension can ever
            appear - a single score cannot endorse both ends of its own line -
            and a category at or below the scale's midpoint appears not at all.
          items:
            $ref: '#/components/schemas/EndorsedCategory'
        features:
          type: array
          description: All 21 families in recommendation order, recommended or not
          items:
            $ref: '#/components/schemas/RecommendedFeature'
        appearanceDefaults:
          $ref: '#/components/schemas/ProfileAppearanceDefaults'
        presentation:
          $ref: '#/components/schemas/PresentationPlan'
    PresentationPlan:
      type: object
      description: >
        What the reader should do differently for this learner, with no AI and no wait. Always present and never null: every
        option carries an explicit baseline value, so "the profile has no view" is a
        state the plan states rather than one a client infers from absence.


        **Only `figures` is rendered today.** The rest carry the learner's preference and
        are applied by nobody yet - `chunking` and `navigation` need a reader surface that
        does not exist yet, and `tableOfContents` and `panels` are simply unconsumed.
        No feature family gates them - F2, F3, F6 and F10 are all live; nothing reads them.


        `panels` stays unrendered by decision rather than by omission: Zone 7
        is its own route, and the reader's utility rail is exactly three tabs with no social
        panel in it, so wiring a fourth from this value would build a surface the
        reader does not have. A value here is what the learner prefers, not
        permission to show it: whoever renders one applies its gate at that point.


        **Disagreement resolves to the baseline.** Presentation options are not additive -
        a chunk is either small or whole - so where two endorsed categories disagree the
        presenter applies neither. The reasoning is a research one:
        a precedence rule invented in code would rank learner profiles against one
        another in a way the research never does.
      required: [figures, chunking, navigation, tableOfContents, panels]
      properties:
        figures:
          type: string
          enum: [figures-first, source-order]
          description: >
            Whether figures lead the prose they illustrate. The one option the reader
            applies today, gated on F12.
        chunking:
          type: string
          enum: [small-segments, whole-document, source-default]
          description: >
            How much is presented at once. `whole-document` and `source-default` render
            alike today and are deliberately distinct: one is "this learner wants the
            whole thing", the other is "ATLAS has no view".
        navigation:
          type: string
          enum: [guided, free, source-order]
          description: Whether a path is recommended or the learner roams.
        tableOfContents:
          type: string
          enum: [offered, suppressed, source-default]
          description: >
            Whether the contents list is foregrounded. `suppressed` means collapsed with
            the affordance intact - the report's principle 3 is that nothing is withheld.
        panels:
          type: string
          enum: [offered, suppressed, source-default]
          description: Whether the side panels are foregrounded, on the same terms.
    EndorsedCategory:
      type: object
      description: >
        One preference the learner expressed, and what it recommends - grouped
        per category.
      required: [key, dimension, label, strength, weight, families]
      properties:
        key:
          type: string
          description: '`subDimension.category`, e.g. `D2a.Quiet`'
        dimension:
          type: string
          description: '`OD1`-`OD9`'
        label:
          type: string
          description: >
            The reader-facing row name, e.g. "Sound: Quiet" - already
            disambiguated within its area, which is why a panel shows this rather
            than the bare category code.
        strength:
          type: number
          description: >
            How strongly this is endorsed, on the instrument's own 1-5 scale, so
            a screen can say "strongly" or "slightly" without a second rule.


            For a POLE this is the sub-dimension's score REFLECTED onto that pole
            (`6 - score` for the low end), so 5 always means "strongly this" at
            either end of a line. Do not compare it back to the raw bipolar score.
        weight:
          type: number
          description: '`(strength - 3) / 2`, in (0, 1] - what this contributes to each family'
        families:
          type: array
          description: >
            The families this category marks, in the LEARNER'S recommendation
            order rather than catalogue order.
          items:
            type: string
    UpdateFeatureSettingsRequest:
      type: object
      description: >
        A partial change to the caller's own feature choices.
      required: [features]
      properties:
        features:
          type: object
          minProperties: 1
          maxProperties: 21
          description: >
            Family code (`F1`-`F13`, `A1`-`A8`) to the learner's choice. `true`
            switches it on, `false` off, and `null` CLEARS the override so the
            engine's recommendation applies again. A family not named here keeps
            whatever it had.


            An unknown code is a 400 rather than being ignored: silently
            dropping it would be indistinguishable from applying it, and the
            panel would show a state the server does not have.
          additionalProperties:
            type: [boolean, 'null']
    RecommendedFeature:
      type: object
      description: >
        One feature family placed in this learner's recommendation order.
      required: [rank, code, label, kind, usesModel, delivery, score, autoEnabled, enabled, reasons]
      properties:
        rank:
          type: integer
          description: >
            1-based place. TIED SCORES SHARE A RANK and the next place skips
            (1, 2, 2, 4) - printing "2nd" and "3rd" for two equal scores would
            claim a difference the engine does not have.
        code:
          type: string
          description: >
            The feature family code, `F1`-`F13` or `A1`-`A8`.
        label:
          type: string
        kind:
          type: string
          enum: [GENERAL, AI]
          description: >
            WHICH OF THE TWO FEATURE CATALOGUES this family comes
            from - provenance, and nothing more.


            This field used to be described here as "an `AI` family costs the
            org's allowance, is RAG-grounded and AI-chip-labelled, and degrades
            to plain content on a provider outage". Those are claims about
            MECHANISM, and `A6` disproves all four: it is in the AI catalogue
            and computes light maths over the learner's own attempt records with
            no gateway call at all. A client that gated an AI affordance on this
            value told the learner so - see `usesModel`, which is the field for
            that question.
        usesModel:
          type: boolean
          description: >
            WHETHER THIS FAMILY'S OUTPUT ACTUALLY COMES FROM A MODEL - what the
            cyan ✦ AI chip asserts, and the field a client must gate that chip
            on rather than on `kind`.


            True for every AI-catalogue family except `A6`. Read this for
            anything that is really about a model running: an over-quota
            explanation, a "this was AI-generated" label, a degradation notice.
            Read `kind` only for grouping by the report's catalogue.
        delivery:
          type: string
          enum: [LIVE, PLANNED]
          description: >
            Whether anything consumes this family YET - not whether the feature
            exists. Search and free navigation exist; neither is profile-driven,
            so recommending them changes nothing a learner sees.


            `LIVE` at the time of writing: `F1`, `F2`, `F3`, `F4`, `F5`, `F6`,
            `F7`, `F10`, `F11`, `F12`, `F13`, `A1`, `A2`, `A3`, `A4`, `A5`, `A6`,
            `A8`. This list goes stale on every promotion and the response is the
            arbiter: read this field rather than the list.
        score:
          type: number
          description: >
            The score-weighted union: the sum of the weights of the endorsed
            categories marking it. Zero when nothing endorsed it.
        autoEnabled:
          type: boolean
          description: >
            Whether the ENGINE switched it on at setup. Requires an endorsing
            category at 4.0 or better ("Agree"), AND that the family is not
            opt-in-only, AND that it is `LIVE`. Never true for `F8` or `A8`.


            UNAFFECTED BY THE LEARNER'S OWN CHOICE - it stays the engine's
            answer, so a panel can still say "recommended for you" about
            something the learner switched off. Read `enabled` for the state to
            render a toggle in.
        override:
          type: boolean
          description: >
            The learner's own choice - the learner has full control,
            OMITTED when they have never made one.


            Absent and `false` are different states and a client must not
            collapse them: absent means the engine's answer stands, `false`
            means the learner said no. That distinction is what makes "reset to
            recommended" expressible - clearing an override is `null` on the
            PATCH, and it comes back as this field being absent again.
        enabled:
          type: boolean
          description: >
            WHAT THE LEARNER ACTUALLY RECEIVES, and the field a single on/off
            control should be bound to: the `override` when there is one,
            otherwise `autoEnabled`.


            Never true for a `PLANNED` family whatever is stored - "enabled"
            must not describe something no part of the product reads. Note the
            asymmetry with `autoEnabled` for the opt-in-only families: `F8` and
            `A8` are never auto-enabled at any score (rule 5), but an explicit
            `override` of `true` IS honoured, because that is the opt-in the
            rule is named for.


            IT IS NOT SUFFICIENT ON ITS OWN FOR A FAMILY WHOSE `kind` IS `AI`. Those features personalise FROM the profile, so they
            additionally require `signature` to be present: with no signature
            there is nothing to key the transformation cache on, and the
            re-presentation routes answer `204` whatever this field says. The
            two are not redundant - an override is stored in its own table and
            survives a retake that erases the answers, so `enabled: true` with
            no `signature` is an ordinary state and not a malformed one. Bind an
            AI control to BOTH, or it offers something that can never work.
        reasons:
          type: array
          description: The endorsing categories, strongest first; empty when not recommended
          items:
            $ref: '#/components/schemas/FeatureReason'
    FeatureReason:
      type: object
      description: Why a family was recommended - the preference that asked for it
      required: [key, label, strength, weight]
      properties:
        key:
          type: string
        label:
          type: string
        strength:
          type: number
        weight:
          type: number
    ProfileAppearanceDefaults:
      type: object
      description: >
        Look-and-feel settings the profile SUGGESTS - defaults, never
        saved choices. `/appearance/preferences` stays the record of what the
        person actually chose; resolve explicit choice, then these, then the
        client's own default. A field the profile says nothing about is OMITTED,
        never sent as null - the same convention `/appearance/preferences` uses,
        so a client resolving the layers reads one shape rather than two. Most
        settings are always absent: no sub-dimension measures text size, line
        spacing or reading face.
      properties:
        theme:
          type: string
          enum: [light, dark, high-contrast, system]
          description: From OD2's Light sub-dimension - strongly Bright suggests light, strongly Dim dark
        focusMode:
          type: boolean
          description: >
            True when OD2's Sound reading is strongly Quiet. NEVER false: the spec states one direction, and a preference
            for noise says nothing about focus mode the engine may state.
    AiFeedbackRequest:
      type: object
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [UP, DOWN]
          description: >
            👍 or 👎. BOTH are stored, because ratings are aggregated and a
            rate needs a denominator - a 👎-only record can report how many
            complaints arrived and never how often the rewrites were right.
        reason:
          type: string
          enum: [WRONG, CONFUSING, UNFAITHFUL]
          description: >
            One of three phrases - "this is wrong / confusing / doesn't
            match the source". REQUIRED for a `DOWN` and FORBIDDEN on an `UP`,
            checked in both directions: the repair loop reads the reason, so a
            reasonless complaint is a flag nothing can route, and a rating
            carrying one reads as approval to the aggregation and as a complaint
            to anything reading reasons.
        note:
          type: string
          maxLength: 2000
          description: >
            The learner's own words, optional.


            IT NEVER REACHES A PROMPT - not the faithfulness re-check and not the
            regeneration. Its only reader is a human reviewing an escalation.
            Stored with control characters removed - a NUL is a database error,
            and therefore a free 500 from any member if it were not.


            `maxLength` is ENFORCED, and over it is a `400` rather than a silent
            truncation. The service truncates as well, which is the belt behind
            the braces for a future non-HTTP caller; on this route the bound is
            reached first and the learner is told, because a note quietly cut in
            half is a flag whose only useful content may be the part that was
            dropped. Nothing is lost in practice - the client's own textarea
            carries the same bound, so the refusal is unreachable from the
            reader.


            Private to the learner: someone explaining a problem types context about
            themselves, so it is never org-visible and never leaves in a report
            or an export.
      description: >
        A learner's rating of one cached re-presentation. The cache
        entry is the path parameter rather than a field here, so a client cannot
        disagree with itself about which item is being flagged.
    TransformKind:
      type: string
      enum: [simplify, summarise, expand, analogy, spoken, why-it-matters, key-points, outline]
      description: >
        What a cached AI passage did to its source.


        THESE ARE THE PLATFORM'S, NOT ONE ROUTE'S. The re-presentation is one
        template with a placeholder rather than six templates, so the vocabulary is
        governed by the platform and a new kind is a contract change and a
        mapping together.


        THE FULL VOCABULARY, WHICH IS WHAT A RESPONSE CARRIES - a request never
        uses this schema. The first six act on ONE BLOCK; the last
        two summarise a whole SECTION. Requests use
        `BlockTransformKind` or `SectionTransformKind`, which is how the two
        routes stay unable to accept each other's vocabulary: `key-points` on a
        single paragraph would send it to a prompt written for a section and
        cache the reply as that section's key points - faithfulness-checked
        against the paragraph it was given, so it passes, and wrong.


        `expand` rather than `elaborate`, deliberately.
    BlockTransformKind:
      type: string
      enum: [simplify, summarise, expand, analogy, spoken, why-it-matters]
      description: >
        The six that act on one block. What the per-block re-presentation
        routes accept - see `TransformKind` for why the request vocabulary is
        narrower than the response's.
    SectionTransformKind:
      type: string
      enum: [key-points, outline]
      description: >
        The two that summarise a whole section. They are one template with a
        style of "key-point bullets | outline"; they are two
        kinds here because the cache key carries no style, so one kind would
        make the bullets and the outline of a section collide on it and the ✦
        chip would name the wrong artefact.
    RePresentRequest:
      type: object
      description: >
        Which of the six rewrites the learner asked for. The kind is the
        ONLY thing a caller names - the version, the document, the source text,
        the profile and the prompt are all derived server-side, which is what
        keeps "document content is data, never instructions" true here.
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/BlockTransformKind'
    SummariseSectionRequest:
      type: object
      description: >
        Which of the two summaries the learner asked for. The block
        id in the path must name a SECTION, and what is summarised is that
        section's DESCENDANTS - never the section row's own text, which is its
        heading.
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/SectionTransformKind'
    DefineTermRequest:
      type: object
      description: >
        The phrase a learner asked about.


        THE ONE FIELD IN THIS API THAT A CLIENT FILLS AND A PROMPT RECEIVES.
        Every other untrusted string on these routes came out of an upload. It is
        bounded here, fenced in the prompt, and - the bound that actually
        constrains it - required by the server to OCCUR in the named block's own
        text, which reduces it to a substring of content the platform already
        holds. A term that does not occur there is `204`, and no gateway call is
        made.
      required: [term]
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 100
          description: A word or short phrase, as selected in the reader
    GlossaryDefinition:
      type: object
      description: >
        One term, defined as this material uses it.


        Its own type rather than a `RePresentation` with a ninth kind: a
        re-presentation REPLACES a block's text and names which transformation
        the chip is claiming, while a definition transformed nothing - so a kind
        field could only be filled with a lie.


        It still cites, and exactly once, because ATLAS serves no
        uncited AI text. The citation is the block the term was read in, which is
        also the model's only context and what the faithfulness check ran
        against.
      required: [term, definition, citations]
      properties:
        term:
          type: string
          description: The phrase, as it occurs in the block
        definition:
          type: string
          description: >
            1-2 plain sentences. PLAIN TEXT - the client escapes on render and
            parses no markdown
        citations:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/RePresentationCitation'
    ConceptMapGraph:
      type: object
      description: >
        A concept map as nodes and links, after the model's reply has been parsed
        and accepted.


        THIS SHAPE IS THE SECURITY BOUNDARY, which is why the wire carries it
        rather than a Mermaid spec. Mermaid's `graph` dialect is not inert: it
        carries `click` directives that bind a node to a URL or a JavaScript
        callback, `%%{init: ...}%%` configuration blocks, and an `htmlLabels`
        mode that renders label text as HTML. Reduced to identifiers and
        plain-text labels, none of those constructs exists any more - so a
        renderer cannot execute one even if a later refactor swaps the renderer.


        It is also what the platform STORES, under `generated/`, rather than the
        reply text: the parse happens once, before the artefact becomes durable,
        because the cache is platform-wide and one poisoned entry would be served
        to every learner in the cohort thereafter.
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          minItems: 1
          maxItems: 60
          description: >
            Every concept, in the order the passage introduced them. Never empty.


            The bound is the server's own - a reply carrying more is refused
            whole rather than truncated - and it is stated here so an SDK
            generated from this description inherits it rather than trusting an
            unbounded array from a model
          items:
            $ref: '#/components/schemas/ConceptMapNode'
        edges:
          type: array
          maxItems: 120
          description: >
            The links between them. MAY BE EMPTY - a passage naming one concept
            is a map with nothing to link, not a failure
          items:
            $ref: '#/components/schemas/ConceptMapEdge'
    ConceptMapNode:
      type: object
      description: One concept in a concept map.
      required: [id, label]
      properties:
        id:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          description: >
            The identifier the spec used, and what edge endpoints name. Unique
            within the graph
        label:
          type: string
          maxLength: 120
          description: >
            What to draw in the node. PLAIN TEXT - the client escapes on render
            and parses no markup. An unlabelled node carries its own id here,
            which is what Mermaid draws.


            Longer than one node box holds, deliberately: the bound is a refusal
            bound rather than a drawable one, and the reader wraps and elides
    ConceptMapEdge:
      type: object
      description: >
        One link between two concepts.


        It carries no arrow style. Mermaid distinguishes `-->` from `---` and
        `==>`, and the server accepts all of them because they are equally
        inert - but the difference is decoration, and keeping it would put a
        rendering instruction from a model into a stored artefact for no gain.
      required: [from, to]
      properties:
        from:
          type: string
          description: The source node's id - always present in `nodes`
        to:
          type: string
          description: The target node's id - always present in `nodes`
        label:
          type: [string, 'null']
          maxLength: 120
          description: >
            What the link asserts, or absent when the spec gave it none. PLAIN
            TEXT, escaped by the client on render
    WorkedExample:
      type: object
      description: >
        One section worked as a step-by-step example, labelled and cited.


        THE ARRAY'S ORDER IS THE STEP NUMBER. There is no `n` field, because a
        model that numbers its own steps can number them inconsistently while an
        array cannot - so a client renders `steps` in the order received and
        numbers them itself. There is no separate outcome or answer field
        either: the last step states the result, which is what makes every
        rendered element part of the sequence the faithfulness check saw.


        IT CARRIES NO CACHE-ENTRY ID, for the concept map's reason below and not
        a new one. A worked example is filed in its own store, which has no
        feedback edge and no supersede path, so an id here could not be flagged,
        re-checked or regenerated. Rendering thumbs that do nothing costs the
        learner the effort and teaches them nothing; that gap is tracked. The
        report path still acts on the resource.
      required: [title, steps, citations]
      properties:
        title:
          type: string
          minLength: 1
          description: A short label for the sequence
        steps:
          type: array
          minItems: 2
          description: >
            The procedure, in the order it is performed. AT LEAST TWO, always -
            a worked example is broken into clear steps, and a single step is a paragraph with a title on it. A shorter reply
            is retried by the server and then refused as `204`, so a client never
            sees one and must not code for it
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
                minLength: 1
                description: >
                  One step, in plain prose. The model is forbidden Markdown, headings and
                  bullet markers - the client renders it as text and must not
                  interpret markup in it
        citations:
          type: array
          minItems: 1
          description: >
            Links back to the source blocks the example was worked from.
            AT THE ARTEFACT LEVEL, NOT PER STEP: no shipped prompt is
            sent block ids, so a per-step source id could only be one the model
            never saw. THE DESCENDANTS THAT ACTUALLY CONTRIBUTED, in document
            order - the server drops CODE blocks and blocks with no text when
            assembling, so citing the whole subtree would name blocks the model
            never saw
          items:
            $ref: '#/components/schemas/RePresentationCitation'
    ScenarioRun:
      type: object
      description: >
        One branching scenario, labelled and cited, with the caller's own place
        in it.


        THE ANSWER KEY IS STRUCTURALLY ABSENT. An option here carries `text` and
        nothing else - no `correct` flag, no `consequence`. Marking a choice
        happens server-side by comparing the submitted position against the
        option the model flagged correct, which is only meaningful if the key was never
        in the browser. A client that wants to show what a choice leads to must
        submit the step and read `ScenarioStepResult.consequence`.


        THE ARRAY'S ORDER IS THE STEP NUMBER, and it is also each option's
        IDENTITY: submissions name a position, so a client that re-sorted either
        array would silently change what a learner answered.


        IT CARRIES NO CACHE-ENTRY ID, for the worked example's reason. A scenario
        is filed in its own store, which has no feedback edge and no supersede
        path, so an id here could not be flagged, re-checked or regenerated
        (that gap is tracked). The report path still acts on the resource.
      required: [scenarioId, title, situation, steps, citations, progress]
      properties:
        scenarioId:
          type: string
          format: uuid
          description: The artefact, for submitting steps against
        title:
          type: string
          minLength: 1
          description: A short label
        situation:
          type: string
          minLength: 1
          description: >
            The opening, one to three sentences. It restates the section's own
            subject - it does not invent a case to illustrate it
        steps:
          type: array
          minItems: 2
          description: >
            The spine, in the order the steps are performed. AT LEAST TWO,
            always: a single decision is a question with a situation attached,
            not a scenario. A shorter reply is retried by the server and then
            refused as `204`, so a client never sees one
          items:
            $ref: '#/components/schemas/ScenarioStep'
        citations:
          type: array
          minItems: 1
          description: >
            Links back to the source blocks the scenario was built from. AT
            THE ARTEFACT LEVEL, NOT PER STEP: no shipped prompt is
            sent block ids, so a per-step source id could only be one the model
            never saw
          items:
            $ref: '#/components/schemas/RePresentationCitation'
        progress:
          $ref: '#/components/schemas/ScenarioProgress'
    ScenarioStep:
      type: object
      description: One decision or written step of a scenario, as it is offered
      required: [kind, prompt, options]
      properties:
        kind:
          type: string
          enum: [choose, write]
          description: >
            `choose` offers options and is marked deterministically; `write` asks
            for the learner's own words and is marked by A5
        prompt:
          type: string
          minLength: 1
          description: >
            What the learner is asked, in plain prose. The model is forbidden Markdown,
            headings and bullet markers - render it as text
        options:
          type: array
          description: >
            The actions offered, in the model's own order. EMPTY for a `write` step. A
            `choose` step always offers at least two, and exactly one of them is
            correct - which the server knows and this response does not say
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
                minLength: 1
                description: One action the learner may take, in plain prose
    ScenarioProgress:
      type: object
      description: >
        How far this learner has got, and what they settled on the way. THE
        CALLER'S OWN AND NOBODY ELSE'S: the store
        has no org-scoped read path, so there is no shape of this endpoint that
        returns another learner's route.
      required: [stepIndex, completed, settled]
      properties:
        stepIndex:
          type: integer
          format: int32
          minimum: 0
          description: >
            The ZERO-BASED step they are on, and the only value
            `submitScenarioStep` accepts. Equal to `steps.length` once finished
        completed:
          type: boolean
          description: Whether the last step has been settled
        settled:
          type: array
          description: Every step already behind them, in order
          items:
            type: object
            required: [stepIndex, kind]
            description: >
              WHICH FIELDS ARE PRESENT IS DECIDED BY `kind`, not by chance. A
              `choose` step carries `chosenOption`, `correct` and `consequence`
              (plus `revealedOption` when the tries ran out); a `write` step
              carries `response` and, when there is one, `score`, `maxScore` and
              `feedback`. The two sets never overlap
            properties:
              stepIndex:
                type: integer
                format: int32
                minimum: 0
              kind:
                type: string
                enum: [choose, write]
              chosenOption:
                type: integer
                format: int32
                minimum: 0
                description: The POSITION the learner picked, for a `choose` step
              correct:
                type: boolean
                description: Whether that choice was the stated one
              consequence:
                type: string
                description: >
                  The model's one sentence for the option that was taken - or for the
                  revealed one. Untrusted model output: escape it, never inject
                  it as HTML
              revealedOption:
                type: integer
                format: int32
                minimum: 0
                description: >
                  The correct option's position, present ONLY when the tries ran
                  out and the step revealed it
              response:
                type: string
                description: The learner's own words, for a `write` step
              score:
                type: integer
                format: int32
                minimum: 0
                description: What A5 gave it; absent when it could not be marked
              maxScore:
                type: integer
                format: int32
                minimum: 1
              feedback:
                type: string
                description: >
                  A5's prose, faithfulness-checked. Untrusted model output
    ScenarioStepSubmission:
      type: object
      description: >
        What a learner sends at one step. WHICH FIELD APPLIES IS DECIDED BY THE
        STEP, not by this body: the server holds the spine, so a body carrying
        the wrong one is refused rather than guessed at.
      properties:
        optionIndex:
          type: integer
          format: int32
          minimum: 0
          maximum: 31
          description: >
            The chosen option's ZERO-BASED position in that step's own array, for
            a `choose` step. A POSITION AND NEVER A TEXT - which is what makes
            the mark an identity comparison, and what stops a client fabricating
            an option
        answer:
          type: string
          maxLength: 2000
          description: >
            The learner's own words, for a `write` step. The same ceiling as a
            practice attempt's response, deliberately: both reach free-text marking through the
            same estimator, so two ceilings would price one request two ways
    ScenarioStepResult:
      type: object
      description: >
        What happened at one step, and where the learner is now: the next step,
        with instant feedback.


        A WRONG CHOICE IS INFO-BLUE, NEVER RED. Nothing here
        is an error state: `consequence` says what happens next, and an unsettled
        step is another go rather than a failure.
      required: [stepIndex, settled, triesLeft, nextStepIndex, completed]
      properties:
        stepIndex:
          type: integer
          format: int32
          minimum: 0
          description: The step this answers
        settled:
          type: boolean
          description: >
            Whether the scenario has moved past it. False ONLY on a `choose` step
            whose tries are not yet spent - every other outcome advances,
            including one A5 could not mark
        correct:
          type: boolean
          description: >
            Whether a `choose` step's chosen option was the stated one. Absent on
            a `write` step, where correctness is a score rather than a boolean
        consequence:
          type: string
          description: >
            The model's one sentence for the option that was taken - or, once the bound
            is reached, for the revealed one. Untrusted model output: escape it,
            never inject it as HTML
        revealedOption:
          type: integer
          format: int32
          minimum: 0
          description: >
            The correct option's position, present ONLY once the re-choose bound
            is reached and the step settled itself
        triesLeft:
          type: integer
          format: int32
          minimum: 0
          description: How many more goes this step allows before it reveals
        mark:
          $ref: '#/components/schemas/StepMark'
        nextStepIndex:
          type: integer
          format: int32
          minimum: 0
          description: >
            Where the learner is now. Equal to `stepIndex` while a `choose` step
            is unsettled
        completed:
          type: boolean
          description: Whether that was the last step
    StepMark:
      type: object
      description: >
        A5's mark for one `write` step.
        The same pipeline that marks a practice attempt, behind a second entry
        point - so the per-point shape is `Mark`'s exactly. It carries no attempt
        id and no question id because a scenario step is neither.
      required: [score, maxScore, perPoint, feedback, citations]
      properties:
        score:
          type: integer
          format: int32
          minimum: 0
          description: >
            The summed weights of the points that were met AND could quote the
            answer - computed by the server, never taken from the model
        maxScore:
          type: integer
          format: int32
          minimum: 1
        perPoint:
          type: array
          description: >
            The breakdown, in the rubric's own order. NOT-MET POINTS RENDER
            INFO-BLUE, NEVER RED
          items:
            $ref: '#/components/schemas/MarkPoint'
        feedback:
          type: string
          description: >
            The prose, faithfulness-checked against the section, the rubric and
            the learner's own answer. Untrusted output
        citations:
          type: array
          minItems: 1
          description: >
            The blocks the scenario was written from, plus the blocks its rubric
            was built from. ARTEFACT-LEVEL, so every `write` step of one scenario
            carries the same list
          items:
            $ref: '#/components/schemas/RePresentationCitation'
    ConceptMap:
      type: object
      description: >
        One section's concept map, labelled and cited.


        IT CARRIES NO CACHE-ENTRY ID, and that is a decision rather than an
        omission. `RePresentation.cacheEntryId` exists so the chip can offer a
        thumbs-up or thumbs-down against "the exact cached item", and feedback
        references the transform cache. A concept map is filed in the
        generated-asset store, which is a different table with no feedback edge
        and no supersede path - so an id here could not be flagged, re-checked or
        regenerated. Rendering thumbs that do nothing costs the learner the
        effort and teaches them nothing, so the client renders the chip without
        them. The report path still acts on the resource.
      required: [graph, citations]
      properties:
        graph:
          $ref: '#/components/schemas/ConceptMapGraph'
        citations:
          type: array
          minItems: 1
          description: >
            Links back to the source blocks the map was drawn from. THE
            DESCENDANTS THAT ACTUALLY CONTRIBUTED, in document order - not the
            section that contains them: the server drops CODE blocks and blocks
            with no text when assembling, so citing the whole subtree would name
            blocks the model never saw
          items:
            $ref: '#/components/schemas/RePresentationCitation'
    QuizRequest:
      type: object
      description: >
        What a learner asks for when they start a quiz. Every field is bounded here because each one multiplies gateway
        calls: a batch is one generation plus one check per item.
      required: [count, difficultyMix, questionTypes]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 20
          description: >
            How many questions to write. The server applies its own ceiling as
            well and THE SMALLER WINS, silently - the request is legitimate and a
            smaller batch is a good answer to it, so read `questions.length`
            rather than assuming this value came back
        difficultyMix:
          $ref: '#/components/schemas/QuizDifficultyMix'
        questionTypes:
          $ref: '#/components/schemas/QuizTypeMix'
    QuizDifficultyMix:
      type: string
      enum: [BALANCED, HARDER, GENTLER]
      description: >
        The difficulty spread asked of the model. AN ENUM RATHER THAN FREE TEXT,
        and that is a prompt-injection boundary: the value is interpolated into
        the model's instructions, which is the one place the source delimiters do not
        reach, because this text is not the source.


        `HARDER` is the optional harder set for the OD9 high-control pole and
        `GENTLER` its opposite. Both are REQUEST shapes rather than stored
        settings - `PracticeSettings.harderSetEnabled` decides whether the control
        is OFFERED, and this decides what one press asks for.
    QuizTypeMix:
      type: string
      enum: [ALL, SHORT_AND_OPEN, MULTIPLE_CHOICE]
      description: >
        Which types a batch asks the model for. An enum for `QuizDifficultyMix`'s
        reason.


        `SHORT_AND_OPEN` is the deck-building shape: an MCQ yields no flashcard,
        so a learner building a deck asks for the types that do. Without it the
        only way to fill a deck would be to regenerate a mixed batch until enough
        non-MCQ items happened to appear, which spends an allowance on a
        filtering problem.
    Quiz:
      type: object
      description: >
        One section's batch of checked questions, labelled and cited.


        IT CARRIES NO CACHE-ENTRY ID, and unlike `ConceptMap` that is a DEFERRAL
        rather than a decision. Every AI output should carry a thumbs pair,
        a quiz question included, down to how it would be re-checked. What a
        question lacks is only the EDGE: feedback points at the transform cache,
        and a question bank is a different store. It is
        tracked; until it ships, a client renders the chip without thumbs.
      required: [questions, citations]
      properties:
        bankId:
          type: [string, 'null']
          format: uuid
          description: >
            The stored batch, or `null` when the server could not file one -
            which happens when the gateway did not identify the answering model.
            The questions are still grounded, checked and cited; what is missing
            is the row. A batch with no `bankId` has no question ids either and
            cannot be answered, so a client renders it read-only
        questions:
          type: array
          minItems: 1
          description: >
            The checked questions, in the order this learner should meet them.
            THE ORDER IS CALIBRATED, not the generation order: items whose
            observed cross-learner correct-rate sits nearest the 70-85% band come
            first, falling back to the model's own difficulty label where too few
            distinct people have answered for a rate to be used
          items:
            $ref: '#/components/schemas/QuizQuestion'
        citations:
          type: array
          minItems: 1
          description: >
            The blocks the BATCH was written from, in document order - the
            descendants that actually contributed, since the server drops CODE
            blocks and blocks with no text when assembling. EVERY QUESTION IN THE
            BATCH SHARES THIS LIST; a chip claiming a per-question
            origin would over-state the mechanism
          items:
            $ref: '#/components/schemas/RePresentationCitation'
    QuizQuestion:
      type: object
      description: >
        One generated question, as the learner sees it before answering.


        THERE IS NO ANSWER-KEY FIELD, and there is none to omit. Marking is
        deterministic and server-side, which is meaningless if the key was in the
        browser; the key arrives in `AttemptResult` after the learner answers.
      required: [ordinal, type, stem, hint, difficulty]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: >
            The stored question, or `null` in an unfiled batch (see `Quiz.bankId`).
            An answer can only be submitted against a stored question
        ordinal:
          type: integer
          description: Position within the batch as generated, from 1
        type:
          $ref: '#/components/schemas/QuizQuestionType'
        stem:
          type: string
          description: >
            The question as asked. MODEL OUTPUT, so untrusted all the way to what
            renders it - never inserted as markup
        options:
          type: array
          description: >
            The choices, present exactly when `type` is `mcq` and empty
            otherwise. Between two and eight, and the correct answer is always one
            of them
          items:
            type: string
        hint:
          type: string
          description: >
            One sentence STATING something the source says that narrows the answer
            down, without containing the answer itself. It is checked
            against the source exactly as the answer key is - the statement form is
            what makes that check able to refuse, because a directive asserts
            nothing for the checker to weigh.


            Hint-before-answer is the default flow for this
            zone, so it is always present
        difficulty:
          $ref: '#/components/schemas/QuizDifficulty'
    QuizQuestionType:
      type: string
      enum: [MCQ, SHORT, OPEN]
      description: >
        What kind of question this is.


        `MCQ` and `SHORT` are marked by the server. `OPEN` IS NOT MARKED AT ALL
        on submission - `AttemptResult.correct` is `null` for one, and a
        client renders the unmarked slot rather than a default verdict.


        Only `SHORT` and `OPEN` yield flashcards: an item with an `options` array
        has no honest front and back.
    QuizDifficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
      description: >
        The model's own difficulty label for one item.


        THE STARTING POINT, NOT THE ANSWER. Ordering refines it from cross-learner
        counts; this is what the server falls back to on an empty attempts table,
        which is the state every first learner gets.
    SubmitAttemptRequest:
      type: object
      description: One submitted answer.
      required: [response]
      properties:
        response:
          type: string
          minLength: 1
          maxLength: 2000
          description: >
            What the learner typed or chose. FOR AN MCQ THIS IS THE OPTION TEXT,
            NOT AN INDEX - an index would be meaningless the moment the options
            were re-ordered for presentation, and the correct answer is always one
            of the option strings
    AttemptResult:
      type: object
      description: >
        What a learner is told after submitting one answer.
        THE FIRST RESPONSE THAT CARRIES THE ANSWER KEY - see the route.
      required: [attemptId, questionId, attemptIndex, answerKey, citations]
      properties:
        attemptId:
          type: string
          format: uuid
          description: >
            This attempt's own id, so a client can ask for the MARK
            on an open answer. Marking is a second request by design: the answer
            is stored first - it is a fact either way - and the up-to-four gateway
            calls that mark it must not run inside the transaction that records it
        questionId:
          type: string
          format: uuid
        attemptIndex:
          type: integer
          description: >
            Which try this was, from 1, counted ACROSS every organisation this
            learner holds the content in - the same platform-wide question can be
            met through two orgs' resources
        correct:
          type: [boolean, 'null']
          description: >
            The server's verdict for a question the server can mark without a
            model - MCQ and short answer. `null` for an OPEN item, ALWAYS: an
            open answer's mark is a rubric breakdown rather than a boolean, so it
            never collapses into this field. Null is not "wrong" and not "pending";
            it means ask the mark route
        answerKey:
          type: string
          description: >
            The correct answer, STATED in the source rather than derived from it. A derived key - a count, a sum, a conversion, an ordering
            - is neither supported nor contradicted by the source, so the
            faithfulness checker has nothing to weigh: measured, a false derived
            key passed 8 times in 10 while a false stated one was refused 10 of
            10. The model is forbidden them for that reason
        citations:
          type: array
          description: >
            The blocks the batch was written from - the same list every question
            in it carries. This is what an explanation links to; there is no
            per-question excerpt, because an artefact-level citation cannot
            support one and no spec defines the narrowing rule
          items:
            $ref: '#/components/schemas/RePresentationCitation'
    MarkView:
      type: object
      description: >
        An AI mark for one open answer.


        THIS SHAPE EXISTS ONLY FOR A MARK THAT WAS MADE. An answer ATLAS could
        not mark is a 204 with no body: the score is withheld entirely, and a
        view with nullable score fields would put "no mark" and "a mark of
        nothing" one refactor apart.


        THE MARKER ALSO RETURNS A `confidence`, AND IT IS DELIBERATELY NOT HERE. It is
        stored and gates nothing; a field on this schema is the shortest
        path from stored to a screen, after which a model's self-doubt about a
        named learner's answer is a per-member signal.
      required: [attemptId, questionId, score, maxScore, perPoint, feedback, citations]
      properties:
        attemptId:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        score:
          type: integer
          description: >
            The summed weights of the points that were met AND could quote the
            learner's answer. Computed by the server from the stored rubric, never
            taken from the model - the arithmetic is the one part of a mark that
            can be proven rather than judged
        maxScore:
          type: integer
        perPoint:
          type: array
          description: >
            The breakdown, in the stored rubric's own order. A not-met point is a
            learner doing the thing practice is for: render it INFO-BLUE and never
            red
          items:
            $ref: '#/components/schemas/MarkPoint'
        feedback:
          type: string
          description: >
            The prose, faithfulness-checked against the section, the rubric AND the
            learner's own answer. Untrusted model output shaped by two untrusted
            texts: escape at render time, never inject as HTML
        citations:
          type: array
          description: >
            The blocks this question's batch was written from, plus the blocks its
            rubric was built from - computed by the assembler, never parsed out of
            the model's prose. ARTEFACT-LEVEL: every open answer on one section
            carries the same list, and a client must not imply otherwise
          items:
            $ref: '#/components/schemas/RePresentationCitation'
    MarkPoint:
      type: object
      description: One rubric point as marked.
      required: [point, met]
      properties:
        point:
          type: string
          description: >
            The point exactly as the STORED rubric states it - the server's copy, so
            a model that paraphrased cannot change what the learner is shown
        met:
          type: boolean
        evidence:
          type: [string, 'null']
          description: >
            The learner's own words that earned this point, quoted from their answer
            and verified server-side to be present in it; null when the point was not
            met. It is what makes `met` a claim the learner can check rather than a
            verdict they have to accept - and it is an anti-hallucination control, not
            a proof that the point was understood
    RecentAttempt:
      type: object
      description: One row of the recent-attempts list.
      required: [questionId, stem, attemptedAt]
      properties:
        questionId:
          type: string
          format: uuid
        stem:
          type: string
          description: >
            The question as asked, so the row is readable without a second fetch.
            Model output, so untrusted at the point of render
        correct:
          type: [boolean, 'null']
          description: The verdict, or `null` for an OPEN item
        attemptedAt:
          type: string
          format: date-time
    Deck:
      type: object
      description: One flashcard deck. A deck IS a question bank.
      required: [bankId, sectionBlockId, cardCount, dueCount]
      properties:
        bankId:
          type: string
          format: uuid
        resourceId:
          type: [string, 'null']
          format: uuid
          description: >
            Which of THIS organisation's resources holds the document these questions
            were written from, or `null` if it no longer holds one. A bank is filed
            against a DOCUMENT, which is shared platform-wide, so without this a screen
            away from the reader has a citation it cannot link anywhere. Null is a real
            state - a trashed or replaced resource still leaves the learner their cards -
            and a client says the citation is unlinkable rather than rendering a dead link
        sectionBlockId:
          type: string
          format: uuid
          description: >
            The section its questions were written from, so a client can link into the
            reader without a second fetch
        cardCount:
          type: integer
          description: >
            How many of the bank's questions yield cards - SHORT and OPEN only.
            Zero is a real value and means the client offers no card affordance at
            all rather than an empty one
        dueCount:
          type: integer
          format: int64
          description: How many of those are due for this learner now
    Card:
      type: object
      description: >
        One flashcard, derived from a question. NOTHING
        STORES A CARD - it is a projection of a question, so storing one would
        create a second source of truth for text the document already grounds.
        The only stored thing is the schedule, which is about the learner.
      required: [questionId, front, back, citations, reviewCount]
      properties:
        questionId:
          type: string
          format: uuid
          description: The question this card is a view of; also the schedule's key
        resourceId:
          type: [string, 'null']
          format: uuid
          description: >
            Which resource to open the citation in, or `null` if this organisation holds
            none. See `Deck.resourceId` - cards render away from the reader, so a block id
            with no resource to open it in resolves to nothing
        front:
          type: string
          description: The question stem. Model output, untrusted at render
        back:
          type: string
          description: The answer key
        citations:
          type: array
          description: >
            The QUESTION'S OWN citation list, carried rather than re-derived -
            which is what makes "a card can never cite something its question does
            not" true by construction
          items:
            $ref: '#/components/schemas/RePresentationCitation'
        dueAt:
          type: [string, 'null']
          format: date-time
          description: >
            When this learner is next due to see it, or `null` if they have never
            graded it - which is also what puts a card outside every deck listing
        reviewCount:
          type: integer
          description: How many times this learner has graded it
    CardGrade:
      type: string
      enum: [AGAIN, HARD, GOOD, EASY]
      description: >
        A learner's own verdict on a card they have just seen.
        SELF-GRADED, and no AI call is made anywhere in this loop.


        `AGAIN` resets the interval to one day rather than halving it - a card
        answered wrong is one the learner does not know, and halving a 60-day
        interval still puts it a month away. `HARD` holds, `GOOD` doubles, `EASY`
        quadruples, all bounded at a year.
    GradeCardRequest:
      type: object
      description: >
        One self-grade. A wrapper around the enum rather than the enum on the
        wire, so a later field - a time taken, a confidence - is an additive
        change rather than a new route.
      required: [grade]
      properties:
        grade:
          $ref: '#/components/schemas/CardGrade'
    LearnerTone:
      type: object
      required: [tone]
      description: >
        The tone this learner's own screens should speak in.


        ONE FIELD, AND WHAT IS ABSENT IS THE DESIGN - see `getLearningTone`. The
        signals behind the value, their thresholds and their window are
        implementation and are deliberately not on the wire: a client rendering a
        score would be coupled to all of it, and the estimate itself is in
        the tier no plan, setting or role unlocks.
      properties:
        tone:
          type: string
          enum: [SUPPORTIVE, NEUTRAL, CHALLENGING]
          description: >
            The tone's three values. `NEUTRAL` for every learner
            who does not receive A8 - which is most of them, because A8 is opt-in -
            and for one who receives it and is getting on fine. The two are
            deliberately indistinguishable here: nothing on a screen should depend
            on telling them apart.
    PracticeSettings:
      type: object
      description: >
        The three knobs OD9's two poles get instead of a difficulty setting.


        THREE, NOT TWO, AND THE THIRD IS THE ONE WORTH NAMING. Timer and harder
        set are the obvious pair. `retryOfferEnabled` exists because retry is
        ALWAYS available - so the setting cannot gate the capability, only whether
        the affordance is SHOWN. A learner who finds a visible "try again"
        reproachful can hide it; the route still accepts another attempt. The
        learner declines the offer; ATLAS never withdraws it.
      required: [timerEnabled, harderSetEnabled, retryOfferEnabled]
      properties:
        timerEnabled:
          type: boolean
          default: false
          description: Whether a quiz shows a timer. Off by default - a timer is pressure
        harderSetEnabled:
          type: boolean
          default: false
          description: Whether a quiz offers the harder-set control
        retryOfferEnabled:
          type: boolean
          default: true
          description: >
            Whether a quiz shows the retry affordance. ON by default - retry is
            part of this zone's default flow
    AnchorKind:
      type: string
      enum: [highlight, block]
      description: >
        What an annotation is attached to.


        `highlight` is a character range in the block's CANONICAL text.
        `block` is the whole block, with no range - the shape offered inside a
        block currently showing an AI re-presentation, where a range in the
        RENDERED text has no canonical counterpart because that text is a
        cohort-shared cache entry the repair loop may replace. It is not a
        degraded highlight and says so in the UI; offering a disabled one would
        be a control that cannot act.
    LectureSearchRequest:
      type: object
      description: >
        What a learner typed into the in-lecture search field.


        Sent in a BODY rather than as `?q=`, and it is a privacy decision: a
        lecture-search query is the learner's own words about what they do not
        yet understand, so in a URL it would land in browser history on a shared
        machine, in ingress access logs, and in the `Referer` of anything the
        results link to.
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            The learner's search terms, as typed.


            REFUSED, NEVER TRUNCATED, past the ceiling. The embedding client
            silently truncates its own input, so an over-long query would be
            retrieved for by a PREFIX while the keyword half matched the whole
            string - two halves searching for different things, invisibly.


            Parsed by PostgreSQL's `websearch_to_tsquery` for the keyword half,
            so quoted phrases, `or`, and a leading `-` for exclusion all mean
            what a search box makes them mean. It never raises on punctuation,
            which is why it is used rather than `to_tsquery`.
    SearchCoverage:
      type: string
      enum: [answered, not-indexed, unavailable]
      description: >
        How much of the lecture one half of the search actually looked at.


        READ THIS BEFORE RENDERING AN EMPTY RESULT LIST. An empty `results`
        means at least five different things and only one of them is a finding
        about the lecture.


        `answered` - this half searched everything it could. **An empty list
        under this value is the "no results" state and means exactly
        that**: the lecture was searched and nothing matched.


        There is deliberately NO "partly indexed" value. Truncation is real -
        the chunker stops at 400 passages and the embedding stage stops when the
        per-document budget is spent, both in reading order - but nothing records
        that it happened, so a lecture indexed to 40% is indistinguishable at read
        time from a short one indexed whole. A draft carried such a value computed
        from a block ratio; it was counting block TYPES the chunker can never cite
        and would have fired on every document.


        `not-indexed` - this lecture has no meaning index at all, so neither
        half could run. Permanent: the index is content-addressed, so nothing
        re-indexes it. Say the lecture is not searchable, not that it lacks the
        thing they asked for.


        `unavailable` - this half could not run, and the reason is deliberately
        not said. Folds a provider outage, a repointed model alias and a spent
        allowance into one answer, because the allowance causes must stay
        indistinguishable and a refusal must not become a place where causes
        leak. NEVER used for "nothing matched".
    SearchMatch:
      type: string
      enum: [both, meaning, keyword]
      description: >
        Which half or halves found this passage - what makes "combined" visible
        in the ranking rather than merely claimed.


        `both` outranks a passage either half found alone at the same rank; that
        is the property reciprocal rank fusion gives and the one "combined" is
        asking for. `keyword` is the exact-term case an embedding
        misses (a symbol, a name, a term of art); `meaning` is the paraphrase
        case a full-text match misses.
    SearchHit:
      type: object
      description: One ranked result
      required: [chunkId, blockIds, snippet, textSource, matchedBy]
      properties:
        chunkId:
          type: string
          format: uuid
          description: The passage that matched; stable within a document, and what to key a row by
        blockIds:
          type: array
          items:
            type: string
            format: uuid
          description: >
            The blocks this passage was built from, in reading order - the jump
            target. Resolve the first to the reader's own `blk-` anchor, exactly
            as a citation chip does.


            MAY NAME A BLOCK THE READER IS NOT SHOWING. Ingestion accepts up to
            50 000 blocks and the reader serves at most `max-blocks`, truncated
            at a section boundary, so a hit in the tail of a very long lecture
            has nowhere on the page to jump to. Check before offering the jump
            rather than rendering a link that does nothing.
        snippet:
          type: string
          description: >
            The passage, excerpted around the match where there is one and from
            its opening where there is not.


            PLAIN TEXT. Produced with empty highlight delimiters rather than the
            database's default `<b>` markup, so this is the one thing a client
            must NOT render as HTML - highlight by matching plain strings
            instead. Document text is untrusted.
        textSource:
          $ref: '#/components/schemas/ChunkTextSource'
        matchedBy:
          $ref: '#/components/schemas/SearchMatch'
    LectureSearchResponse:
      type: object
      description: >
        The fused ranking and what each half was able to search.
      required: [results, meaning, keyword]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
          description: >
            Best first. The ORDER is the ranking and no score is returned - a
            client re-sorting by one would undo the combination. Empty is a
            legitimate answer whose meaning is carried by the two fields below.
        meaning:
          $ref: '#/components/schemas/SearchCoverage'
        keyword:
          $ref: '#/components/schemas/SearchCoverage'
    CreateTagRequest:
      type: object
      description: >
        A tag a learner is putting on a passage.


        Neither the version nor the learner is on this request, for
        `CreateAnnotationRequest`'s reasons.
      required: [blockId, label]
      properties:
        blockId:
          type: string
          format: uuid
          description: >
            The block being tagged. One belonging to another document is `404`,
            indistinguishable from absent
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            The learner's word for this passage. TRIMMED before it is stored, so
            `" important "` and `"important"` are one tag rather than two - which
            is also what keeps the uniqueness rule meaningful for what a text
            field sends. The ceiling is measured on what you SEND, before that
            trim.


            64 rather than a note's 4000 because a label is not prose: one long
            enough to be a sentence cannot sit in a chip, cannot be scanned down
            a list, and makes "one tag per passage per label" stop meaning
            anything.


            PLAIN TEXT, stored and returned exactly as typed. No markdown is
            parsed on either side.
    TagListResponse:
      type: object
      description: >
        The caller's own tags on one lecture.


        An OBJECT wrapping the array rather than a bare array, and the reason is
        the reader's access token rather than taste. The web BFF helper that
        refreshes a lapsed token mid-reading-session types an upstream body as an
        object, so a bare array forces a caller to hand-roll the proxy - and every
        reader route that has hand-rolled one has silently opted out of the refresh
        with it. The annotation listing is the precedent for the bare array AND
        for that cost.
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagResponse'
          description: Newest first, and bounded. Empty for a learner who has tagged nothing.
    TagResponse:
      type: object
      description: >
        One of the caller's own tags.


        No owner field, and the absence is the design: every row this can carry
        belongs to the caller, so one could only echo the JWT back - and it
        would make this look like something that could carry somebody else's
        row, which is the shape a later "list the org's tags" would be built on.
        No role unlocks that.
      required: [id, blockId, label, createdAt]
      properties:
        id:
          type: string
          format: uuid
        blockId:
          type: string
          format: uuid
          description: The block it is on - resolve to the reader's own `blk-` anchor
        label:
          type: string
          maxLength: 64
        createdAt:
          type: string
          format: date-time
    ChunkTextSource:
      type: string
      enum: [document, ai, mixed]
      description: >
        Who wrote the words in a retrieved passage.


        **Required reading before rendering a snippet, because AI text must
        always be labelled.** A passage is not always the document's own text: the
        meaning index is built over what is RETRIEVABLE, and for a figure that
        is D5's vision description - a model's sentences about an uploaded file.


        `document` - the document's own words, sealed and immutable.


        `ai` - a model's words ABOUT the document: an image description,
        alt-text, OCR, or a table summary. Written from attacker-supplied
        content, so this is also where an obeyed prompt injection would land.
        **Render the ✦ AI chip.**


        `mixed` - both, in one passage; a heading path prefixed onto a described
        image is the usual case. Treated as `ai` for labelling.


        This is the first route to expose the field. The tutor never needed it
        because it never SHOWS a passage - it feeds passages to a model and
        cites block ids. A search shows them.
    CreateAnnotationRequest:
      type: object
      description: >
        A highlight or a note a learner is saving.


        Neither the version nor the learner is on this request. The learner comes
        from the JWT, so the route has no IDOR of its own; the version is
        resolved server-side from the resource, so a client cannot name an older
        one it still remembers after a trashing or a takedown.
      required: [blockId, anchorKind]
      properties:
        blockId:
          type: string
          format: uuid
          description: >
            The block being annotated. One belonging to another document is
            `404`, indistinguishable from absent
        anchorKind:
          $ref: '#/components/schemas/AnchorKind'
        startOffset:
          type: [integer, 'null']
          minimum: 0
          description: >
            First character of the range, over the block's CANONICAL text -
            never over what is on screen. Required for `highlight` and refused
            for `block`, both directions checked
        endOffset:
          type: [integer, 'null']
          minimum: 1
          description: >
            One past the last character, over the same string. A range that
            selects nothing is refused - an empty selection is a stray click
        noteText:
          type: [string, 'null']
          maxLength: 4000
          description: >
            The learner's words. Optional on a highlight, since a bare mark is a
            real state; REQUIRED on a block anchor, where it is the only thing
            the row says.


            PLAIN TEXT, stored and returned exactly as typed. No markdown is
            parsed on either side - user-written content is untrusted in the same
            way as AI output, and the client escapes at render
    UpdateAnnotationRequest:
      type: object
      description: >
        Rewords one of the caller's own notes.


        THE ANCHOR IS NOT ON THIS REQUEST AND CANNOT BE. Moving a highlight is
        deleting one and making another; an edit that moved the range would leave
        the note describing a passage it no longer points at, with nothing to
        notice by.
      properties:
        noteText:
          type: [string, 'null']
          maxLength: 4000
          description: >
            The new words, or null to clear the note from a highlight. Clearing
            it on a `block` anchor is refused - that row would then say nothing
    AnnotationResponse:
      type: object
      description: >
        One of the caller's own annotations.


        NO OWNER FIELD, AND THE ABSENCE IS THE DESIGN. Every row this can carry
        belongs to the caller, so an owner field could only echo the JWT back -
        and including one would make this look like something that could carry
        somebody else's row, which is the shape a "list for the org" would be
        built on top of. No role unlocks that.
      required: [id, blockId, anchorKind, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        blockId:
          type: string
          format: uuid
        anchorKind:
          $ref: '#/components/schemas/AnchorKind'
        startOffset:
          type: [integer, 'null']
        endOffset:
          type: [integer, 'null']
        noteText:
          type: [string, 'null']
          description: Plain text, exactly as typed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Equal to `createdAt` until the note is reworded
    BatchRePresentRequest:
      type: object
      description: >
        Which blocks the reader wants already-cached rewrites for, and in which
        kind. Same vocabulary as `RePresentRequest` - the kind is
        still the only thing describing WHAT to do, and everything else is
        derived server-side.


        The block ids are a REQUEST, not a promise: each one comes back as a
        hit or a miss, and a miss is ordinary. Repeated ids are answered once.
      required: [kind, blockIds]
      properties:
        kind:
          $ref: '#/components/schemas/BlockTransformKind'
        blockIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
          description: >
            Blocks of the resource's CURRENT document, in the order the answers
            should come back.


            THE 100 IS A REFUSAL, NOT A TRUNCATION. A server that quietly
            answered the first hundred would let a client's own cap be deleted
            with nothing noticing, and this bound is half of what limits the
            route at all - see the operation description.
    TutorQuestionRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            The learner's question, as typed. Capped at 500 characters and
            refused rather than truncated - see the route's `400`.
          example: Why do C4 plants fix carbon twice?
        guide:
          type: boolean
          default: false
          description: >
            Run guided discovery instead of an ordinary answer. A different
            prompt, not a parameter to one: guided discovery asks one question that moves the
            learner a step closer and never gives the answer, and it carries no
            tone slot.
    TutorAnswer:
      type: object
      required: [mode, turnId, text, citations]
      description: >
        The payload of the stream's `result` event - one checked, cited turn.


        There is deliberately **no `cacheEntryId`**. A re-presentation carries
        one because it IS a shared cache entry that the feedback repair loop can
        replace; a tutor turn is per-learner and per-conversation and has no
        such row, so it carries the ✦ chip and its citations but no thumbs -
        a control that cannot act costs the learner the effort and teaches
        them nothing.
      properties:
        mode:
          type: string
          enum: [ANSWER, GUIDE]
          description: >
            Which prompt produced this. `GUIDE` is a Socratic question rather
            than an answer, and a client that could not tell them apart would
            render one as the other.
        turnId:
          type: string
          format: uuid
          description: The stored turn, so the panel can key its transcript
        text:
          type: string
          description: >
            The checked answer, with the model's inline `[source: ...]` markers
            already removed.
        citations:
          type: array
          description: >
            The blocks this answer was grounded in, in reading order, computed
            server-side from the retrieved passages.
          items:
            $ref: '#/components/schemas/RePresentationCitation'
    ReachedRequest:
      type: object
      required: [sectionBlockId]
      description: >
        "I am on this section now". The ONLY field, and deliberately: the
        ordinal is derived server-side from the document's own section order,
        so a client that could name its own position could claim to have
        finished a lecture it never opened. There is no learner id either -
        every route resolves the caller from the JWT.
      properties:
        sectionBlockId:
          type: string
          format: uuid
          description: >
            A `SECTION` block of the resource being read. An id that is not one
            is dropped, and the response is still `204`.
    ReadingProgress:
      type: object
      required: [furthestSectionId, furthestOrdinal, latestSectionId, sectionCount]
      description: >
        Where one learner got to in one version of one lecture. Absent entirely
        - `204` - when they have not started.
      properties:
        furthestSectionId:
          type: string
          format: uuid
          description: The deepest section reached. A high-water mark; it only ever rises.
        furthestOrdinal:
          type: integer
          minimum: 0
          description: >
            That section's index in the document's ordered section list.
            `content_blocks.position` cannot answer this - it is dense within a
            PARENT, so two sections under different parents are both 0 - which
            is why the ordinal is stored rather than derived by a client.
        latestSectionId:
          type: string
          format: uuid
          description: >
            Where the learner was last, which is what "resume" means and is NOT
            the same question as furthest. Someone who reads to the end and goes
            back to re-read the second section has a furthest of the end and a
            latest of the second section; collapsing the two would make one of the features lie.
        sectionCount:
          type: integer
          minimum: 0
          description: >
            How many sections the document has, so a client can render "3 of 12"
            and decide "finished" without a second read. Zero for a headingless
            document, which genuinely has no sections.
    SectionMastery:
      type: object
      required: [sectionBlockId, estimate, observationCount, stale]
      description: >
        How well one learner knows one section. Shown to the
        learner it is about - everything `A6` estimates is
        transparent, which makes this a product requirement rather than a
        convenience.
      properties:
        sectionBlockId:
          type: string
          format: uuid
        estimate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            The estimate DECAYED to now, not as stored - a forgetting
            curve is applied on read, so what the learner sees is what the
            recommender acted on.
        observationCount:
          type: integer
          minimum: 1
          description: >
            How many attempts have moved it. Present so the number can be read
            honestly: 0.5 from one attempt and from twenty mean very different
            things, and a snapshot showing only the figure would invite the
            learner to trust the first as much as the second.
        stale:
          type: boolean
          description: >
            Whether decay has carried the estimate meaningfully below what was
            last observed - "you knew this, it has been a while". A claim about
            the GAP, not the value: a low estimate that has not moved is weak
            rather than forgotten.
    Recommendation:
      type: object
      required: [kind, resourceId, reason, need]
      description: >
        One thing `A6` suggests doing next, and why. At most three are ever
        returned.
      properties:
        kind:
          type: string
          enum: [REVIEW_SECTION, READ_NEXT_SECTION, NEXT_LECTURE]
          description: >
            `REVIEW_SECTION` is ranked by need; `READ_NEXT_SECTION` is the one
            section directly after the furthest reached; `NEXT_LECTURE` is
            offered only when the caller supplied a course and the learner has
            finished this lecture.
        resourceId:
          type: string
          format: uuid
          description: The lecture to open - a DIFFERENT one for `NEXT_LECTURE`.
        sectionBlockId:
          type: [string, 'null']
          format: uuid
          description: >
            The section within it, or null for `NEXT_LECTURE`, which is a
            whole-lecture step.
        reason:
          type: string
          description: >
            A sentence the learner reads, in plain words.
            **Required, not decoration** - a learner is always told why something
            is recommended, so a recommendation without one fails even
            if the ranking is perfect. Built from the same numbers that produced
            the ranking, so it cannot drift from it. Never red and never a
            verdict: a faded estimate is a normal thing that happens to
            everyone.
        need:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            The score that ranked it - weakness x dueness. Zero
            for the steps that are offered because they are NEXT rather than
            because they are needed.
    ReviewItem:
      type: object
      required: [sectionBlockId, resourceId, resourceTitle, estimate, reason]
      description: >
        One section due for review, with the lecture it lives in. Idea-level -
        `A6`'s unit is the SECTION, not a flashcard.
      properties:
        sectionBlockId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
          description: The lecture it lives in, so the card can link somewhere.
        resourceTitle:
          type: string
          description: >
            Uploaded content. Render as a text node, never as markup.
        estimate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: The DECAYED estimate - what the ranking acted on.
        reason:
          type: string
          description: >
            Why this one is surfaced, in plain words. **Required, not
            decoration** - a learner is always told why something is recommended. Built from the same
            numbers that ranked it, so it cannot drift from the ordering. Never red and never a
            verdict.
    MasterySnapshot:
      type: object
      required: [tracked, strong, developing, needsWork]
      description: >
        What the learner knows, in four counts. Absent entirely -
        `204` - when nothing has been practised.
      properties:
        tracked:
          type: integer
          minimum: 1
          description: >
            How many sections carry an estimate at all. **Never the size of the library**: a section
            the learner has not practised is in none of these counts, because a zero would assert
            they know nothing about it.
        strong:
          type: integer
          minimum: 0
        developing:
          type: integer
          minimum: 0
          description: The ordinary state while learning.
        needsWork:
          type: integer
          minimum: 0
          description: >
            What "due for review" draws from. Rendered as "worth another look" - info-blue and grey,
            never red.
    TutorTranscript:
      type: object
      required: [turns]
      description: A learner's own thread about one resource, oldest first (private to the learner)
      properties:
        conversationId:
          type: [string, 'null']
          format: uuid
          description: The thread, or null when the learner has not opened one
        turns:
          type: array
          items:
            $ref: '#/components/schemas/TutorTranscriptEntry'
    TutorTranscriptEntry:
      type: object
      required: [id, mode, question, answer, citations, askedAt]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [ANSWER, GUIDE]
        question:
          type: string
          description: The learner's own words, as they typed them
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/RePresentationCitation'
        askedAt:
          type: string
          format: date-time
    RePresentation:
      type: object
      description: >
        One block, re-presented, labelled and cited.


        ATLAS asks four things of AI output - grounded in the exact
        source, faithfulness-checked, labelled, cited. The first two happened
        server-side and cannot be seen from here; the last two are this object.
      required: [kind, text, citations]
      properties:
        kind:
          allOf:
            - $ref: '#/components/schemas/TransformKind'
          description: >
            Echoed back, and the chip's label is derived from it. It travels with
            the text rather than being remembered by the client from its own
            request: a client that rendered "AI summary" over an expansion
            because responses arrived out of order would be mislabelling model
            output, which is the one thing the chip exists to prevent
        text:
          type: string
          description: >
            The rewrite. UNTRUSTED AND UNESCAPED - model output shaped by an
            uploaded document. Sanitise at render, exactly like the
            official copy it sits beside. Never render it as HTML.


            PLAIN PROSE, with no Markdown or other markup: the model is instructed to
            emit none, because the reader renders this as text and markers would
            reach the learner as literal characters. That is a statement
            about what the MODEL WAS ASKED FOR and not a guarantee about what
            arrived - a model can disobey, and an entry cached before the
            instruction existed cannot. It therefore weakens nothing above: this
            string is exactly as untrusted as it was, and a client that started
            rendering it as markup on the strength of this sentence would be
            building the injection surface the plain-prose rule exists to avoid
        citations:
          type: array
          minItems: 1
          maxItems: 1
          description: >
            EXACTLY ONE, naming the block that was rewritten: a re-presentation
            links back to the exact original blocks. The model rewrites one block, so its
            grounding is that block's own text - zero would be an uncited AI
            claim, more than one would assert a synthesis this pipeline never
            performs
          items:
            $ref: '#/components/schemas/RePresentationCitation'
        cacheEntryId:
          type: string
          format: uuid
          description: >
            The stored entry this was served from or written to. OMITTED when it
            was neither - the gateway did not identify the deployment that
            answered, or the cache write failed and the text was served anyway.
            A real state rather than an error: the learner still has their
            rewrite, but a feedback flag names a cache entry and there is
            none to name, so a client renders the chip without 👍/👎
    RePresentationCitation:
      type: object
      description: >
        The source a rewrite was written from.


        The ID ONLY, and no label. What to call a block - a heading, its first
        words, "this figure" - is a rendering decision, and the client already
        holds the document it would name it from. A label here would put block
        text on a second route with no reason to carry it, and would let the
        citation's wording drift from the document on screen.
      required: [blockId]
      properties:
        blockId:
          type: string
          format: uuid
          description: The block that was rewritten; resolve it to your own anchor
    EmailPreferenceKey:
      type: string
      enum: [org-activity, peer-review, study-reminder]
      description: >
        Which email preference an unsubscribe link turns off.


        `study-reminder` covers both reminder kinds — a goal reminder and a spaced-review
        prompt — rather than folding into `peer-review`, so that turning one off cannot
        silence the other.


        Turning a preference off stops the mail and leaves the underlying schedule in
        place: it is a mute for something the learner asked for, not a delete.


        These values appear in URLs that sit in inboxes indefinitely, so they are stable
        for the life of the API: a value is added here only alongside the mail it
        controls, and an existing one is never renamed.
    AllowanceState:
      type: string
      enum: [under, near, over, suspended, unknown]
      description: >
        Where an org - or the caller themselves - stands against an AI ceiling.


        FIVE VALUES, AND A BOOLEAN NEVER COULD HAVE CARRIED THIS.
        Three say where an org stands against its ceiling, one says the org has
        stopped paying, and the last says the question could not be answered -
        which is an outcome of its own rather than a variant of the others.


        `suspended` - AI extras are off because the organisation has stopped
        paying. NOT a reuse
        of `over`: over means today's allowance is spent and its copy
        promises "AI extras return tomorrow", and for a suspended org
        both halves are false. A member may be told AI is unavailable and that
        their Admin can restore it; they are never told a payment failed, a
        price or a date, because the payment relationship is the
        Admin's. Withholding the reason entirely is not the safe option either -
        that would be a dark pattern.


        A STATE, NEVER A QUANTITY. No value here carries a figure, a percentage,
        a remaining balance or a reset time - every quantity is
        Admin-only and the state is member-visible.


        `under` - room left. Render nothing.


        `near` - the allowance is close to spent. "Within its limits, near
        them, or has reached them" is member-visible, and the usage view's
        three states are within-limits, near-limit and over. The threshold is
        server-side and deliberately not on the wire: publishing it would let
        any member reconstruct the org's ceiling from the transition. A client
        that predates this value maps it down to `unknown` and renders nothing,
        which is the designed degradation rather than an accident.


        `over` - the allowance for the period is spent. This is the ONLY value
        that may render an "AI extras paused" note, and even then without any
        figure.


        `unknown` - THE QUESTION COULD NOT BE ANSWERED, OR THERE IS NO SUCH
        CEILING, and it MUST RENDER AS NOTHING AT ALL. Not "paused", not
        "unavailable", not an error. Showing the paused note here tells a learner
        AI is off when it may be perfectly fine, which is a claim the product
        cannot stand behind; showing an error fails a reader over a banner, and
        learning must never stop over a banner. Draw the reader normally and let the per-block
        control report its own outcome if the learner invokes one.


        A CALLER-SCOPED STATE MUST NEVER BE PUT IN A SHARED CACHE. Where this
        type answers for the caller rather than for the org, an entry keyed on
        the org alone would hand one member another member's state.
    AiAllowanceResponse:
      type: object
      description: >
        What a MEMBER may know about their org's AI allowance.


        TWO COARSE STATES, AND THE SHAPE IS THE PRIVACY CONTROL. The STATE is
        member-visible and every QUANTITY stays
        Admin-only, so this carries no spend figure, no remaining credit, no
        percentage, no ceiling, no reset time and nothing in money. If a quantity
        is ever genuinely needed it needs its own decision, its own
        role gate and its own review - not a field added here.


        `personalState` IS ABOUT THE CALLER, AND IT IS NOT A PER-MEMBER
        BREAKDOWN. Usage is capped per person as well as per org, and
        this is the coarse state of the caller's OWN ceiling - it discloses
        nothing about any other member and nothing about the org's finances. A
        per-member breakdown is a different question with a different rule and
        stays Admin-only.


        CALLER-SCOPED BY SHAPE. The endpoint takes no member id in any form, so
        there is nothing for a caller to substitute in order to ask about
        somebody else - own usage is a caller-scoped query, never a filtered
        view of the org's table, held structurally.
      required: [state, personalState]
      properties:
        state:
          $ref: '#/components/schemas/AllowanceState'
          description: >
            Where the ORG stands against the reader's daily ceiling.
        personalState:
          $ref: '#/components/schemas/AllowanceState'
          description: >
            Where the CALLER stands against their own daily ceiling. `unknown`
            wherever no per-member ceiling applies at all - a personal
            (single-member) org, whose one member is already bounded by the org's
            own ceiling. "Nothing to say" and "they are fine" are different
            answers.
    MoneyView:
      type: object
      description: >
        One price, in both currencies, with the rate that produced the second.


        The checkout and the invoice show BOTH figures -
        "$15.00 = Rs 4,650" - at a clearly displayed, dated rate, while revenue
        is recorded in USD either way. The five fields travel together so an
        amount can never reach a screen without the rate that produced it.


        MINOR UNITS, NEVER A FORMATTED STRING. A server that sent "Rs 4,650.00"
        would be choosing a locale for a reader whose own is not knowable here,
        and a client that had to parse it back to compare two prices would be
        parsing money out of prose. The client formats; the server states.
      required: [usdCents, chargedCurrency, chargedAmountMinor, fxRate, fxRateAsOf]
      properties:
        usdCents:
          type: integer
          format: int32
          description: What ATLAS books. Always USD - Pricing principle 9, "one currency".
          example: 1900
        chargedCurrency:
          type: string
          enum: [USD, LKR]
          description: >
            What the card is actually debited in. Both are fixed:
            Stripe charges the USD amount directly, PayHere charges the LKR
            equivalent.
        chargedAmountMinor:
          type: integer
          format: int64
          description: The debited figure in that currency's minor unit (cents, or LKR cents).
          example: 574750
        fxRate:
          type: string
          description: >
            USD to `chargedCurrency`, as a decimal STRING - "1" at par.


            A string rather than a number because JSON numbers are IEEE-754
            doubles in every browser and 302.35 is not representable in one. A
            rate that changed in the fourth decimal between the api and the
            screen would make a shown figure irreproducible, which is the one
            thing this rate has to be.
          example: '302.5'
        fxRateAsOf:
          type: string
          format: date
          description: >
            The day that rate was published - the "clearly displayed" half. Stored WITH the transaction rather than looked up
            at read time, so an invoice reprinted next year shows the rate that
            was charged and not today's.
    OpenCheckoutRequest:
      type: object
      description: What a checkout submits to start a purchase.
      required: [planCode, seats, gateway, currency, acceptTerms]
      properties:
        planCode:
          type: string
          maxLength: 32
          description: The catalogue row, by the stable business key `PlanCard.code`.
          example: team
        seats:
          type: integer
          format: int32
          minimum: 1
          description: How many members the org is buying for - the TARGET total.
        gateway:
          $ref: '#/components/schemas/PaymentGatewayId'
        currency:
          type: string
          description: >
            The buyer's choice of currency, which the chosen company must
            support - one of the codes that company published in
            `PlanCardResponse.gateways`.


            REQUIRED, WITH NO DEFAULT, for the same reason `gateway` is. Location
            may suggest and never force, and a nullable field
            with a server-side fallback makes the fallback the answer for
            everyone who did not notice the control. Never inferred from an IP
            or a locale: that would be wrong for exactly the people it aims to help - a Sri
            Lankan resident abroad, or a foreign card issued to a local address.


            The choice is also a legal one rather than a preference. CBSL makes
            it an offence for a Sri Lankan merchant to accept foreign currency
            from a Sri Lankan resident without Central Bank authorisation, so a
            resident's LKR option has to exist; and it is recorded on the
            subscription, because a recurring charge is fixed in the currency it
            was set up with.


            The enum is the canonical form, and the field is bounded to three
            characters. The api upper-cases what it is sent, so `lkr` is
            accepted - liberal about case, strict about everything else.
          enum: [LKR, USD]
          example: LKR
        acceptTerms:
          type: boolean
          description: >
            Explicit acceptance of the current terms and privacy notice, recorded
            in the same transaction as the checkout - the
            second place in ATLAS a policy version is accepted, after sign-up.


            Required to be `true` rather than defaulted: the acceptance is what
            gets recorded, and a row saying somebody agreed to terms they were
            never shown is worse than no row at all.
    CheckoutStartedResponse:
      type: object
      description: Where to send the browser next.
      required: [checkoutId, gateway, price, redirectUrl]
      properties:
        checkoutId:
          type: string
          format: uuid
          description: The checkout, so a screen can cancel it or report on it.
        gateway:
          $ref: '#/components/schemas/PaymentGatewayId'
        price:
          $ref: '#/components/schemas/MoneyView'
        redirectUrl:
          type: string
          format: uri
          description: >
            OPAQUE. Points at the API's own redirect leg, which absorbs the
            difference between a company reached by URL and one reached by a
            signed form POST - the web app's `form-action 'self'` would block
            the second from any page ATLAS serves, silently.


            Single-use and short-lived. The client performs a top-level
            navigation to it after checking the scheme is http(s), and does not
            fetch it.
    AddSeatsRequest:
      type: object
      description: >
        A seat purchase.


        A TARGET TOTAL RATHER THAN A DELTA, which is a safety property: "add
        one" applied twice by a double-click or a retry buys two seats, while
        "make it six" applied twice buys one.
      required: [seats]
      properties:
        seats:
          type: integer
          format: int32
          minimum: 1
    SwitchGatewayRequest:
      type: object
      description: A payment-company switch.
      required: [gateway]
      properties:
        gateway:
          $ref: '#/components/schemas/PaymentGatewayId'
    PaymentGatewayId:
      type: string
      enum: [STRIPE, PAYHERE]
      description: >
        Which payment company. Stripe for international cards
        charged in USD; PayHere for Sri Lankan payers charged the LKR
        equivalent.


        THE OWNER CHOOSES, AND NOTHING INFERS IT. Location may suggest and
        never force. ATLAS stores no country, locale or
        region, so there is nothing honest to suggest from - a client must not
        preselect one from an IP address, an `Accept-Language` header or a
        stored time zone, which is a locale by another name.
    SubscriptionState:
      type: string
      enum: [FREE, LIMITED, PAID, PAST_DUE, SUSPENDED, CANCELLING]
      description: >
        Where one org stands against its plan.


        `LIMITED` is the third state - what a newly created SHARED
        org starts in, explicitly not the Free plan a personal org gets.
        `PAST_DUE` is the failed-payment flow: the allowance degrades
        and the reader does not. `CANCELLING` still has
        everything it paid for and will simply not be charged again.
    PaymentMethodView:
      type: object
      description: >
        What ATLAS is allowed to know about a card.


        TWO FIELDS AND THERE IS NO THIRD. Card details never touch ATLAS:
        payment happens on the company's own pages and ATLAS shows only the brand
        and last four the company returns. A PAN is 13-19 digits and `last4` is
        constrained to four at the database, in the entity and at the port.


        `last4` is null for a PayHere customer, deliberately: PayHere's callback
        carries a masked card number and ATLAS refuses to read it rather than
        slice four digits off something PAN-shaped.
      required: [brand]
      properties:
        brand:
          type: [string, 'null']
          description: As the company reports it, e.g. `visa`.
        last4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
        managementUrl:
          type: [string, 'null']
          format: uri
          description: >
            The company's hosted portal, where the owner changes their card.
            Null when the company hosts none - render the brand without
            an "update card" link, which is better than one that 404s.
    SubscriptionResponse:
      type: object
      description: >
        The subscription. ADMIN ONLY in its entirety - every
        field here is commercial data, which is why the usage view has its own two
        routes rather than a role branch inside one.
      required: [planCode, planName, state, seatsUsed, seatLimit]
      properties:
        planCode:
          type: string
        planName:
          type: string
        state:
          $ref: '#/components/schemas/SubscriptionState'
        seatsUsed:
          type: integer
          format: int32
          description: >
            Members plus UNEXPIRED pending invitations - the seat
            arithmetic, and the same figure the members screen shows and the
            invitation path refuses against. The three must agree or a screen
            saying "3 of 5 seats used" appears beside a refusal to invite a
            fourth.
        seatLimit:
          type: integer
          format: int32
          description: >
            What has been paid for, already clamped to the plan's ceiling. A
            subscription may hold fewer seats than its plan allows and never
            more.
        seatPrice:
          oneOf:
            - $ref: '#/components/schemas/MoneyView'
            - type: 'null'
          description: >
            What ONE more seat costs for the rest of this period (the
            pro-rated figure). Null on a free plan, which has no renewal
            to prorate against.
        periodPrice:
          oneOf:
            - $ref: '#/components/schemas/MoneyView'
            - type: 'null'
          description: What the next renewal will cost, in both currencies.
        renewsAt:
          type: [string, 'null']
          format: date-time
          description: >
            When the company takes the next charge. NOT the end of the
            subscription: a closed subscription is a different thing entirely,
            and conflating the two would take a paying org out of its own active
            set.
        gateway:
          oneOf:
            - $ref: '#/components/schemas/PaymentGatewayId'
            - type: 'null'
          description: Which company holds the card, or null before the org has ever paid.
        pendingGateway:
          oneOf:
            - $ref: '#/components/schemas/PaymentGatewayId'
            - type: 'null'
          description: The company a switch has been arranged with.
        pendingSwitchAt:
          type: [string, 'null']
          format: date-time
          description: >
            When that switch fires - ALWAYS the period boundary, never sooner.
            The new company takes the next charge and the customer
            is never double-charged.
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethodView'
            - type: 'null'
        dunningDeadline:
          type: [string, 'null']
          format: date-time
          description: >
            The date AI extras stop if the card is not updated. ATLAS's own deadline rather than the payment
            company's retry schedule, which ATLAS is never told: a date shown to
            a customer is a commitment rather than a prediction.


            Null while the org is paying. Present while it is in GRACE, which is
            what lets a screen tell "act by this date" from "suspended" without a
            second field - and it stays present once suspended, so the screen can
            still say why AI stopped.


            UTC, like every instant here. A screen renders a DEADLINE in the
            reader's own zone and labels it, while an invoice date or a billing
            period stays UTC and says so.
    InvoiceView:
      type: object
      description: >
        One billing document, as the invoices list shows it.


        FROZEN AT ISSUE. Every figure here is the document's own snapshot, never
        recomputed from today's plan or today's exchange rate - which is what
        makes an invoice a document rather than a view, and why the rate on it
        can be called "the rate this payment was taken at" where a forward
        quote deliberately cannot.


        TWO FIGURES FOR A CONVERTED CHARGE, ONE FOR A USD ONE.
        `chargedAmountMinor`, `fxRate` and `fxRateAsOf` are present only where a
        conversion actually happened: there is nothing to disclose when the price
        and the charge are the same number, and a rate of 1.0 beside two
        identical figures invites a reader to believe otherwise.
      required: [id, number, issuedAt, planCode, seats, amountUsdCents, chargedCurrency]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: The customer-facing number, e.g. `ATLAS-2026-0007`. Per TENANT, so it
            discloses nothing about how many invoices ATLAS has issued in total.
        issuedAt:
          type: string
          format: date-time
          description: When ATLAS issued it. UTC; a screen labels it as such.
        planCode:
          type: string
        seats:
          type: integer
        periodStart:
          type: [string, 'null']
          format: date-time
        periodEnd:
          type: [string, 'null']
          format: date-time
        amountUsdCents:
          type: integer
        chargedCurrency:
          type: string
          enum: [USD, LKR]
        chargedAmountMinor:
          type: [integer, 'null']
          format: int64
          description: Present only for a CONVERTED charge - see the description above.
        fxRate:
          type: [string, 'null']
          description: >
            The rate this payment was actually taken at. A decimal STRING, for
            `MoneyView`'s reason: a JSON number is an IEEE-754 double and this is
            a figure an Admin reconciles a bank statement against.
        fxRateAsOf:
          type: [string, 'null']
          format: date
        correctsInvoiceId:
          type: [string, 'null']
          format: uuid
          description: >
            The document this one corrects, where it corrects one. A correction is
            a NEW document rather than an edit, so this is
            how the chain is followed - and both documents stay in the list,
            because the customer already holds the original.
    InvoiceListResponse:
      type: object
      description: The invoices, newest first.
      required: [invoices]
      properties:
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceView'
    DowngradeFit:
      type: object
      description: >
        How an org stands against a plan it is considering. `fits` is BOTH checks - excess members and excess content - and is
        what the wizard's confirm button hangs off.
      required:
        [targetPlanCode, membersUsed, membersAllowed, storageUsedBytes, storageAllowedBytes, fits]
      properties:
        targetPlanCode: { type: string }
        membersUsed: { type: integer }
        membersAllowed: { type: integer }
        storageUsedBytes: { type: integer, format: int64 }
        storageAllowedBytes: { type: integer, format: int64 }
        fits:
          type: boolean
          description: Whether BOTH checks pass. A downgrade is refused BEFORE the plan changes.
        effectiveAt:
          type: [string, 'null']
          format: date-time
          description: >
            When it would take effect - the period boundary, because the org keeps
            what it has already paid for.
    PlanCardResponse:
      type: object
      description: >
        The plan cards. CAPACITY ONLY - every plan has the
        whole feature set, so nothing here may name a feature family.
      required: [plans, currentCode, gateways]
      properties:
        plans:
          type: array
          description: >
            The offerable plans in display order. Excludes the free-equivalent
            LIMITED state, which is where a new shared org starts rather than
            something anyone may choose.
          items:
            $ref: '#/components/schemas/PlanCard'
        currentCode:
          type: [string, 'null']
          description: >
            The plan this org is on, or null where it has no plan row and runs on
            the deployment defaults. Null renders as NO card being marked, rather
            than as the first one being marked.
        gateways:
          type: array
          description: >
            The payment companies this DEPLOYMENT can take money through, each
            with the currencies it will charge, in display order.


            Published rather than hard-coded in the screen, because which
            companies exist became a deployment fact: ATLAS cannot be a Stripe
            merchant - Sri Lanka is not one of Stripe's supported countries - so
            Stripe's credentials are optional and an api holding none must not
            offer it. A radio button that always ends in "we could not reach
            that payment company" is worse than no radio button.


            THE ORDER IS NOT A RECOMMENDATION and nothing is preselected, on
            either axis. Location may suggest and never force.
          items:
            $ref: '#/components/schemas/GatewayOption'
        exchangeRate:
          oneOf:
            - $ref: '#/components/schemas/ExchangeRateView'
            - type: 'null'
          description: >
            NULLABLE, and the nullability is the degradation path. A rate that
            cannot be quoted must cost the checkout its rupee estimate and nothing
            else: the plans page is how an organisation sees its plans at all, and losing
            that because an exchange rate was unavailable would be a far worse
            failure than the one this field exists to fix. It is also absent for
            a web deployment that is briefly ahead of the api during a rollout.
    GatewayOption:
      type: object
      description: >
        One payment company a checkout may offer, and what it will charge in.
      required: [id, currencies]
      properties:
        id:
          $ref: '#/components/schemas/PaymentGatewayId'
        currencies:
          type: array
          description: >
            ISO 4217 codes this company will charge for ATLAS, in display order.
            A COMMERCIAL ARRANGEMENT rather than a capability - both companies
            can technically charge more than appears here; this is what ATLAS
            has arranged to accept, which is the question the screen is asking.


            PayHere carries LKR and USD, which is what makes one company enough
            for both audiences. LKR is present because CBSL makes it the only
            lawful option for a Sri Lankan resident paying a Sri Lankan
            merchant, not because it is preselected - nothing is.
          items:
            type: string
          example: ['LKR', 'USD']
    ExchangeRateView:
      type: object
      description: >
        The published USD-to-LKR rate, FOR DISPLAY ONLY.


        The checkout shows both figures at a clearly displayed exchange rate,
        and without this the rate would only enter
        the system when the api priced a checkout - which happens AFTER the
        customer has pressed the button. So a checkout would show a dollar figure and a
        promise that the rupee one would appear later, on the payment company's
        page. A customer deciding whether to buy could not see what they would
        be charged.


        NEVER THE BASIS OF A CHARGE. What is debited is priced once when the
        checkout row is written and copied from there onto the payment, so this
        can never become a second source of truth; the screen marks its own
        figure "approximately" for that reason.
      required: [usdToLkr, asOf]
      properties:
        usdToLkr:
          type: string
          description: >
            A decimal STRING, for MoneyView.fxRate's reason: a JSON number is an
            IEEE-754 double in every browser and a rate is money arithmetic.
          example: '302.500000'
        asOf:
          type: string
          format: date
          description: >
            When the rate was published - the "dated" half of "clearly
            displayed", and the field an operator forgets when they update the
            number beside it.
    PlanCard:
      type: object
      required:
        [code, name, monthlyPriceCents, currency, seatLimit, dailyTransformTokens, storageBytes]
      properties:
        code:
          type: string
          description: The stable business key, and what a checkout submits
        name:
          type: string
        monthlyPriceCents:
          type: integer
          description: Recurring per-seat price in USD cents; 0 for Free
        currency:
          type: string
          description: >
            Always `USD`. A PayHere customer sees an LKR equivalent at display
            time in the checkout; nothing is
            stored in another currency.
        seatLimit:
          type: integer
        dailyTransformTokens:
          type: integer
          format: int64
          description: The daily reader AI allowance, in tokens
        storageBytes:
          type: integer
          format: int64
    MemberUsageResponse:
      type: object
      description: >
        What a MEMBER sees of usage. No money figure, no other
        member's row, and no org ceiling - none filtered out, all absent from the
        type.


        The ceiling is withheld deliberately: a member sees
        their own usage and whether the org is within its limits, near
        them or has reached them - the STATE, not the figure. Per-plan allowances
        differ, so shipping the raw ceiling would name the plan tier as surely as
        the plan's own name, which is the Admin's.
      required: [state, personalState, myTokensToday]
      properties:
        state:
          $ref: '#/components/schemas/AllowanceState'
          description: Where the ORG stands against the reader's daily ceiling
        personalState:
          $ref: '#/components/schemas/AllowanceState'
          description: >
            Where the CALLER stands against their own ceiling; `unknown` where no
            per-member ceiling applies at all, as in a personal org.
        myTokensToday:
          type: integer
          format: int64
          description: >
            What this caller spent today, in tokens. Their own figure and nobody
            else's.
    OrgUsageResponse:
      type: object
      description: >
        What an ADMIN sees of usage. Every field
        here is commercial or privacy-barred data.
      required:
        [
          planName,
          state,
          tokensToday,
          allowanceTokens,
          costUsdToday,
          storageUsedBytes,
          storageCapBytes,
          seatsUsed,
          seatLimit,
          members,
        ]
      properties:
        planName:
          type: [string, 'null']
          description: Null where the org has no plan row
        state:
          $ref: '#/components/schemas/AllowanceState'
        tokensToday:
          type: integer
          format: int64
        allowanceTokens:
          type: integer
          format: int64
        costUsdToday:
          type: string
          description: >
            What today's spend cost ATLAS, where the gateway priced it. A FLOOR,
            never a bill - a cost is recorded only where the gateway priced it, and
            the re-presentation path records none, so this sums what was measured and omits the
            rest. Decimal string, not a float.
        storageUsedBytes:
          type: integer
          format: int64
          description: >
            Live stored bytes - retired versions excluded (retirement zeroes the
            object immediately), trashed ones included (or the cap would be
            evadable by delete, upload, restore).
        storageCapBytes:
          type: integer
          format: int64
        seatsUsed:
          type: integer
          description: Active members plus pending invitations
        seatLimit:
          type: integer
        members:
          type: array
          description: >
            One row per member who spent something today. Members who spent
            nothing are ABSENT rather than zero - a zero row is still a statement
            about a named person's day. No timestamps at any grain finer than the
            day: usage is recorded per day with no time of day, deliberately.
          items:
            $ref: '#/components/schemas/MemberUsageLine'
    MemberUsageLine:
      type: object
      required: [userId, name, tokens, requests]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: [string, 'null']
        tokens:
          type: integer
          format: int64
        requests:
          type: integer
          format: int64
    Problem:
      type: object
      description: >
        Problem details (RFC 9457, `application/problem+json`), the one shape every
        refusal in this API takes.


        **Branch on `errorCode`.** It is present on every refusal (the API description
        names the one malformed path the web server refuses first), it names one cause
        exactly, every value is documented in this contract - on the operations that
        can answer it, or in the API description for the few that any operation can -
        and a value is never removed or reused once published. A new value is a minor
        version of this contract. `type` is coarser: two causes can share one -
        `not-found` covers both a missing record and an organisation that is not a
        developer account - so a client branching on `type` would treat them alike.


        **`type` is an identifier, not a link.** It is a URI under
        `https://atlasframework.dev/problems/`, stable for as long as its code is, and
        fine to compare and to log. Do not dereference it: no page is published at
        those addresses yet.


        Validation refusals add an `errors` array naming each field; an unexpected
        `500` adds an `errorId`, which is what to quote when reporting it.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: >
            An identifier for the kind of problem - compare it, never fetch it. See
            the schema description.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errorCode:
          type: string
          description: >
            What to branch on: `ATLAS-<MODULE>-<NNN>`, one cause each, e.g.
            `ATLAS-AUTH-005`. Present on every refusal.
        errorId:
          type: string
          description: Present on unexpected 500s; correlates to the server log
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string

    DiscussionThreadSummary:
      type: object
      description: One row of the thread list.
      required: [id, title, authorId, replyCount, lastPostAt, unread, locked, solved]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
          description: Plain text. Nothing may render this as markup.
        authorId:
          type: string
          format: uuid
        authorName:
          type: [string, 'null']
          description: >
            The author's display name, or null when the account no longer exists - a post
            outlives its author's account, and a client renders a neutral placeholder rather than
            an error. The author's EMAIL is deliberately absent: this response reaches every
            member of the organisation, and a thread list needs an author, not an address.
        replyCount:
          type: integer
          description: Replies, excluding the opening post.
        lastPostAt:
          type: string
          format: date-time
          description: The thread's "last activity", and the list's sort key.
        unread:
          type: boolean
          description: >
            THE CALLER'S OWN answer, and the only per-person value in this response. It is derived
            from a table whose policy carries both the organisation and the caller, so two members
            looking at the same thread legitimately see different values here and neither can
            compute the other's.
        locked:
          type: boolean
        solved:
          type: boolean
          description: Whether a post has been marked as this thread's answer.
        courseId:
          type: [string, 'null']
          format: uuid
        resourceId:
          type: [string, 'null']
          format: uuid

    DiscussionPost:
      type: object
      description: One post in a thread.
      required: [id, authorId, body, createdAt, upvotes, upvotedByMe, solution]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        authorName:
          type: [string, 'null']
          description: See `DiscussionThreadSummary.authorName` - name only, never an address.
        body:
          type: string
          maxLength: 2000
          description: >
            PLAIN TEXT, stored and returned verbatim. The API escapes nothing on the way in - a
            post is untrusted input all the way to whoever renders it, exactly as block text and
            model output are - so a client MUST render it as text and never as markup. There is
            no rich text, no attachment and no mention in this contract, each refused on its own
            ground.
        createdAt:
          type: string
          format: date-time
          description: Half of the keyset cursor a resuming client sends back.
        upvotes:
          type: integer
          description: How many members have upvoted it - read org-wide.
        upvotedByMe:
          type: boolean
          description: Whether the CALLER has, so the pressed state can be rendered.
        solution:
          type: boolean
          description: Whether this post is the thread's marked answer.

    DiscussionFacilitatorPost:
      type: object
      description: >
        One post the AI facilitator wrote into a thread. Written from the lecture the thread is about after reading the
        thread's recent posts - bodies only, no names - and checked against the passages it cites.


        **There is no author and no requester field, and that is the contract.** The post is the
        facilitator's - stored in its own table, never as a member's post - and the member whose
        press produced it is recorded for the row-level policy and the AI ledger only; nothing on
        any route says who asked. There is no `upvotes` and no `solution` either: the reaction and
        solved-post keys reference member posts, so neither can be applied to this one.


        **And no `cacheEntryId`**, for the tutor turn's reason: a re-presentation carries one
        because it IS a shared cache entry the feedback repair loop can replace; a facilitator post has
        no such row, so it carries the ✦ chip and its citations but no thumbs.
      required: [id, threadId, body, citations, createdAt]
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        body:
          type: string
          maxLength: 4000
          description: >
            Plain text. Model output, checked against the cited passages, with the inline
            `[source: ...]` markers already removed. Never render it as markup.
        citations:
          type: array
          minItems: 1
          description: >
            The lecture passages the post was grounded in, in reading order, computed server-side
            from what retrieval returned - never parsed out of the reply. At least one, always: an
            uncited draft is discarded rather than posted.
          items:
            $ref: '#/components/schemas/RePresentationCitation'
        createdAt:
          type: string
          format: date-time

    DiscussionThread:
      type: object
      description: One thread, with the facilitator's posts beside the members'.
      required: [id, title, authorId, createdAt, locked, posts, facilitatorPosts]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        authorId:
          type: string
          format: uuid
        authorName:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        locked:
          type: boolean
          description: >
            When true the API refuses a reply with 409. Clients hide the composer rather than
            disabling it, and show the reason - a disabled box invites a member to type a reply
            the server will refuse.
        solvedPostId:
          type: [string, 'null']
          format: uuid
          description: >
            The post marked as the answer, or null. ONE nullable column rather than a thread-level
            boolean plus a per-post flag, so the two can never disagree.
        courseId:
          type: [string, 'null']
          format: uuid
        resourceId:
          type: [string, 'null']
          format: uuid
          description: >
            The lecture this thread is about, or null. Set when the thread was opened with one; it is what the facilitator grounds on, and a thread without it never offers
            the facilitator.
        posts:
          type: array
          items:
            $ref: '#/components/schemas/DiscussionPost'
        facilitatorPosts:
          type: array
          description: >
            The AI facilitator's posts in this thread, oldest first, in a separate list because
            they are a different shape (no author, no upvote, no solution flag). Empty when it has
            not spoken. Clients interleave the two lists by `createdAt`. Omitted - rendered as
            empty - while the lecture the thread is about is taken down or trashed, since a post
            grounded on it must not outlive the right to read it; the members' posts still render.
          items:
            $ref: '#/components/schemas/DiscussionFacilitatorPost'
        cursor:
          type: [string, 'null']
          description: >
            The resume position for the live link, or null when the thread has no posts.
            `<ISO-8601 instant>|<uuid>`. The maximum over member posts AND facilitator
            posts, so a catch-up re-sends neither.

    DiscussionPostPage:
      type: object
      description: The catch-up read behind every live poke.
      required: [posts, facilitatorPosts]
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/DiscussionPost'
        facilitatorPosts:
          type: array
          description: >
            The facilitator's posts after the cursor. EITHER list may be the only one with
            something in it - a client that returns early on an empty `posts` drops a facilitator
            post and leaves its cursor behind, so the next poke re-fetches and re-drops it.
          items:
            $ref: '#/components/schemas/DiscussionFacilitatorPost'
        cursor:
          type: [string, 'null']
          description: >
            The new resume point. Echoed back unchanged when both lists are empty, so a polling
            client's position does not drift.

    DiscussionLivePoke:
      type: object
      description: >
        One frame on the live link. IDENTIFIERS ONLY - no member-authored text and no
        model output ever crosses this channel, which is what keeps every rendered byte behind a
        row-level policy and keeps member writing out of the message broker.


        Three kinds: `POST` (a member replied - `postId` is the post), `POLL` (a poll
        opened, was voted in or closed - `pollId` is the poll, and `threadId` is null for a poll
        raised outside any thread) and `FACILITATOR` (the AI facilitator posted - `postId` is
        the facilitator post's id, which lives in its own table). A frame published by a replica
        older than polls carries no `kind` and is a `POST`.
      required: [orgId, at]
      properties:
        orgId:
          type: string
          format: uuid
        threadId:
          type: [string, 'null']
          format: uuid
          description: Null only for a poll that belongs to no thread.
        postId:
          type: [string, 'null']
          format: uuid
          description: Set on `POST` and `FACILITATOR` frames.
        pollId:
          type: [string, 'null']
          format: uuid
          description: Set on `POLL` frames.
        kind:
          type: [string, 'null']
          enum: [POST, POLL, FACILITATOR, null]
          description: >
            NULL, not absent, when a replica older than polls published the frame - this api
            re-serialises the whole record onto the stream, so every field it does not set crosses
            as an explicit null rather than being omitted. Read a null `kind` as `POST`.
        at:
          type: string
          format: date-time

    NewDiscussionThread:
      type: object
      description: >
        Opening a thread. There is no author field and there never may be one - the author is the
        token's subject, and the row-level policy refuses any other.
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 2000
        courseId:
          type: [string, 'null']
          format: uuid
          description: >
            Accepted and ignored until a course picker exists - no screen can supply one, and the
            api stores null. Declared now so that the field's arrival is not a contract change.
        resourceId:
          type: [string, 'null']
          format: uuid
          description: >
            The lecture this thread is about. HONOURED: resolved through the reader's own
            takedown gate before the thread is written, so a lecture the org does not hold is 404
            (`ATLAS-SYS-005`, the same answer as an absent one), one with no readable version 409
            (`ATLAS-CNT-019`), and one taken down 451 (`ATLAS-CNT-016`) - and the thread is not
            opened. Optional; a thread with none never offers the facilitator.

    NewDiscussionPost:
      type: object
      description: >
        A reply. One field, and the absences are the ruling: no rich text, no attachments and
        no mentions.
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000

    Poll:
      type: object
      description: >
        A poll in all three of its states. The state is derived rather than sent as a name,
        because "open / voted / closed" is `closedAt` crossed with whether the caller holds a
        ballot, and the two are not mutually exclusive: a member who voted in a poll that has since
        closed is in both.


        **The tally is a count and never a list of who voted.** A ballot is private - no row-level
        policy anywhere admits another member's vote - so these counts come from a column
        maintained beside the ballots rather than from an aggregate over them. Nothing
        here identifies an individual voter, and nothing may be added that would.
      required: [id, creatorId, question, options, totalVotes, votedByMe, closable, createdAt]
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: [string, 'null']
          format: uuid
          description: >
            The thread this poll was raised in, or NULL for a standalone poll. Null and not
            absent: the api sends a nullable field explicitly. A client testing for the key's presence would find it every time.
        creatorId:
          type: string
          format: uuid
          description: The only member who may close it
        creatorName:
          type: [string, 'null']
          description: >
            Their display name, or null when the account no longer exists. The creator's EMAIL is
            deliberately not here: this response reaches every member of the organisation, and a
            poll needs a creator rather than an address.
        question:
          type: string
          maxLength: 300
          description: >
            PLAIN TEXT, stored and returned verbatim. There is no sanitiser in the platform and no
            renderer here, so a client MUST render it as text and never as markup.
        options:
          type: array
          items:
            $ref: '#/components/schemas/PollOption'
          description: The answers in the creator's own order, which is never re-sorted
        totalVotes:
          type: integer
          description: The sum of the tallies, so a client renders shares without adding up
        votedByMe:
          type: boolean
        closedAt:
          type: [string, 'null']
          format: date-time
          description: >
            When it closed, or NULL while it is open - null rather than absent, for the reason
            given on `threadId`. A closed poll never reopens.
        closable:
          type: boolean
          description: >
            Whether the CALLER may close it - true only for the creator of an open poll. Cosmetic:
            it exists so a client can omit a control nobody may use rather than render one that
            fails, and the api refuses regardless.
        createdAt:
          type: string
          format: date-time

    PollOption:
      type: object
      description: One answer and its share of the vote.
      required: [id, label, votes, chosenByMe]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 120
          description: PLAIN TEXT, like the question - never rendered as markup.
        votes:
          type: integer
          description: How many members chose it. A count, never a list.
        chosenByMe:
          type: boolean
          description: Whether the CALLER chose it, so a client can render the selected state

    NewPoll:
      type: object
      description: >
        Opening a poll. There is no creator field and there never may be one - the creator is the
        access token's subject, and it is the column that decides who may close the poll.


        Two options at least, because a poll with one answer is not a question, and eight at most,
        because they render as full-width controls and a longer list stops being readable
        before it stops being possible.
      required: [question, options]
      properties:
        threadId:
          type: [string, 'null']
          format: uuid
          description: >
            The thread to raise it in. Omit it, or send null, for a standalone poll. The thread
            must be in the caller's organisation and must not be locked.
        question:
          type: string
          minLength: 1
          maxLength: 300
        options:
          type: array
          minItems: 2
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 120

    PollBallot:
      type: object
      description: >
        A vote. One field, and the absences are the ruling: there is no voter field (the voter is
        the token's subject) and no "change my vote" - a ballot is cast once.
      required: [optionId]
      properties:
        optionId:
          type: string
          format: uuid
          description: The answer chosen, which must belong to the poll in the path
