    post:
      operationId: rePresentBlockStreamed
      summary: Re-present one block, delivered over an event stream
      description: >
        The same operation as `POST .../re-presentation`, delivered as
        `text/event-stream`. Same checks, same order, same answers - only the transport
        differs. The non-streaming route remains and is what a client that
        cannot consume SSE should call.


        IT IS NOT FASTER, AND A CLIENT MUST NOT PRESENT IT AS SUCH. Nothing is
        sent until the faithfulness check has passed on the whole rewrite
        (all AI output is checked before it is shown), so time-to-first-word is identical to the
        non-streaming route's. What this adds is a live connection, an honest
        "working" signal while a generation runs, and a delivery shape that
        carries several blocks on one connection.


        NOTHING UNCHECKED IS EVER WRITTEN TO THE STREAM. There is no partial
        text, no draft and no preview - a draft is never sent provisionally and
        then withdrawn. Text that fails the check is discarded server-side and
        the stream says `nothing`, exactly as the other route answers 204.


        POST, FOR THE OTHER ROUTE'S REASONS - it can cause a paid gateway call,
        so it must not be replayable, and the kind must stay out of a URL that
        reaches an access log. `EventSource` cannot issue a POST;
        consume this with `fetch` and a streaming body reader.


        REFUSALS ARRIVE TWO DIFFERENT WAYS, AND THE `errorCode` IS WHAT TO
        COMPARE. Anything decided before the stream opens is an ordinary
        problem+json response with its real status (429 `ATLAS-SYS-004`, 409,
        404, 451). A spent allowance - the org's `ATLAS-BIL-001` or the caller's
        own `ATLAS-BIL-002` - is decided AFTER `200` is committed, because that
        check sits below the cache lookup so an over-ceiling org is still
        served what it already paid for. Both therefore arrive as an `error`
        EVENT carrying the identical problem document, `errorCode` included, and
        the caller's own takes precedence when both are spent. Never branch on
        the transport.


        EVENTS. `working` (once, immediately, on every path - it says only that
        the request was accepted and never why it may end); `result` (the
        `RePresentation`, terminal); `nothing` (show the plain block, terminal,
        with a `blockId`); `error` (a `Problem`, terminal); `done` (the stream
        ended deliberately, so a client can tell completion from a dropped
        connection). Comment lines (`: ping`) are keep-alives. IGNORE EVENT
        NAMES YOU DO NOT KNOW - more may be added, and every terminal event
        carries the `blockId` it answers so a client keys results by block.


        THERE IS NO "CHECKING" EVENT, DELIBERATELY. It would separate "a draft
        was generated and rejected" from "there was never going to be one",
        which is the distinction the 204 on the other route exists to prevent a
        client from making.
