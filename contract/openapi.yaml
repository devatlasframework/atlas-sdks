                $ref: '#/components/schemas/Problem'
        '451':
          description: The file has been taken down (`ATLAS-CNT-016`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/content/re-presentations/stream:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The resource being read
    post:
      operationId: rePresentBlocksFromCache
      summary: Read cached re-presentations for many blocks at once
      description: >
        What the reader's own loop calls as a learner scrolls. Many blocks, one connection, one
        indexed read.


        IT NEVER GENERATES ANYTHING, AND THAT IS THE POINT OF ITS EXISTING
        SEPARATELY. Every block is a cache HIT or a MISS; nothing here reaches
        a model, spends an allowance or writes a cache row. The cache is keyed
        by a profile signature, so a cohort of thirty opening one lecture
        shares almost nothing between them - a route that generated on scroll
        would multiply cold-cache spend by the size of the class against a
        per-org daily ceiling. Use `POST .../blocks/{blockId}/re-presentation`
        (or its `/stream` form) when a learner has actually asked for one
        block.


        `nothing` IS THE ORDINARY ANSWER, NOT AN ERROR. Show the plain block.
        On a cold document EVERY block answers `nothing`, and that is a healthy
        response to a correct request - a client must not read it as a failure,
        retry it, or tell the learner anything is wrong or is being prepared.
        Nothing is being prepared: this route only ever reports what already
        existed.


        NO `ATLAS-BIL-001` OR `ATLAS-BIL-002` EVER ARRIVES HERE. Both exist on the single-block
        routes because a generation can exhaust an org's allowance after `200`
        is committed. A cache hit costs no allowance, and this route can
        only hit or miss, so a spent allowance is not something it can
        establish. A client must not infer allowance state from anything here -
        read `GET /o/{orgId}/ai-allowance`, which exists so that inference is
        never necessary.


        AN `error` EVENT IS RARE HERE BUT IT IS REAL, AND A CLIENT MUST HANDLE
        IT. Everything this route decides before the stream opens is an ordinary
        problem+json response with its real status. Once `200` is committed the
        status is spent, so a failure below that line - an unexpected server
        error during the read - arrives as an `error` event carrying the problem
        document instead. It is NOT an allowance and NOT a refusal; it means the
        batch did not complete. **A client that ignores it renders a genuine 500
        as an ordinary cold cache**, which is the one distinction this route's
        whole design exists to keep: "the platform has nothing for these blocks"
        and "we failed to look" are different answers and must not be collapsed.


        EVENTS. `working` (once, immediately, on every path); `result` (a
        `RePresentation`, terminal for that block); `nothing` (terminal for
        that block, carrying its `blockId`); `error` (a `Problem`, terminal for
        the whole batch); `done` (the batch ended deliberately). Exactly one
        terminal event per requested block, in request order, with repeated ids
        answered once. Every per-block terminal event names the block it
        answers, so a client keys results by block and never by arrival
        position. Comment lines (`: ping`) are keep-alives. IGNORE EVENT NAMES
        YOU DO NOT KNOW.


        AT MOST 100 BLOCK IDS, AND THE CAP IS WHAT MAKES THE REQUEST LIMIT MEAN
        ANYTHING. A per-request throttle bounds requests, not work; without a
        bound on blocks-per-request the same throttle permits an unbounded read
        per caller, and the two limits together are what bound the route. A
        client scrolling quickly through a document of many small blocks can
        gather more than 100 - send the first 100 and queue the rest rather
        than letting the request be refused, because a 400 arriving on a
        background path renders nothing and degrades silently for entirely the
        wrong reason.
      tags: [personalisation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRePresentRequest'
      responses:
        '200':
          description: The event stream; see the operation description.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: >
            The kind is missing or is not one of the six, or `blockIds` is
            empty or longer than 100 (`ATLAS-VAL-001`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource in this org (`ATLAS-SYS-005`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The feature family behind this kind is not switched on for the
            caller (`ATLAS-PER-002`) - the same three checks in the same order
            as the single-block routes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            TOO MANY REQUESTS (`ATLAS-SYS-004`) - transient, and nothing was
            spent. `Retry-After` says how long to wait.


            ONE CODE, TWO DIFFERENT BUDGETS. This may be the caller's own
            throttle or their ORGANISATION'S, and the two are deliberately
            indistinguishable to a client: the remedy is identical (wait), and
            the truth is identical (nothing was spent). An org refusal reaches
            a learner who did nothing unusual, so any message a client shows
            MUST STAY SUBJECT-NEUTRAL. "Too many attempts. Wait before trying
            again." never says "you"; "You're clicking too quickly" is a
            specific, believable and WRONG claim for every learner refused
            because a colleague was busy.


            A spent allowance never arrives as a 429 anywhere - see
            `GET /o/{orgId}/ai-allowance`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: The file has been taken down (`ATLAS-CNT-016`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/tutor/turns/stream:
