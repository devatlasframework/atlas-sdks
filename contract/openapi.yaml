  /personalisation:
    get:
      operationId: getPersonalisation
      summary: What ATLAS personalises for the caller, and why
      description: >
        The feature-matching engine's output for the caller: the preferences their answers
        endorsed, all 21 feature families in their personal recommendation
        order, which of them were auto-enabled at setup, the look-and-feel
        defaults taken from the profile, and the profile signature.


        Private to the learner, inherited whole from the learner profile
        it derives from: no `/o/{orgId}` segment, account taken from the JWT,
        never visible to an org, never in an org report or export.


        Derived on every read and stored nowhere, so the promise that a
        retake "re-resolves immediately" holds by construction - there is no
        cached resolution to invalidate.


        ALL 21 FAMILIES ARE ALWAYS RETURNED, the unrecommended ones with a zero
        `score`, no `reasons` and the last rank. Rule 4 offers and never
        withholds: a family with no match is "not prioritised (still
        available)". A response carrying only the matches
        would make "not recommended" and "not available" the same shape here.


        `autoEnabled` IS NARROWER THAN `score > 0`, in two ways a client must
        not paper over. A family the learner only leans towards ranks but is not
        switched on. And two families - `F8` and `A8` - are never auto-enabled
        at any score, because competitive and extrinsic features are always
        opt-in; they are recommended
        with a full "why" and left off.


        `delivery` says whether anything consumes a family yet. Eighteen are
        `LIVE` at the time of writing - `F1`, `F2`, `F3`, `F4`, `F5`, `F6`, `F7`, `F10`,
        `F11`, `F12`, `F13`, `A1`, `A2`, `A3`, `A4`, `A5`, `A6` and `A8` - and
        the other three are `PLANNED`. This list goes stale on every promotion
        and the response is the arbiter: read `delivery` rather than this list.
        A panel must not render an on/off
        toggle for a `PLANNED` family as though flipping it did something.


        A family being `LIVE` says only that SOMETHING consumes it, never that
        everything in its catalogue row shipped: `F1` ships without image
        hotspots or interactive timelines, and `F2`'s audio is spoken live by
        the browser rather than saved as a file. The api's `FeatureFamily`
        constants carry each boundary, because no schema can.


        `A1` BECAME `LIVE` WITH THE ROUTE THAT RENDERS IT, not before - see
        `POST .../content/blocks/{blockId}/re-presentation`. A family marked
        delivered with nothing consuming it is the state `ATLAS-PER-001` exists
        to make unreachable, so the promotion and its first consumer ship
        together.


        THREE STATES PER FAMILY, and a panel needs all three (F8): `autoEnabled`
        is what the engine decided, `override` is what the learner asked for
        (omitted when they never have), and `enabled` is what they actually get.
        Bind a toggle to `enabled`; use the other two to explain it. Write
        through `PATCH /personalisation/features`.


        `appearanceDefaults` are DEFAULTS, not saved settings. `/appearance/preferences`
        remains the record of what the person actually chose, where `null` means
        "never chose". This route writes nothing.


        RESOLVE THEM BELOW EVERY COPY OF AN EXPLICIT CHOICE, INCLUDING THE CLIENT'S OWN
        (F7). "Explicit choice, then these, then the client default" is the obvious
        reading and it is wrong wherever a client stores a real choice locally: the web
        app's theme menu writes only a cookie, so a learner who picked high contrast
        there has expressed it in exactly one place, and a suggestion ranked above it
        would overwrite an accessibility signal with a value nobody chose. Apply these
        only where NEITHER the account nor the client has anything to say.


        AND DO NOT PERSIST WHAT YOU APPLY. A suggestion written into the client's own
        store stops being a suggestion: it then outranks the profile that produced it,
        survives a retake, and survives the learner switching `F12` off. Keep "never
        chose" expressible until the learner chooses.


        A caller who has completed nothing gets a 200 with no endorsements,
        nothing auto-enabled and a `signature` of `null`: a learner with no
        profile gets nothing auto-enabled and simply sees the plain content.
      tags: [personalisation]
      responses:
        '200':
          description: The caller's recommendations, empty if nothing is completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalisationProfile'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /personalisation/features:
    patch:
      operationId: updateFeatureSettings
      summary: Turn features on or off for yourself
      description: >
        The learner's own on/off choices, which OVERRIDE the engine's
        auto-enabled recommendations.


        A PARTIAL CHANGE. A family the body does not name is left exactly as it
        was - a settings panel shows all 21 controls and the learner moves them
        one at a time, so a full replacement would make every write depend on
        the client's copy of the other 20 still being current.


        A NULL VALUE CLEARS that family's override, returning it to whatever the
        engine recommends. That is also "reset to recommended",
        so there is no separate reset route; clearing a family that was never set
        is a no-op. The whole operation is idempotent.


        ANSWERS WITH THE WHOLE RESOLUTION, not just the stored settings, so the
        panel needs no second call: switching a family off changes what the
        learner receives without changing what the engine recommends, and the
        screen renders both.


        Private to the learner, like the GET it mirrors: no `/o/{orgId}`
        segment, account taken from the JWT, never visible to an org. These
        choices are derived from the profile that recommended them, so which
        features someone switched off summarises a profile no role unlocks.


        A `PLANNED` FAMILY IS REFUSED (`ATLAS-PER-001`), not stored. Nothing
        consumes 20 of the 21 families at this phase, so a stored choice for one
        would record a preference that cannot mean anything - and a toggle that
        appears to have stuck and has not is precisely the defect `delivery`
        exists to let a panel avoid. A panel must not offer the control at all;
        this refusal is what keeps the two from drifting apart. The family
        becomes adjustable when the phase that builds it flips `delivery`.
      tags: [personalisation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureSettingsRequest'
      responses:
        '200':
          description: The caller's recommendations with these choices applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalisationProfile'
        '400':
          description: >
            A family nothing consumes yet (`ATLAS-PER-001`, with a `families`
            array naming which), or a body that names no family, more families
            than exist, or a code this build does not know (`ATLAS-VAL-001`).
            Nothing is saved in either case - a change naming one undeliverable
            family is refused whole rather than partially applied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
