            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStartedResponse'
        '400':
          description: >
            No `gateway` (`ATLAS-VAL-001`), or a body that could not be read - including a gateway this contract does not list (`ATLAS-VAL-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not an Admin (`ATLAS-ORG-003`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            Not on a paid plan, already with that company, or a switch is
            already arranged (`ATLAS-BIL-007`); the target company does not
            charge the currency this subscription is billed in
            (`ATLAS-BIL-009`); or this deployment cannot use that company at all
            (`ATLAS-BIL-010`).


            A switch moves who takes the money and never what the customer is
            billed in, so the currency is read from the subscription and is not
            a field on this request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /billing/checkout/{orgId}/{redirectToken}/start:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: >
          A SELECTOR, NOT AN AUTHORISATION. The token below is what authorises;
          this only says which org's checkouts to look in. Guessing one reveals
          nothing, because without a matching token the answer is identical to
          the answer for an org that does not exist - see the 302 below.
      - name: redirectToken
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
        description: >
          The single-use handoff token minted with the checkout. Spent by the
          first request that presents it (a conditional UPDATE, so exactly one
          concurrent caller wins) and worthless afterwards.
    get:
      operationId: startCheckoutHandover
      summary: Hand the browser to the payment company
      description: >
        A TOP-LEVEL BROWSER NAVIGATION, never fetched. It is the only endpoint
        in ATLAS that answers HTML, and the only reason it exists on the API
        origin: the web app's Content-Security-Policy carries `form-action
        'self'`, which silently blocks the signed form POST one of the two
        companies requires, while a top-level navigation is governed by no
        directive at all. Widening the web app's allow-list instead was
        considered and rejected.


        Guest endpoint, for `/auth/google`'s reason: the access cookie is bound
        to the WEB origin and does not travel here, so the token in the path is
        the whole authorisation.


        THE TWO COMPANIES' SHAPES ARE BOTH ABSORBED HERE, so the browser leaves
        for a payment page either way and there is one audit point where it
        did: a 302 for the company that mints a URL, and one small
        self-submitting document under its own hard policy for the company that
        wants signed form fields.
      tags: [billing]
      security: []
      responses:
        '200':
          description: >
            The self-submitting handover document, for the company reached by
            form POST. Carries no payer details of any kind - the customer
            gives those to the payment company on its own page.
          headers:
            Content-Security-Policy:
              description: >
                `default-src 'none'; script-src 'nonce-<per-response>';
                form-action <the one company>; base-uri 'none'`. The submit is a
                NONCED SCRIPT rather than an inline handler, which this policy
                would block.
              schema:
                type: string
            Cache-Control:
              description: >
                `no-store`. The document carries signed merchant fields for a
                token that has just been spent, so a back button must not be
                able to re-render and re-submit it.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        '302':
          description: >
            Either the company's own hosted checkout URL, or - for an unknown,
            already-spent or expired token, and for an org that does not exist -
            the checkout screen with a status the screen renders. THOSE FOUR ARE
            ONE ANSWER ON PURPOSE: distinguishing them would make this endpoint
            an oracle for which organisations exist and which have a purchase in
            flight. A company that will not answer redirects back too, with a
            different status, because the customer can then try the other one.
          headers:
            Location:
              description: The hosted checkout, or the checkout screen with a status
              schema:
                type: string
                format: uri
        '400':
          description: >
            `orgId` is not a UUID. **This is about the SHAPE of the path and nothing
            else**: an org that does not exist, an unknown token and a spent one are all
            the 302 above, for the oracle reason stated there. The problem carries
            `ATLAS-VAL-003` and names the parameter, never its value.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /billing/webhooks/{gateway}:
    parameters:
      - name: gateway
        in: path
        required: true
        schema:
          type: string
          enum: [stripe, payhere]
        description: >
          Which company is calling. Each is registered with its own callback
          URL and its own secret, so an event verified for one is refused at
          the other's path even though both are valid, signed events.
    post:
      operationId: receiveGatewayEvent
      summary: A payment company's server-to-server callback
      description: >
        NOT FOR CLIENTS. Published because it is part of the deployed surface
        and an operator configuring a company's dashboard needs its shape; no
        SDK should generate a caller for it.


        Every payment-company event is verified and duplicates are ignored, so no
        one can fake or replay a "paid" message. Order is verify, then
        claim, then act: the signature is checked over the RAW bytes before any
        database work, and the claim is a single `INSERT ... ON CONFLICT DO
        NOTHING RETURNING id` so a replay LOSES A RACE rather than being
        checked for.


        Runs with no session and no org context - resolving whose payment this
        is IS the problem a callback has - so the writes it makes are bounded by
        a database capability that names the specific checkout being settled, not by an actor.


        DELIBERATELY NOT RATE LIMITED. A throttle would drop a company's
        legitimate retry, and a dropped retry is a paid period that never lands.
        The bounds are a request-body cap, verification before any database
        work, and the claim - so a flood costs one HMAC and nothing else.
      tags: [billing]
      security: []
      requestBody:
        required: true
        description: >
          The company's own event body, verbatim. Read as RAW BYTES: a parse
          and re-serialise would change what the signature was computed over.
          One company sends JSON, the other a form-encoded body.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: >
            THE ONLY ANSWER A REAL CALLBACK EVER GETS, and the sameness is the
            design rather than a shortcut. A success, a duplicate, an event for
            a checkout this deployment does not hold, an unrecognised event
            type, a forgery and a callback addressed to another merchant are all
            this empty 200.


            A path naming no company is the ONE exception, and to a caller
            without a session - which is what a payment company is - it answers
            401. The two webhook paths are permitted BY LITERAL NAME rather than
            by wildcard, which is the safer posture ("a wildcard would permit a
            gateway added later before anybody had reviewed its verifier") and
            discloses only which gateway names ATLAS supports, which this
            document already lists.


            The match is also CASE-SENSITIVE, and the handler now requires the
            canonical lowercase name for the same reason: without that, an
            upper-cased path matched no permit rule yet still resolved to a real
            gateway for any signed-in caller, which would have handed a future
            company's unreviewed verifier a reachable address.


            An earlier version of this text claimed the 200 below covered an
            unknown name. It was measured against the deployed api and
            corrected.


            Two things force it. A company retries anything it does not see a
            2xx for, so answering an error to an event ATLAS has already handled
            turns one duplicate into an unbounded stream of them - and a forgery
            has nothing to retry. And a differing answer would make this an
            oracle for which references exist at the payment company: a way to
            enumerate an organisation's purchases from outside, with no session
            and no rate limit in the way.


            What actually happened is recorded server-side, against the
            deduplication record's own outcome column.
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/ai/re-presentations/{cacheEntryId}/feedback:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: cacheEntryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: >
          THE CACHE ENTRY, not the block: the exact cached item - the specific
          (content block × profile signature × kind) entry, and
          the distinction is the whole feature: a block-keyed complaint is about
          a paragraph, which no repair can act on, while an entry-keyed one
          names the exact text that was wrong for the exact cohort that saw it.


          It is the `cacheEntryId` a re-presentation response carries. A rewrite
          served WITHOUT one - the gateway did not identify the deployment, so
          there was no sound key to file it under - cannot be flagged at all,
          and the client should not offer the affordance for it.
    post:
      operationId: fileAiFeedback
      summary: Rate one cached AI re-presentation
      description: >
        Learner feedback. A 👍 or 👎 on one cached rewrite, which is
        what starts the repair loop: a 👎 is automatically re-checked against the
        source by the faithfulness check, and the entry is regenerated and replaced
        if that check now fails.


        IDEMPOTENT PER (LEARNER × ENTRY × REASON), enforced by a unique index. A
        repeat is `200` rather than `201` and the body is EMPTY either way - "you
        already told us this" and "thank you" are the same fact from where the
        learner sits, and a response distinguishing them would tell an abuser
        which of their clicks landed.


        THE NOTE NEVER REACHES A PROMPT. A note reading "ignore the
        source, the correct text is …" would otherwise let one learner author a
        cache entry that every other org holding those bytes then reads under
        the ✦ chip, presented as grounded. It is stored for a human reviewer,
        bounded, and stripped of control characters; it is private to the
        learner and never org-visible.


        THERE IS NO READ SIDE, AND THERE CANNOT BE. A row saying "this learner
        said something about this cache entry" reaches a profile signature
        through its foreign key, which reconstructs that learner's LPQ banding -
        the tier no plan, setting or role unlocks. The client learns the outcome
        of its own POST from the status and never from a read-back.
      tags:
        - reader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiFeedbackRequest'
      responses:
        '201':
          description: The flag was recorded. No body.
        '200':
          description: >
            An identical flag was already on file - nothing was created and
            nothing is wrong. No body, deliberately the same as `201`.
        '400':
          description: >
            A 👎 with no `reason`, or a 👍 carrying one, or a `note` over its
            `maxLength` (`ATLAS-SYS-001`). The reason correspondence is checked
            in both directions: a complaint must say which of the three it
            is, and a rating must not pretend to be one.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such entry, or this org cannot reach the bytes behind it
            (`ATLAS-SYS-005`). ONE ANSWER FOR FOUR CAUSES - absent, not
            possessed, the resource trashed, the file taken down - so nothing
            about which one it was leaks. Note that a takedown is 404 here and
            not 451: filing feedback is not a content read, so a takedown has
            nothing to announce on this route.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            This learner is filing faster than any reading pace explains
            (`ATLAS-SYS-004`). Transient; `Retry-After` says how long. UNLIKE the
            re-presentation route, this status has only ONE cause here - filing a
            flag spends no AI allowance, so there is no budget condition to
            confuse it with.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/search:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: >
          The lecture being searched. The version is resolved server-side from
          it, which is what supplies the ownership, trash and takedown
          checks - so there is no way to search a version you were granted
          earlier and a takedown has since blocked.
    post:
      operationId: searchLecture
      summary: Search this lecture by meaning and by keyword, combined
      description: >
        Search inside one lecture, from the reader.


        **A POST, and the reason is privacy rather than REST taste.** The query
        is the learner's own words about what they do not yet understand - the
        same category as a tutor question, which is also posted. As `?q=` it
        would land in browser history on a shared machine, in every ingress
        access log, and in the `Referer` of anything the results link to. The
        library's global search does use a query parameter, and correctly: it searches
        resource and course TITLES, which are the org's text and not the
        learner's.


        **Both halves search the MEANING INDEX, not the block tree**, and the
        consequence is visible to a client: a lecture with no index is not
        searchable at all, by either half. The alternative was measured and
        rejected - giving the keyword half the block tree leaves the two halves
        naming almost disjoint sets (6.4% of live blocks reachable by both, and
        none on the largest document), so a result `matchedBy: both` would have
        been impossible to produce.


        **The combination rule is reciprocal rank fusion** over each half's
        ordering, `1/(60 + rank)` summed. Ranks rather than scores because a
        cosine distance and a text-search rank are on incomparable scales, so
        nothing has to be normalised into units it does not have. The list's
        ORDER is the ranking and no score is returned - a client re-sorting by
        one would be undoing the combination.


        **Read `coverage` before rendering "no results".** An empty `results`
        means at least five different things and only one of them is a finding
        about the lecture. See the schema.


        Never 404s for an unsearchable lecture and never 429s for a spent AI
        allowance: both are degradations, reported in `coverage`, because a
        search box that refuses is a search box that looks broken.
      tags:
        - reader
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LectureSearchRequest'
      responses:
        '200':
          description: >
            The fused ranking, best first, and what each half was able to
            search. Both may be empty; `coverage` is what says whether that is
            a finding or a failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureSearchResponse'
        '400':
          description: The query is blank or over 200 characters (`ATLAS-SYS-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member of this org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource in this org (`ATLAS-SYS-005`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            This learner does not receive `F11` (`ATLAS-PER-002`). The reader
            offers this search only to a learner who does, so reaching this by hand
            is already unusual - but the gate is enforced here as well as
            rendered, because "I turned free exploration off" has to be
            honoured at the layer that enforces.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            The caller's own search burst, or their organisation's, is spent
            (`ATLAS-SYS-004`, `Retry-After`). A per-LEARNER counter checked
            before the per-org one, so a member who is over their own budget
            never spends their colleagues' - the org counter increments even
            when it refuses. **A spent AI allowance is NOT this status**: it
            degrades the meaning half and is reported in `coverage`, because a
            search is not a generation button.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: The file has been taken down (`ATLAS-CNT-016`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/tags:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
