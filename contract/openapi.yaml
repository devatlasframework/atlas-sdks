                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not an Admin/Moderator of this org (`ATLAS-ORG-003`), or not a member /
            no such org (`ATLAS-ORG-002`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such resource in this org, or no such version of this resource
            (`ATLAS-SYS-005`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The version is the resource's current one, or is still in flight -
            AWAITING_UPLOAD, SCANNING, READING, or BUILDING (`ATLAS-CNT-011`); the
            detail says which.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
