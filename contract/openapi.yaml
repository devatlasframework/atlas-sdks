      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RePresentRequest'
      responses:
        '200':
          description: >
            The event stream. Every terminal outcome - including a spent
            allowance - is an event within it; see the operation description.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: The kind is missing or is not one of the six (`ATLAS-VAL-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource in this org (`ATLAS-SYS-005`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The feature family behind this kind is not switched on for the
            caller (`ATLAS-PER-002`) - as on the non-streaming route.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            TOO MANY REQUESTS (`ATLAS-SYS-004`) - transient, and nothing was
            spent. `Retry-After` says how long to wait.


            THIS MAY BE THE ORGANISATION'S BUDGET RATHER THAN THE
            CALLER'S. The per-org request limit applies to this route too, so a
            429 here no longer implies the caller did anything unusual, and any
            message shown must stay subject-neutral for the reason the batch
            route's 429 gives in full.


            NO SPENT ALLOWANCE ARRIVES HERE. Neither the org's `ATLAS-BIL-001`
            nor the caller's own `ATLAS-BIL-002`: both are decided
            after the stream opens and come back as an `error` event. A client
            that treated "429 on this route" as "out of credit" would be telling
            a learner who clicked twice that their organisation is out of AI
            credit - the failure the split exists to prevent, in the one place
            the two no longer share a transport.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
