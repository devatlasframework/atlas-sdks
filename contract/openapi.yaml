  /o/{orgId}/dev/apps/{appId}/keys:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The application the keys belong to
    get:
      operationId: listApiKeys
      summary: An application's API keys
      description: >
        The application's keys, newest first. Readable by ADMIN,
        MODERATOR and USER.


        **No response here ever contains a key's secret.** The plaintext exists
        exactly once, in the response to creating or rotating a key, and is
        never stored or returned again - only a SHA-256 hash is kept. What this
        returns is the prefix and the last four characters, which are kept for
        display so two keys can be told apart.


        `nextCursor` is always null: an application holds a bounded number of
        keys, so one response is always the whole list.
      tags: [developer]
      responses:
        '200':
          description: The application's keys, newest first - never with a secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such application, or not a developer account (`ATLAS-SYS-005` /
            `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createApiKey
      summary: Create an API key
      description: >
        Mints a key for this application and returns its secret.
        Requires ADMIN or MODERATOR.


        **The secret is returned exactly once, here, and can never be retrieved
        again.** Store it before leaving the response; if it is lost, rotate the
        key. Keys look like `atl_sk_live_...` and are sent as
        `Authorization: Bearer atl_sk_live_...`. Treat one as a server-side
        secret: ATLAS answers no cross-origin request, so a key that a browser
        can send has already been exposed.


        `expiresAt` is optional. When given it must be in the future and within
        the maximum key lifetime.
      tags: [developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: The key was created - the only response that carries its secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '400':
          description: >
            Validation failed, or the expiry is in the past or beyond the
            maximum key lifetime (`ATLAS-DEV-005`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A USER (minting is ADMIN/MODERATOR, `ATLAS-ORG-003`), or not a
            member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such application, or not a developer account (`ATLAS-SYS-005` /
            `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The application is archived (`ATLAS-DEV-003`), or it already holds
            the maximum number of keys (`ATLAS-DEV-006`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/dev/apps/{appId}/keys/{keyId}/rotate:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The application the key belongs to
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The key being rotated
    post:
      operationId: rotateApiKey
      summary: Rotate an API key
      description: >
        Mints a successor and starts an overlap window on the old key. Requires ADMIN or MODERATOR.


        **Both keys work until the window closes**, which is what makes a
        rotation deployable: put the new secret into production while the old
        one is still serving traffic, then let it lapse. The successor inherits
        the old key's expiry, because a rotation replaces a secret and not a
        lifetime.


        If you are rotating because a key leaked, revoke the old one as well -
        that takes effect on the very next call and does not wait for the
        overlap.


        The successor's secret is returned once, here.
      tags: [developer]
      responses:
        '201':
          description: The successor was created - the only response that carries its secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A USER (rotating is ADMIN/MODERATOR, `ATLAS-ORG-003`), or not a
            member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such key on this application, or not a developer account
            (`ATLAS-SYS-005` / `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The key has already been rotated or revoked (`ATLAS-DEV-004`), the
            application is archived (`ATLAS-DEV-003`), or it already holds the
            maximum number of keys (`ATLAS-DEV-006`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/dev/apps/{appId}/keys/{keyId}/revoke:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The application the key belongs to
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The key being revoked
    post:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: >
        Switches a key off. Requires ADMIN or MODERATOR.


        **It takes effect on the very next call.** Key checks are not cached, so
        there is no window in which a revoked key still works. A rotated key can
        be revoked too, which closes its overlap window immediately - that is
        what to do when a key has leaked.


        Revocation is one-way: a revoked key cannot be restored. Create a new
        one instead.
      tags: [developer]
      responses:
        '200':
          description: The revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeySummaryResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A USER (revoking is ADMIN/MODERATOR, `ATLAS-ORG-003`), or not a
            member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such key on this application, or not a developer account
            (`ATLAS-SYS-005` / `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The key is already revoked (`ATLAS-DEV-004`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
