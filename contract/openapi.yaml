        '400':
          description: The response is blank or longer than the stored bound
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member of this organisation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            Absent, or belonging to a document this organisation does not hold -
            deliberately indistinguishable, so there is no existence oracle
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            This learner has answered this question as many times as the server
            can record (ATLAS-PRA-001). A structural bound on the counter, NOT a
            retry policy - generating a fresh batch gives new questions to try
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
