        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: >
          The resource the scenario was reached through. The readable version is
          resolved from it and the ownership check lives in that resolution - a
          resource that does not hold the scenario's own document is refused
      - name: scenarioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: >
          The scenario, from `ScenarioRun.scenarioId`. Possession of the bytes is
          what bounds it, so another org's id and an id that does not exist are
          indistinguishable
      - name: stepIndex
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
        description: >
          The step's ZERO-BASED position, which must be the one the learner is on
          (`ScenarioRun.progress.stepIndex`). Anything else is `409` - the
          browser's copy of the progress is stale
    post:
      operationId: submitScenarioStep
      summary: Settle one step of a branching scenario
      description: >
        Submits one step: choose an option or write a step; the step is recorded,
        progress is saved, and the next step comes back with instant feedback.


        TWO MARKING ROUTES, ONE MECHANISM. A `choose` step is
        settled by comparing the submitted POSITION against the option the model
        flagged correct - an identity comparison, NO gateway call, no rubric,
        nothing to check, because an option choice has a known key and needs no
        model at all. A `write` step goes to A5's free-text marking pipeline
        behind a second entry point with the same implementation.


        A POSITION, NEVER A TEXT. `optionIndex` is the chosen option's index in
        the step's own array. That is what makes the mark an identity comparison
        rather than a string comparison, and it is why a correct paraphrase
        cannot be marked wrong here the way a short answer can.


        THE RE-CHOOSE LOOP IS BOUNDED. A wrong choice returns the learner to the
        same step with that option's consequence and `settled: false`. After the
        bound the step settles anyway, `revealedOption` names the stated correct
        option and the scenario moves on - a learner can never be held at one
        decision.


        A WRITE STEP ALWAYS ADVANCES, even when A5 could not mark it. The answer
        is kept, `mark` is absent, and the scenario moves on: a step that refuses
        to advance during a provider outage strands the learner mid-scenario,
        and learning must never stop because an AI step did.


        A WRONG CHOICE IS INFO-BLUE, NEVER RED. Nothing in this response is an
        error state; `consequence` says what happens next.
      tags: [personalisation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioStepSubmission'
      responses:
        '200':
          description: What happened at that step, and where the learner is now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioStepResult'
        '204':
          description: >
            The scenario cannot be read - it is gone, purged under a
            takedown, or belongs to bytes this org does not hold, deliberately
            indistinguishably
        '400':
          description: The submission is malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member of this organisation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            Absent, another org's, or trashed - deliberately indistinguishable, so
            there is no existence oracle
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            Either the F4 family is not switched on for this learner
            (ATLAS-PER-002), or the step sent is not the one they are on
            (ATLAS-PRA-002) - reopen the scenario to resync. Branch on
            `errorCode`, never on the status alone
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            Asking too fast (ATLAS-SYS-004, transient, nothing spent), or an
            allowance is spent (ATLAS-BIL-001 / ATLAS-BIL-002, clears tomorrow).
            Branch on the `errorCode`, never on the status alone
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: These bytes have been taken down (`ATLAS-CNT-016`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/content/blocks/{blockId}/quiz:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The resource being read
      - name: blockId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: >
          A SECTION block of that resource's CURRENT document. Questions are
          written from the section's DESCENDANTS - never the section row's own
          text, which is its heading. A block that is not a SECTION is `204`
    post:
      operationId: quizSection
      summary: Write a quiz from one section
      description: >
        A4's generation route. The same throttle, ownership and takedown checks, budget
        ordering and faithfulness check as every other reader generation - and
        the same 204 discipline.


        ONE CALL PRODUCES A BATCH, AND EVERY ITEM IS CHECKED SEPARATELY. The
        model returns `n` questions in one reply; the server then puts each item's
        stem, its STATED answer key and its hint through the faithfulness check
        individually. An item the
        checker refuses is discarded and the batch is topped up by regenerating,
        bounded by the server's attempt count. A batch that cannot reach `n`
        within that bound is DELIVERED SHORT rather than padded - `questions` is
        the real count and a client must read it rather than assuming `count`.


        THE DISTRACTORS ARE NOT CHECKED, and that is a decision rather than a
        gap. The faithfulness check measures whether a draft is SUPPORTED by the
        source; a distractor's requirement is that it be INCORRECT. Those are
        different predicates, so the distractor rule is a constraint on the
        generation itself.


        NO ANSWER KEY IS RETURNED. `QuizQuestion` has no such field at all: MCQ
        and short answers are marked deterministically by the server, which is
        meaningless if the key was in the browser. The key arrives from
        `POST .../practice/questions/{questionId}/attempts`, after the learner
        has answered.


        THE CITATION IS THE BATCH'S, NOT THE QUESTION'S. Nothing maps
        an output span back to an input block and the model is never shown a block id to
        echo, so the server cites the blocks the whole batch was assembled from
        and every question carries the same list. A chip claiming "this question
        came from this block" would over-state what the mechanism supports.


        GATED ON A4, NOT F5. They are separate families: three of F5's nine
        profile rows grant practice without A4, and two grant A4 without F5. Only
        this route is gated; answering and reviewing are gated on neither.
      tags: [practice]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizRequest'
      responses:
        '200':
          description: The labelled, cited batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quiz'
        '204':
          description: >
            No quiz - show the plain content. Covers a learner with no profile, a
            block that is not a section, a section with too little or too much
            text, a spent allowance, a provider outage, a reply that would not
            parse and a batch whose every question failed its faithfulness check,
            deliberately indistinguishably
        '400':
          description: >
            The requested count, difficulty mix or type mix is outside its bounds
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not a member of this organisation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            Absent, another org's, or trashed - deliberately indistinguishable, so
            there is no existence oracle
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The A4 family is not switched on for this learner (ATLAS-PER-002) - a
            refusal, never a quiet substitution
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            Asking too fast (ATLAS-SYS-004, transient, nothing spent), or an
            allowance is spent (ATLAS-BIL-001 / ATLAS-BIL-002, clears tomorrow).
            Branch on the `errorCode`, never on the status alone
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: These bytes have been taken down (`ATLAS-CNT-016`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/practice/attempts/{attemptId}/mark:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: >
          The resource the question was reached through. The readable VERSION is
          resolved from it and the ownership check lives inside that resolution -
          a version a caller can name is a version they can pick
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The stored answer to mark (`AttemptResult.attemptId`)
    post:
      operationId: markPracticeAttempt
      summary: Mark one open answer
      description: >
        Marks a free-text answer against a rubric. Up to FOUR model calls on a
        rubric miss - building the rubric, its own faithfulness check, marking,
        and a check over the feedback - and two on a hit, because the rubric is
        built once per question and reused across learners. That reuse is what
        makes two learners' answers to the same question comparable.


        A SECOND REQUEST, AFTER THE ANSWER IS STORED. The submit route is
        transactional and must stay that way; four gateway calls inside that
        transaction would hold a database connection across the whole exchange and
        let a wedged provider park the pool for every tenant.


        POST ALTHOUGH IT MOSTLY READS: it can spend the organisation's allowance, so
        it is neither safe nor cacheable in the sense a GET promises.


        A SECOND CALL IS FREE. The mark is keyed by the attempt, so an already-marked
        attempt is served from storage and an already-recorded failure answers 204
        without spending anything. A learner's way out of an unmarked answer is to
        answer again, which is a new attempt.


        NO REQUEST BODY: everything the mark needs is already stored, and a body
        would be a second copy of the answer - the copy that reaches the model must
        be the one the learner actually submitted.
      tags: [practice]
      responses:
        '200':
          description: The mark - score, per-point breakdown, feedback and source links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkView'
        '204':
          description: >
            No mark to show, and the causes are deliberately indistinguishable: the
            organisation's allowance is spent, the per-person ceiling is reached, the
            provider failed, the faithfulness check refused the rubric or the
            feedback, the reply would not parse, or its arithmetic could not be
            reconciled with the stored rubric. All of them mean "ATLAS could not mark
            this one", which a client renders with NO score and a retry; telling them apart
            would leak an organisation's billing state to any member.


            NOT a failed evidence span: a met point whose quotation is absent from the
            answer drops that point and the score is recomputed, so the mark still
            arrives as a 200.
        '401':
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member of this organisation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            The attempt is absent, belongs to another learner, or answers a question
            that is not open-ended - deliberately indistinguishable, so the route is
            neither an existence oracle nor a way to ask what type a question is
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            A5 is not this learner's family (ATLAS-PER-002). A client knows its own
            resolved families and should not call; this is the half that does not
            depend on the client being right
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            The learner's burst or daily budget, or their organisation's, is spent.
            Carries `Retry-After`. Shares A1's and A4's counters deliberately: the
            burst limit bounds the PERSON, not the feature
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/practice/questions/{questionId}/attempts:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: questionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The generated question being answered
    post:
      operationId: submitPracticeAttempt
      summary: Answer one question
      description: >
        Records an answer and marks it. NO GATEWAY
        CALL is made: MCQ and short answers are compared server-side, ignoring
        case and collapsing whitespace, and nothing else is normalised - stripping
        punctuation would mark "it's" and "its" alike, and stemming would put the
        server in the business of deciding what a learner meant.


        AN OPEN ANSWER COMES BACK UNMARKED - `correct` is `null`. Grading free
        text is A5's, on its own route; guessing would be worse than saying nothing,
        because a wrong "incorrect" on a good answer is what this zone's tone
        rules exist to prevent. A client renders the unmarked slot, never a
        default verdict.


        THIS IS THE FIRST RESPONSE THAT CARRIES THE ANSWER KEY, which is the whole
        of the server-marking design: the batch route sends no key, so nothing was
        in the browser to compare against before this call.


        RETRY IS ALWAYS AVAILABLE. `attemptIndex` counts this learner's tries
        ACROSS every organisation they hold the content in, because the same
        platform-wide question can be met through two orgs' resources.
