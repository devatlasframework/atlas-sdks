  /o/{orgId}/resources/{resourceId}/versions/{versionId}/complete:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The resource's id
      - name: versionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The version being finalized (from create or upload-new-version)
    post:
      operationId: completeResourceUpload
      summary: Confirm, virus-scan, and fingerprint a version's upload
      description: >
        Confirms the file was uploaded and runs it through the processing state
        machine: verifies
        the object is present, enforces the size limit, moves the version to
        SCANNING, then virus-scans the stored bytes - computing their SHA-256
        fingerprint in the same streamed pass - before settling on READING, or
        FAILED with a `failureReason`. Nothing is processed unscanned.


        **A clean scan ends at READING, not READY.** READY means everything the
        pipeline can do is done, which is only true once the document reader has
        produced the version's block tree. So a clean scan hands the version to
        ingestion and returns READING; BUILDING, READY and the supersede of the
        previous version arrive asynchronously, and a client that wants the settled
        outcome polls the resource (READING and BUILDING are progress states to
        show, not to hide).


        **The version therefore does NOT become current here.** The resource keeps
        pointing at its previous current version for the whole of READING/BUILDING,
        so a re-upload never blanks the lecture while it processes, and a version
        that fails extraction was never current at all.


        Idempotent, and terminal states stay terminal: completing a version that is
        no longer AWAITING_UPLOAD returns its current state and changes nothing, so
        a rejected upload cannot be re-finalized with substituted bytes.
        Admin/Moderator only.
      tags: [content]
      responses:
        '200':
          description: >
            The resource as now displayed, reflecting the completed version. On a
            clean scan: READING, with the version's size, and the resource still
            showing its PREVIOUS current version if it had one. On a
            repeat call it is whatever the version already settled on or has since
            reached (READING, BUILDING, READY, FAILED, or SCANNING while another
            call is scanning it) — this endpoint only ever acts on an
            AWAITING_UPLOAD version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not an Admin/Moderator of this org (`ATLAS-ORG-003`), or not a member /
            no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such resource in this org, or no such version of this resource
            (`ATLAS-SYS-005`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            No uploaded object was found for the version, or only part of it could
            be read back (`ATLAS-CNT-001`); or the stored object changed between the
            size check and the scan (`ATLAS-CNT-006`) — a presigned upload URL
            outlives the check, so re-uploading mid-finalize is refused rather than
            sealed. Both leave the version AWAITING_UPLOAD and are retryable.


            The stored file is not the one this upload was created for - a different object sits
            at its address (`ATLAS-CNT-009`); upload it again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The uploaded object exceeds the size limit (`ATLAS-CNT-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >
            The upload was rejected by the virus scan and discarded; the version is
            permanently FAILED. Either a malware signature matched (`ATLAS-CNT-003`,
            `failureReason: INFECTED`) or the content defeated the scanner's archive
            limits so it could not be fully inspected (`ATLAS-CNT-004`,
            `failureReason: ARCHIVE_LIMITS` - a zip bomb, for example). The matched signature
            is never returned.


            Note which failure is NOT here: `EXTRACT_FAILED`. Extraction runs
            after this call returns, so a document the reader cannot parse fails
            asynchronously — the resource reaches FAILED with that reason on a later
            read, never as a response to this endpoint.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: >
            The file's fingerprint is on the takedown blocklist: a super admin upheld a
            copyright or abuse report against these exact bytes, so ATLAS declines to
            host them (`ATLAS-CNT-016`, `failureReason: BLOCKED`). The version is
            permanently FAILED and the bytes are discarded.


            Checked only AFTER the scan, because the fingerprint is computed from the
            stored bytes and never taken from the client. Nothing about the response
            distinguishes "someone else uploaded this and it was taken down" from
            "you uploaded this before and it was taken down" — the decision is about
            the file, and a takedown refusal is always stated rather than hidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            The workspace has used its document-processing allowance for the day
            (`ATLAS-BIL-001`). Capacity that refills, not a payment problem and
            not a missing feature — every plan has the whole feature set, and plans
            differ only in capacity. The upload is untouched: the version returns to
            AWAITING_UPLOAD and finalizing again tomorrow re-scans and re-queues it
            without a re-upload.


            Refused rather than processed without its AI passes, and the reason is
            privacy. A degraded ingestion would produce a document with no image
            descriptions, while an upload of bytes ATLAS already holds would arrive
            WITH them — it adopts a copy processed when there was budget — so the
            difference would be visible in the reader and would tell the uploader
            their file pre-existed. A refusal is identical on both branches; a
            degradation cannot be. For the same reason the body never states the
            ceiling, what remains of it, or anything about the file.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >
            A dependency was unavailable, not a verdict on the file. Either the virus
            scanner is unreachable (`ATLAS-CNT-005`) or the bytes scanned clean but
            the job broker could not be reached, so they could not be handed to the
            document reader (`ATLAS-CNT-015`). Both are faults in ATLAS: the
            object is kept and the version is returned to AWAITING_UPLOAD, so calling
            this endpoint again once the dependency is back succeeds without
            re-uploading. Retry with backoff.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
