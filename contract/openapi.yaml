              schema:
                $ref: '#/components/schemas/DowngradeFit'
        '400':
          description: >
            No `planCode`, or one over its bound (`ATLAS-VAL-001`), or a body that could not be read (`ATLAS-VAL-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not an Admin (`ATLAS-ORG-003`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
