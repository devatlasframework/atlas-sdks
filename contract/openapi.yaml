  /o/{orgId}/discussions/threads/{threadId}/facilitator:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The thread the facilitator is asked to post in
    post:
      operationId: askFacilitatorStreamed
      summary: Ask the AI facilitator to post in a thread, delivered over an event stream
      description: >
        A2's group half. Reads
        the thread's title and its most recent posts - bodies only, numbered, no names - retrieves
        passages from the meaning index of the lecture the thread is about, writes ONE facilitator
        post from those passages only, checks it against them, stores it in the thread as the
        facilitator's own (never as a member's), and announces it on the live link. On a thread
        with no replies yet it SEEDS - one or two open questions the lecture can answer; otherwise
        it MODERATES - what the group has established, where the lecture says otherwise, one
        question that moves the discussion on.


        **No request body.** Everything the model reads is a post already stored in the thread or
        a passage of the lecture; nothing a caller sends reaches the prompt.


        **The event vocabulary is the tutor's**: `working` once on every path, then exactly one
        of `result` / `nothing` / `error`, then `done`; the only non-event frame is a `: ping`
        comment keep-alive. `result` carries the whole checked `DiscussionFacilitatorPost` -
        nothing is sent word by word, and nothing reaches the thread before the faithfulness check
        passes. `nothing` carries a `reason`: `not-indexed` when the lecture has no
        meaning index, else `unavailable` - a provider outage, a spent allowance, a refused or
        uncited draft, no resolved learner profile - folded deliberately so that no cause leaks.


        **Who may ask, and who pays.** The caller must receive `A2` - on its own, not paired with
        `F6`: six matrix rows grant A2 without F6 - and hold a resolved learner profile. The
        member who pressed is charged, against their own daily allowance, for the same reason
        their tutor turns are: the per-person cap is what keeps one member's presses from
        spending the organisation's day. Nothing on any route says who asked.


        **What reaches the model, and its bounds.** The thread title and the last N posts (bodies
        only, clipped, prior facilitator posts marked as such) inside one delimiter fence; the
        retrieved passages inside another. The thread is CONTEXT and never a SOURCE: citations are
        computed server-side from the passages sent, and the faithfulness check sees the passages
        only. No member's name, no profile, no tone slot - the facilitator's tone is fixed, because
        a per-learner tone on an org-visible post would leak a private signal.


        **One at a time.** A second press with nothing new in the thread since the facilitator
        last spoke is refused (`ATLAS-FRM-008`). Beyond that a thread accepts one run per fixed
        window (429, one per minute as configured), and the caller's own generation throttle and
        the organisation's shared retrieval throttle each answer 429 in their own right. The
        per-thread window is counted only for a press that can pay for it, so a member over their
        daily allowance cannot hold a thread's slot against everyone else.
      tags:
        - discussions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >
            The event stream. Every terminal outcome after the stream opens - including a spent
            allowance, an absent learner profile and a draft that failed its check - is an event
            within it; see the operation description.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Missing or unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not a member of this org (`ATLAS-ORG-002` — non-membership; `ATLAS-ORG-003` is the
            distinct "member, wrong role" refusal, which this route cannot raise).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such thread in this organisation, or the lecture the thread is about no longer
            exists in it. Absent and belonging to another organisation are the same answer - no
            existence oracle. Both carry `ATLAS-SYS-005`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            Five conflicts, each with its own code because each has its own remedy. The thread is
            locked (`ATLAS-FRM-001`). Nothing has been posted since the facilitator last spoke
            (`ATLAS-FRM-008`) - post something new first. The thread is not about a lecture
            (`ATLAS-FRM-009`) - there is nothing for the facilitator to read, and clients never
            offer the control on such a thread. The caller does not receive `A2`
            (`ATLAS-PER-002`), refused before the stream opens. The lecture has no readable
            version (`ATLAS-CNT-019`), which is rare.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            Too many requests (`ATLAS-SYS-004`). `Retry-After` says how long to wait.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: >
            The lecture the thread is about has been taken down (`ATLAS-CNT-016`). Not
            disguised as a 404, for the reader's reason; and the facilitator's earlier posts in
            the thread are withheld from every read for as long as this holds.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          $ref: '#/components/responses/InternalError'
