    post:
      operationId: unsubscribeFromNotifications
      summary: One-click unsubscribe from a notification email
      description: >
        Turns ONE email type off for the account a SIGNED link names - every email
        carries a working unsubscribe link. Which type is named by `k`; absent means
        org activity, which is what keeps every link issued before per-type keys
        existed working.
        **Unauthenticated by requirement**: working from a mail client with no
        session is the whole point, and the HMAC in `t` is the authorisation.


        POST rather than GET because mail clients and security scanners PREFETCH
        links in messages - a GET that mutated would unsubscribe people who never
        clicked anything. The emailed URL points at a web page that posts here.


        **Always 200 with the same body**, whether or not the link verified.
        A differing answer would make this an oracle for which account ids exist.
      tags: [notifications]
      security: []
      parameters:
        - name: u
          in: query
          required: true
          schema:
            type: string
          description: The account id the link names (unverified until the MAC checks out)
        - name: k
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EmailPreferenceKey'
