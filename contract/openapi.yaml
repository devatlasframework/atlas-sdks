        most `atlas.tutor.transcript-turns` turns (200 by default) and there
        is deliberately no cursor: the panel renders a conversation rather
        than a paged archive. A longer thread is truncated at its OLDEST end,
        so the turns a learner just had are always present. The bound exists
        because the write route's throttle is a daily counter - it caps how
        fast a thread grows, never how large it gets.


        **The most private tier, and there is no org-facing counterpart.** Tutor
        conversations are in the tier no plan, setting or role unlocks, so every
        read behind this route names the caller in the query as well as in the
        row-level-security policy, and no endpoint exists that could list
        another member's turns.


        **An unopened thread is `200` with an empty list, never `404`** - a
        404 would make this an existence oracle for a resource the caller can
        already see, and would give the panel two ways to render nothing.


