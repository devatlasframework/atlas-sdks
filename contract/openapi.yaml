        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
    post:
      operationId: openCheckout
      summary: Start a purchase at the payment company the owner chose
      description: >
        Checkout. ADMIN ONLY.


        THE GATEWAY IS REQUIRED AND IS NEVER INFERRED. The owner chooses, and
        their location may suggest but never force. ATLAS stores
        no country, locale or region, so there is nothing honest to suggest from
        - the two companies are offered neutrally and neither is preselected.


        NOTHING MOVES YET. No money is taken, no seat is added and no plan
        changes until a verified event arrives from the company. An abandoned
        checkout therefore leaves the org exactly as it was.


        `redirectUrl` is opaque and points at the API's own redirect leg, which
