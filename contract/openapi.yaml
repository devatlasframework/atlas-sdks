          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/dev/apps/{appId}/webhooks/{webhookId}/reveal:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The application the endpoint belongs to
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The endpoint
    post:
      operationId: revealWebhookSecret
      summary: Read a webhook signing secret
      description: >
        Returns the endpoint's current signing secret. Requires
        ADMIN or MODERATOR.


        **This is the one credential in the developer platform you can read
        back.** An API key is stored hashed and its secret exists exactly once;
        a webhook signing secret is stored encrypted, because the webhooks
        screen shows it beside the address and losing it would otherwise make
        "rotate" the only answer to "what is my secret?".


        **A POST, though it changes nothing.** A `GET` returning a live
        credential ends up in browser history, proxy logs and `Referer` headers.
      tags: [developer]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The endpoint and its current signing secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCreatedResponse'
        '401':
          description: Missing/unusable credential (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A USER (`ATLAS-ORG-003`), an API key (no webhook operation is
            key-reachable), or not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such endpoint or application, or not a developer account
            (`ATLAS-SYS-005` / `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/dev/apps/{appId}/webhooks/{webhookId}/rotate:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The application the endpoint belongs to
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The endpoint
    post:
      operationId: rotateWebhookSecret
      summary: Rotate a webhook signing secret
      description: >
        Mints a successor signing secret and keeps the previous one valid for an
        overlap window. Requires ADMIN or MODERATOR.


        **During the overlap ATLAS signs every message with BOTH secrets and
        sends two `v1` values in the `ATLAS-Signature` header.** A verifier that
        tries each `v1` until one matches - which is what the `webhooks` section
        of this document tells you to write - keeps working throughout, so you
        can deploy the new secret at your leisure. A verifier that checks only
        the first `v1` will reject roughly half of what arrives during the
        window; that is the reason the recipe says to try them all.


        `previousSecretValidUntil` in the response is when the old secret stops
        being sent.
      tags: [developer]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The endpoint, its new signing secret, and when the old one expires
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCreatedResponse'
        '401':
          description: Missing/unusable credential (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A USER (`ATLAS-ORG-003`), an API key (no webhook operation is
            key-reachable), or not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such endpoint or application, or not a developer account
            (`ATLAS-SYS-005` / `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            A rotation is already in progress (`ATLAS-DEV-018`). An endpoint
            carries ONE previous secret, so rotating again inside the overlap
            would discard the one a receiver that has not redeployed is still
            verifying with - and they would start rejecting every message with
            no signal from ATLAS. Wait for `previousSecretValidUntil`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/dev/apps/{appId}/webhooks/{webhookId}/test:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The application the endpoint belongs to
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The endpoint
    post:
      operationId: testWebhookEndpoint
      summary: Send a test message to a webhook endpoint
      description: >
        Signs a probe and sends it to the endpoint immediately, then tells you
        what happened. Requires ADMIN or MODERATOR.


        **A signed-in person only**, like every operation on this screen. It is
        also the only call in ATLAS that dials an address of the caller's
        choosing and reports the result synchronously, so it carries a small
        per-organisation budget of its own on top: a diagnostic gets pressed two
        or three times, and anything past that answers `429`
        (`ATLAS-DEV-019`). Deliveries are unaffected by it.


        **It creates no delivery.** Nothing appears in the delivery log, and the
        probe's `delivery_id` corresponds to no record. The body carries
        `"test": true` and a `type` of `endpoint.test` so your handler can tell.


        **Always `200`.** Whether your endpoint accepted the probe is in the
        response body, not in the status: your server answering `500` is not
        this API failing.
      tags: [developer]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: What happened when ATLAS called the endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A USER (`ATLAS-ORG-003`), an API key (no webhook operation is
            key-reachable), or not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such endpoint or application, or not a developer account
            (`ATLAS-SYS-005` / `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            Too many tests from this organisation (`ATLAS-DEV-019`). A small
            per-organisation budget, separate from the general rate limit,
            because this is the only operation that dials an address you chose.
            Deliveries are unaffected; `Retry-After` says how long to wait.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/dev/apps/{appId}/webhooks/{webhookId}/deliveries:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The application the endpoint belongs to
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The endpoint
    get:
      operationId: listWebhookDeliveries
      summary: An endpoint's delivery log
      description: >
        Every message ATLAS owed this endpoint, newest first.
        Readable by ADMIN, MODERATOR and USER.


        **This is the authoritative record of what was sent.** Each row carries
        the `id` that travelled inside the signed payload, so a message your
        server logged can be found here - and "did you send this twice?" is a
        question with an answer rather than an inference.


        **`nextCursor` really advances here.** Unlike the other lists in this
        section, a delivery log is not bounded: pass the `nextCursor` you were
        given back as `cursor` until it is null.


        **`lastErrorClass` is never your server's response body.** It is the
        class of the error ATLAS hit (`SocketTimeoutException`), a short name
        for a non-2xx (`HttpStatus500`), or `AddressRefused` when ATLAS declined
        to dial at all. `lastResponseStatus` carries the numeric status when one
        was received.
      tags: [developer]
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: The opaque `nextCursor` from a previous page; omit for the first
      responses:
        '200':
          description: A page of deliveries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryPage'
        '401':
          description: Missing/unusable credential (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            An API key (no webhook operation is key-reachable, `ATLAS-ORG-003`), or
            not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such endpoint or application, or not a developer account
            (`ATLAS-SYS-005` / `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/dev/apps/{appId}/webhooks/{webhookId}/deliveries/{deliveryId}/replay:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The application the endpoint belongs to
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The endpoint
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The delivery to send again
    post:
      operationId: replayWebhookDelivery
      summary: Send a delivery again
      description: >
        Puts a settled delivery back in the queue. Requires
        ADMIN or MODERATOR.


        **The message is byte-identical, including its `delivery_id`.** A replay
        is another ATTEMPT at the same delivery, not a new one - so a receiver
        that deduplicates on `delivery_id`, as this document tells you to, will
        recognise it and do nothing. That is the intended outcome: replay is for
        the case where your server acknowledged a message and then lost it.


        **The attempt budget is not refilled.** A delivery ATLAS gave up on gets
        one more attempt, not eight; the attempt count keeps climbing.


        Refused with `409` if the delivery is already waiting to be sent or is
        being sent right now. A delivered one may be replayed.
      tags: [developer]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The delivery, now waiting to be sent again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryResponse'
        '401':
          description: Missing/unusable credential (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A USER (`ATLAS-ORG-003`), an API key (no webhook operation is
            key-reachable), or not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such delivery, endpoint or application, or not a developer
            account (`ATLAS-SYS-005` / `ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The delivery is already queued, or is being sent right now
            (`ATLAS-DEV-017`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}:
    get:
      operationId: getOrgContext
      summary: The active org's resolved context
      description: >
        The caller's validated scope in the active org - which org, what role
        - the bootstrap read for the org-scoped shell and its
        org switcher. The active org comes from this route segment
        only, never from a request body, and is validated against the
        caller's membership allow-list by the edge filter before any handler
        runs.
      tags: [orgs]
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The organisation's id
      responses:
        '200':
          description: The resolved org context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgContextResponse'
        '401':
          description: >
            Missing, malformed, expired, or otherwise unusable access token -
            one shape, no diagnostic detail (problem type
            `.../problems/unauthorized`, `ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            The caller is not a member of this org, the org does not exist,
            or the id is malformed - deliberately ONE indistinguishable shape
            (problem type `.../problems/org-access-denied`, `ATLAS-ORG-002`),
            so a probe cannot learn whether an org exists. A client seeing
            this should fall back to the user's private org.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /oauth/authorization-requests:
    post:
      operationId: createAuthorizationRequest
      summary: Start sign-in on behalf
      description: >
        Validates an authorization request and returns everything a consent
        screen must show, behind an opaque handle. The first leg of
        sign-in on behalf: an application sends a person here, they approve which
        permissions to grant, the application swaps a one-time code for a
        short-lived pass, and then calls `/v1` limited to that person.


        **No credential.** A logged-out person can be sent here, so this operation
        takes none. What it discloses about an application - its name, the
        permissions it is asking for - is what that application's own published
        authorization URL already discloses to anybody holding it.


        **Validated once, and referred to by handle after that.** The permissions
        this returns, the address a code may be sent to and the policy versions the
        grant will record are all fixed here. The decision names only the
        `requestId`, so the list somebody reads and the list recorded against their
        account cannot differ.


        **`redirect_uri` is matched as an exact registered literal** against the
        addresses the application has registered - never by prefix, never by host,
        never by pattern. Register every address you will use, exactly as you will
        send it.


        **PKCE is mandatory and `S256` is the only method.** `plain` is not
        implemented, so it cannot be downgraded to.


        Every refusal is one `400` with `ATLAS-DEV-013`, whether the client id is
        unknown, the address unregistered, a scope undeclared or the challenge
        malformed. That is deliberate: this operation is reachable without a
        credential, and a refusal that distinguished its reasons would be an oracle
        for which applications exist and which addresses they have registered.
      tags: [developer]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        '200':
          description: What the consent screen must show
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationContextResponse'
        '400':
          description: The request will not be shown to anybody (`ATLAS-DEV-013`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Request rate exceeded (`ATLAS-SYS-004`)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /oauth/authorization-requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        description: The opaque handle returned when the request was validated.
        schema:
          type: string
          maxLength: 64
    get:
      operationId: readAuthorizationRequest
      summary: Read a pending authorization request
      description: >
        Reads back what was validated, for the screen that will show it.


        **Authenticated**, and it exists because the journey is longer than one
        page load: a logged-out person sent to a consent screen signs in, may be
        handed an MFA challenge, and only then reads the permissions and decides.
        Reading does not consume the request, so a reload or a second look while
        somebody is still deciding does not expire what they came to approve.


        A handle that has expired or already been decided is a `404`.
      tags: [developer]
      responses:
        '200':
          description: What the consent screen must show
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationContextResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such pending request (`ATLAS-SYS-005`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /oauth/authorization-requests/{requestId}/decision:
    parameters:
      - name: requestId
        in: path
        required: true
        description: The opaque handle returned when the request was validated.
        schema:
          type: string
          maxLength: 64
    post:
      operationId: decideAuthorizationRequest
      summary: Allow, or deny
      description: >
        Records the person's decision and returns where to send the browser.


        **Authenticated**, and deliberately not on the tokenless surface: agreeing
        to something requires being somebody. The subject comes from the access
        token and never from the body.


        **Consumes the request.** Two tabs on the same consent screen cannot both
        produce a grant, and an allow after a deny finds nothing - whichever
        arrives second reads exactly as an expired request does.


        On allow, the grant is written with the permissions and the policy versions
        the screen displayed, and a one-time code is minted. On deny **nothing is
        created** - no grant, no code, no pass - and the application is still told,
        at its registered address, with `error=access_denied`.


        The response carries an address rather than a redirect: this is called by a
        screen that is still on the person's display, so a `302` would be followed
        by the fetch and not by the browser.
      tags: [developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationDecision'
      responses:
        '200':
          description: Where to send the browser next
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDecisionResponse'
        '400':
          description: >
            No `approved` (`ATLAS-VAL-001`), or a body that could not be read -
            `approved` that is not a boolean, or not JSON at all (`ATLAS-VAL-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such pending request (`ATLAS-SYS-005`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /oauth/token:
    post:
      operationId: exchangeDelegatedToken
      summary: Swap the code for a pass, or renew one
      description: >
        Exchanges a one-time code for a short-lived pass, or renews a pass with a
        refresh token.


        **No credential, and no client secret.** This is called by your server,
        which holds no ATLAS session; what authorises it is the code or the refresh
        token in the body. There is no client secret because this flow is for
        applications acting on a person's behalf, including native and browser
        clients where a shipped secret is not a secret - PKCE is what binds the
        exchange instead.


        **JSON, not `application/x-www-form-urlencoded`.** This departs from RFC
        6749 deliberately: this API's convention is plain JSON and every other
        operation in this document is JSON, so a single form-encoded endpoint would
        be the only one in the product and would need its own handling in each
        generated SDK. The practical consequence is that an off-the-shelf OAuth2
        client library will not work against this leg unmodified.


        **The refresh token is rotated on every use.** Presenting one that has
        already been spent is treated as theft: every unspent refresh token under
        that grant is revoked, so neither holder can renew and the application must
        send the person through the consent screen again. Already-issued passes keep
        working until they expire.


        Every refusal is one `400` with `ATLAS-DEV-014` - an expired code, a
        replayed one, a code minted for another application, a `redirect_uri` that
        does not match the one the code was sent to, a failed PKCE verification and
        a spent refresh token are indistinguishable. This is the one operation whose
        failures a caller can drive in a loop, so it does not report which half of a
        credential pair was wrong.
      tags: [developer]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: A delegated pass and its renewal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedPassResponse'
        '400':
          description: The code or refresh token cannot be exchanged (`ATLAS-DEV-014`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Request rate exceeded (`ATLAS-SYS-004`)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /oauth/grants:
    get:
      operationId: listConnectedApps
      summary: Applications connected to this account
      description: >
        What the signed-in person has authorised to act on their behalf. This is
        the surface a person uses to withdraw that permission at any time.


        Each entry carries the permissions in **the same sentences the consent
        screen showed** - generated from the scope vocabulary rather than retyped,
        so somebody checking their settings cannot find a different description of
        what they agreed to - together with the versions of the Terms and the
        privacy notice that were displayed at the time.


        Personal, and not org-scoped: a grant belongs to the person, so no
        organisation role reaches this list. Not reachable with an API key or with a
        delegated pass - a third party able to read this would be reading a profile
        of who somebody else does business with.
      tags: [developer]
      responses:
        '200':
          description: The connected applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAppResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /oauth/grants/{grantId}:
    parameters:
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: withdrawGrant
      summary: Withdraw permission
      description: >
        Disconnects an application.


        **It takes effect immediately, not at the end of a pass's lifetime.** Every
        delegated request re-reads the grant, so the next call the application makes
        is refused. Its refresh tokens are revoked in the same act.


        Idempotent: withdrawing an already-withdrawn grant answers `204`. A grant
        belonging to somebody else answers `404` - absent and foreign are
        indistinguishable.


        Not reachable with an API key or with a delegated pass.
      tags: [developer]
      responses:
        '204':
          description: Withdrawn
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such grant on this account (`ATLAS-SYS-005`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /scopes:
    get:
      operationId: listScopes
      summary: The permission vocabulary
      description: >
        Every scope an API key can hold, with ATLAS's own plain-English wording
        for each. The same list this document publishes on the
        `apiKeyAuth` scheme, served so that a portal, a consent screen or an SDK
        can render a permission's MEANING without any of them keeping a copy of
        the sentence.


        Reserved scopes are included and say so. One that is reserved is
        published and reaches no operation yet: a key can be minted with it, and
        every call that key makes will be refused, so a picker should offer it as
        unavailable rather than as a working permission.


        Not reachable with an API key. A key does not need to be told what scopes
        exist - `GET /key` already tells it what it holds.
      tags: [developer]
      responses:
        '200':
          description: The vocabulary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeCatalogueResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Request rate exceeded (`ATLAS-SYS-004`)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected failure (`ATLAS-SYS-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /o/{orgId}/end-users:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
    get:
      operationId: listEndUsers
      summary: The learners this application has linked
      description: >
        Every end user linked by the application whose key you presented.
        There is no application parameter, and that is deliberate: the credential
        names the application, so a key cannot reach another one's learners even
        by asking.


        **API key only.** A signed-in person is refused - end users are an
        integration capability, and admitting a browser session would mean
        inventing an application-selection parameter that carries none of the
        ownership the credential gives for free.
      tags: [developer]
      security:
        - apiKeyAuth: [end-users:manage]
      responses:
        '200':
          description: The application's linked learners
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndUserPage'
        '401':
          description: Missing/unusable credential (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not a member / no such org (`ATLAS-ORG-002`, no existence oracle), a
            key without the scope this operation names (`ATLAS-SYS-007`), or a
            key whose account is not entitled (`ATLAS-SYS-008`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Request rate exceeded (`ATLAS-SYS-004`)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected failure (`ATLAS-SYS-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: linkEndUser
      summary: Link one of your own learners
      description: >
        Links a learner of yours to the application whose key you presented. ATLAS stores a digest of `ref` and nothing else.


        **Linking a learner who is already linked returns the existing link**
        rather than refusing: that is the state you asked for. Send an
        `Idempotency-Key` header to make a retry provably act once - the same key
        with the same body replays the first outcome, and the same key with a
        DIFFERENT body is refused `409` rather than answered with somebody else's
        result.
      tags: [developer]
      security:
        - apiKeyAuth: [end-users:manage]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 255
          description: >
            A repeat guard. Optional; when present, 8-255 characters, and
            unique per distinct request you make.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkEndUserRequest'
      responses:
        '201':
          description: The link, new or already existing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndUserResponse'
        '400':
          description: >
            An unusable reference (`ATLAS-DEV-011`) or a malformed
            `Idempotency-Key` (`ATLAS-DEV-009`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            This `Idempotency-Key` was already used for a different request, or
            its first call is still in flight (`ATLAS-DEV-010`); or this
            application has reached the maximum number of live links
            (`ATLAS-DEV-012`) - revoke one you no longer need
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable credential (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not a member / no such org (`ATLAS-ORG-002`, no existence oracle), a
            key without the scope this operation names (`ATLAS-SYS-007`), or a
            key whose account is not entitled (`ATLAS-SYS-008`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Request rate exceeded (`ATLAS-SYS-004`)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected failure (`ATLAS-SYS-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
