              schema:
                $ref: '#/components/schemas/PersonalisationProfile'
        '400':
          description: >
            The profile could not be used, for one of three reasons a caller can
            tell apart by `errorCode`. `ATLAS-VAL-002`: the body could not be read
            - not JSON, or a value that cannot take its field's type, such as an
            unknown `structureType`. `ATLAS-VAL-001`: a field is missing or over its
            bound. `ATLAS-DEV-020`: the profile is well-formed and disagrees with the
            instrument - see the operation's description. Each carries an `errors`
            array naming the fields whenever a field can be named (a body that is not
            JSON at all has none), and none repeats a value.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such link, another application's, or revoked (`ATLAS-SYS-005`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable credential (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not a member / no such org (`ATLAS-ORG-002`, no existence oracle), a
