    get:
      x-atlas-pagination: deferred-j3
      operationId: listDiscussionThreads
      summary: The organisation's discussion threads
      description: >
        Every thread in the caller's organisation, most recently active first.


        **Any member may read any thread here, which is new in this API.** Every other
        learner-authored store is per-person and invisible to a colleague; a discussion post is
        org content by design, and the row-level policy behind it carries the
        organisation and no author. The `unread` flag on each row is the one per-person value in
        the response - two members legitimately see different values, and neither can compute
        the other's.
      tags:
