            non-offerable plan or no active subscription (`ATLAS-BIL-004`), or
            another transition is already scheduled (`ATLAS-BIL-014`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
