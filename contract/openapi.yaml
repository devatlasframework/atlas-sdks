        THE DAY IS UTC. These figures line up with the
        counters the cap is enforced against, so a learner whose own day differs
        is looking at a billing day and the screen says so.


        DELIBERATELY ABSENT: a per-feature breakdown and a cache-savings figure.
        `FeatureBucket` has two values while eleven reader features charge one of
        them, so a split by feature is a schema change rather than a query. The
        cache saving has no org-attributable trace at all today - a reused result
        charges zero and writes no usage row, and the transform cache records
        that a rewrite exists rather than how often an org was served it. Both
        are deferred rather than invented here.
      tags: [billing]
      responses:
        '200':
          description: The org's usage today.
          headers:
            Cache-Control:
              schema:
                type: string
              description: '`private, max-age=15`. Never shared: the body names members.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUsageResponse'
        '401':
          description: No or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not an Admin (`ATLAS-ORG-003`), or not a member / no such org
