        spent org allowance. A component reading this endpoint never sees a 429
        at all.


        MEMBER-VISIBLE BY A DELIBERATE DECISION. Billing data is Admin-only, and
        that means COMMERCIAL data; operational allowance state is member-visible,
        which is what lets a member's screen say "ask your Admin" rather than
        withhold the reason.


        THE STATE IS ALL THERE IS, AND THAT IS THE PRIVACY CONTROL. No spend
        figure, no remaining credit, no percentage, no ceiling, no reset time,
        nothing in money. Those stay Admin-only, along with plan and price,
        invoices, payment method, seats, per-member caps, the per-member usage
        breakdown, and the cache-savings statistic in any unit. "Show them how
        much is left" is an org-financial disclosure on the widest-audience
        screen in the product.


        ALWAYS 200. `unknown` is a real answer, not an error - the state is read
        from a counter, so "could not tell" is a third outcome. This must never
        fail a learner's reader: learning never stops because a counter did.
      tags: [billing]
      responses:
