    post:
      operationId: createTag
      summary: Tag a passage, privately
      description: >
        Tag a part of a lecture, privately.


        **Private to the learner, and there is deliberately no org-facing counterpart.**
        A tag says what a learner thought about a passage, which reconstructs
        who read what more sharply than a highlight does. The table has
        one policy, pinned to both the caller and their org, and no route here
        can list anybody else's.


        The label is trimmed before it is stored, so `" important "` and
        `"important"` are one tag rather than two - which is also what keeps the
        uniqueness rule meaningful for what a text field actually sends.
      tags:
