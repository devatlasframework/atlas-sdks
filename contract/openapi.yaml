          is its heading. A block that is not a SECTION is `204`
    post:
      operationId: summariseSection
      summary: Summarise one section as key points or an outline
      description: >
        F3's section summaries. A key-point summary runs the standard AI step:
        the same throttle, the same ownership and takedown checks,
        the same A1 gate, the same budget ordering, the same faithfulness check
        and the same refusal semantics as the per-block route.


        ITS OWN PATH RATHER THAN TWO MORE KINDS ON `/re-presentation`, because
        the block id means a different thing here. One vocabulary across both
        would make the pairing a runtime check on a field the caller controls,
        and getting it wrong is silent: `key-points` on a paragraph sends that
        paragraph to a prompt written for a section and caches the reply as the
        section's key points - checked against the paragraph it was given, so it
        passes, chipped and cited, and wrong.


        204 FOR TWO CAUSES OF ITS OWN, on top of every ordinary one: the block is
        not a SECTION, or it is one whose body carries no text. Both mean "show
        the plain content"; the client must not guess between them or between
        those and a provider outage.
