      summary: Remove a webhook endpoint
      description: >
        Stops ATLAS calling this address and removes its delivery history. Requires ADMIN or MODERATOR.


        **The delivery log goes with it.** An endpoint's history belongs to the
        endpoint; if you want to keep it, pause the endpoint with
        `enabled: false` instead.
      tags: [developer]
      security:
        - bearerAuth: []
      responses:
