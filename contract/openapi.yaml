openapi: 3.1.0
info:
  title: ATLAS API
  version: 1.7.0
  license:
    name: MIT
    identifier: MIT
  description: >
    The ATLAS public API (/v1). This document is the single source of truth for the
    **public** API surface: the client libraries and the reference documentation are
    generated from it, and a change to an endpoint changes this document in the same
    release.


    **What this contract does not cover.** This document describes the public `/v1`
    surface. A small number of routes exist outside it for platform operation; they are
    not part of this contract, are not callable with an API key, and are deliberately
    undocumented here. Their set is fixed and checked on every build, so it cannot grow
    by accident.


    **Response headers every call carries.** Two sets, described here once because they
    are properties of the whole surface rather than of any one operation, and OpenAPI has
    no way to say that.


    `X-Request-Id` is on **every** response, success or failure. It is a fresh value per
    request, minted by ATLAS and never read from the request, and the same value appears
    in the server-side record of that call — so quoting it in a support report identifies
    the exact call, whatever its status. This is what to quote for a `403`, a `409` or a
    `429`. It is distinct from the `errorId` a `500` carries in its body, which references
    one server-side failure and is the only detail that response discloses.


    `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset` are on every
    **authenticated** response outside `/auth/*`, and describe one budget: the **caller's
    own overall request rate** — the ceiling per window, how many calls are left (floored
    at zero), and how many seconds until the window restarts. Reading them does not itself
    consume budget. They describe a **request-rate** limit and never a credit allowance,
    which is a separate mechanism.


    **They describe only that budget, which matters most on a `429`.** Several operations
    have their own narrower limits — posting to a discussion, writing to the achievements
    board, rendering an invoice, and the AI features. When one of those refuses, the
    response still carries the caller's overall figures **unchanged**, so
    `RateLimit-Remaining` can read a healthy number beside a `429`. Diagnose a refusal from
    `Retry-After` and the problem's `errorCode`, never from `RateLimit-Remaining`. When the
    overall budget itself is what refused, `RateLimit-Remaining` reads zero.


    **Their absence is not "unlimited".** If the counter backing the budget cannot be
    reached, ATLAS serves the request rather than failing it, and omits these three
    headers rather than reporting a figure it cannot stand behind. Treat their absence as
    unknown. Responses under `/auth/*` never carry them at all: those endpoints refuse
    with one deliberately indistinguishable shape, and a remaining count would defeat it.


    A `429` raised by a request-rate limit carries `Retry-After`, in seconds. Two kinds of
    `429` do not, because neither clears after an interval: an exhausted AI credit
    allowance (`ATLAS-BIL-001`/`ATLAS-BIL-002`), which resets daily, and the discussion
    live-link connection cap (`ATLAS-FRM-010`), which clears when a connection is closed.
    The `errorCode` distinguishes them, which is why it and not `RateLimit-Remaining` is what to branch on.
    Every operation a request-rate limit can refuse declares that `429`; the authenticated
    ones share one description, `Throttled`.


    **Paging.** One convention, named here once so a client library generates a single
    paginator: a bounded `limit` and an opaque `cursor` on the request, and a
    `{ items: [...], nextCursor: string | null }` envelope on the response, where a null
    `nextCursor` means the end. The cursor encodes server-side position and a client that
    parses one is relying on something that will change. Cursor rather than offset because
    these collections grow while they are being read, and offset paging over a growing
    table skips and duplicates rows in a way the caller cannot see.


    **Three** groups of reads do not follow it yet, and none is a precedent. **Four**
    operations page with `page` + `size`; that shape is **frozen** — no new operation may
    use it. **Seven** cap with a bare `limit` and offer no second page, so a caller who
    reaches the cap cannot get the rest. **Thirteen** return an unbounded top-level array.
    The last two groups — all twenty array-returning reads — carry
    `x-atlas-pagination: deferred-j3`; giving them the envelope changes a response shape
    and is tracked separately. Any new collection endpoint uses the convention above.


    **Versioning.** `info.version` above is the version of THIS CONTRACT and is not the
    ATLAS product version. It moves when the described surface moves — minor
    for additive change, patch for a correction — and it does not move at a release cut.
    A breaking change means `/v2`, never an edit to `/v1`. What changed between two
    versions is recorded in the contract's changelog, published beside this document.


    **A body that cannot be read.** Every operation that takes a JSON body answers `400`
    with `ATLAS-VAL-002` when the body never becomes an object: it is missing, it is
    not JSON, or a value cannot take its field's type - a string where a number
    belongs, a name an enum does not know. `ATLAS-VAL-001` is the other half: the body
    was read, and a field broke one of its stated constraints. Whenever a field can be
    named, both carry an `errors` array whose `field` says where the problem is -
    properties dotted, map keys and indices in brackets; a body that is missing, or
    malformed before any field, has no `errors` array. Neither ever repeats the value
    that was sent, which on some operations is a password. The operations below declare their own `400`s; this
    one applies to all of them and is stated once, here.


    **The rest of a request that cannot be read.** A path, query or header value that
    cannot take its type - an id that is not a UUID, a number that is not a number - or
    a required one that is absent is `400` with `ATLAS-VAL-003`, naming the parameter and
    never its value (the problem's `instance` is the request's own path, so a path value you
    sent appears there and nowhere else); a query parameter over its stated bound is `400` with
    `ATLAS-VAL-001`, like a body field. An address nothing answers at is `404` with
    `ATLAS-SYS-005`, a method the address does not answer is `405` with `ATLAS-SYS-009`,
    and a `Content-Type` an operation does not read or an `Accept` it cannot write is
    `415` or `406` with `ATLAS-SYS-010`. **Every response this API sends as a refusal
    carries an `errorCode`**, so a client never has to branch on a status alone. The one
    exception is a path the web server cannot parse at all - an encoded slash (`%2F`) or a
    NUL byte in it - which is refused `400` with an HTML body before this API sees the
    request. No address in this contract contains either, so a client that builds its
    paths from it and encodes each value does not send one.
servers:
  - url: /v1
tags:
  - name: system
    description: The service's own health.
  - name: auth
    description: >
      Signing up, signing in, sessions and two-factor authentication - a person's own
      account.
  - name: orgs
    description: Organisations, their members and roles, invitations and settings.
  - name: developer
    description: >
      Developer accounts - applications, API keys, the learners you link as end users,
      personalisation for them, sign-in on behalf, webhooks and usage.
  - name: content
    description: >
      The official copy - lectures and their versions and files, the document a lecture
      becomes, courses, trash, and reporting a problem with a lecture.
  - name: reader
    description: >
      Tools inside a lecture - searching it, tagging passages privately, asking the tutor,
      and rating a rewrite.
  - name: personalisation
    description: >
      How a lecture is presented to one learner - the features recommended for them,
      re-presentations, summaries, concept maps, worked examples, scenarios, definitions,
      and their own notes and highlights.
  - name: practice
    description: Quizzes, marking, flashcards and a learner's practice settings.
  - name: progress
    description: >
      A learner's own progress, mastery and recommendations, their goals and their study
      reminders.
  - name: questionnaire
    description: The Learner Profile Questionnaire and the profile it produces.
  - name: discussions
    description: An organisation's discussion threads, polls and the discussion facilitator.
  - name: peer-review
    description: Offering work for review, reviewing a peer's work, and reading reviews of your own.
  - name: gamification
    description: Opt-in achievements and an organisation's leaderboard.
  - name: notifications
    description: In-app notifications and email preferences.
  - name: appearance
    description: A person's reading appearance preferences.
  - name: billing
    description: >
      Plans, checkout, the subscription and its seats, invoices, usage and the AI
      allowance.
  - name: webhooks
    description: >
      The events ATLAS sends to your server - requests ATLAS makes, not requests you make.
      Registering and managing the addresses they go to is under `developer`.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [system]
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      operationId: register
      summary: Create an account (email + password)
      description: >
        Sign-up: records the versioned ToS/privacy
        acceptance and emails a single-use, expiring verification link. The
        account stays unverified until the link is used. Guest endpoint.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created (unverified); verification mail sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: >
            Validation failed (problem type `.../problems/validation`; the
            `errors` array names the offending fields, e.g. a weak password)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            That email address is already registered (`ATLAS-AUTH-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Consume a verification link token
      description: >
        Activates the account (flips `emailVerified`) for a valid single-use
        token. Repeats on an already-verified account succeed idempotently.
        Deliberately a POST - link prefetchers must never consume tokens.
        Guest endpoint.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified (or already verified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '400':
          description: >
            Unknown or already-consumed token (`ATLAS-AUTH-002`), or a missing or blank token
            field (`ATLAS-VAL-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: >
            The link is past its expiry (`ATLAS-AUTH-003`) - a state of its own, so a client can
            offer to send a new one
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a fresh verification link
      description: >
        Issues a new single-use token for an unverified account. Always 204
        for unknown or already-verified addresses (no account enumeration).
        Guest endpoint.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '204':
          description: Accepted (a mail was sent only if an unverified account exists)
        '400':
          description: >
            Malformed email (problem type `.../problems/validation`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            A verification mail was sent within the cooldown window (`ATLAS-AUTH-004`), or the
            request budget is spent (`ATLAS-SYS-004`)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password-reset link
      description: >
        Emails a single-use, expiring reset link. Always 204 - for unknown addresses AND within the per-user resend
        cooldown alike, a mail is simply not sent. The reset flow must NEVER
        reveal whether an address exists, so - unlike resend-verification -
        the cooldown is enforced silently and never surfaces as a 429. Guest
        endpoint.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Accepted (a mail was sent only if the account exists and no reset link was issued within the cooldown)
        '400':
          description: >
            Malformed email (problem type `.../problems/validation`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password from a reset link
      description: >
        Consumes a valid single-use reset token, sets the new password, and
        signs out EVERY existing session, because the account may have been
        compromised. Completing a reset also verifies the email if it
        was not already, since clicking the link proves mailbox ownership. No
        tokens are returned: the user signs in fresh afterwards.
        Deliberately a POST - link prefetchers must never consume tokens.
        Guest endpoint.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed; all sessions revoked
        '400':
          description: >
            Unknown or already-consumed token (`ATLAS-AUTH-008`), or a missing, blank or
            too-short password or token field (`ATLAS-VAL-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: >
            The link is past its expiry (`ATLAS-AUTH-009`) - a state of its own, so a client can
            offer to request a new one
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email + password
      description: >
        Password login: a valid, verified
        account receives a short-lived signed access token plus an opaque,
        rotating refresh token. Every credential failure - unknown email,
        wrong password, Google-only account - answers ONE byte-identical
        generic 401 (no account-existence leak). Guest endpoint.


        With MFA enabled on the account - or for a super admin who has not
        enrolled yet - the 200 is the `MfaChallengeResponse`
        variant instead: a pending-login `mfaToken` and NO tokens until the
        second factor passes at `/auth/mfa/challenge` (or enrolment
        completes at `/auth/mfa/setup` + `/auth/mfa/confirm`). Branch on
        `mfaRequired`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >
            Signed in (token pair), or the MFA challenge (no tokens yet)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400':
          description: >
            Validation failed (problem type `.../problems/validation`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            Wrong credentials - deliberately generic (`ATLAS-AUTH-005`). Or, rarely, the
            credentials were right and the account changed while the session was being started -
            it was deleted, or signed out everywhere - so no session was issued
            (`ATLAS-AUTH-023`); sign in again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Correct password but the email address is not verified yet
            (problem type `.../problems/email-not-verified`,
            `ATLAS-AUTH-006`) - only ever returned to the credential holder
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >
            A second factor is owed but the MFA pending store is unreachable
            - the login fails CLOSED rather than skipping the factor
            (problem type `.../problems/mfa-unavailable`, `ATLAS-AUTH-022`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Rotate the refresh token
      description: >
        Exchanges a live refresh token for a fresh access + refresh pair. The
        presented token is consumed (single-use); presenting an
        already-rotated or revoked token is treated as theft and revokes the
        whole session. Guest endpoint - the refresh token IS the credential.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated; the previous refresh token is now dead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: >
            Validation failed (problem type `.../problems/validation`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            Refresh token unknown, expired, rotated, or revoked - one shape
            for all four (problem type `.../problems/invalid-refresh-token`,
            `ATLAS-AUTH-007`); sign in again
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      summary: End the session
      description: >
        Revokes the refresh token's whole session (every rotation of it).
        Idempotent and non-enumerating: unknown or already-revoked tokens
        answer the same 204. Access tokens are not revocable - they simply
        expire (<= 15 minutes). Guest endpoint - the refresh token IS the
        credential.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session revoked (or was already gone)
        '400':
          description: >
            Validation failed (problem type `.../problems/validation`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getMe
      summary: The authenticated account
      description: >
        The signed-in user's own account - the web shell's session bootstrap. The first bearer-protected endpoint. Deliberately NOT under
        the guest per-IP rate limit: it is an authenticated read and many
        users can share one forwarded client IP (e.g. a school NAT).
      tags: [auth]
      responses:
        '200':
          description: The authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: >
            Missing, malformed, expired, or otherwise unusable access token -
            one shape, no diagnostic detail (problem type
            `.../problems/unauthorized`, `ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me/welcome:
    post:
      operationId: markWelcomed
      summary: Record that this account has seen the welcome
      description: >
        Stamps the caller's account as having been shown the welcome screen
        and chosen one of its two doors. Per ACCOUNT, which is the
        point: this replaced a per-device cookie that the next person to sign in
        on the same browser inherited, so a brand-new account never saw the
        welcome screen.


        Idempotent, and silent about what it found - a repeat call, and a call
        whose account has since been deleted, both answer 204. The caller is
        reporting that they have seen the welcome; there is no state in which
        that needs an error. The recorded moment is the first one and a later
        call cannot move it. No request body.
      tags: [auth]
      responses:
        '204':
          description: Recorded (or already recorded)
        '401':
          description: >
            Missing, malformed, expired, or otherwise unusable access token -
            one shape, no diagnostic detail (problem type
            `.../problems/unauthorized`, `ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >
            Rate limited. Unlike `GET /auth/me`, which the limiter skips
            entirely, this is a write and carries a budget - a wide one, because
            a class starting together behind one school NAT crosses this screen
            within minutes of each other.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me/time-zone:
    patch:
      operationId: setTimeZone
      summary: Set the learner's time zone
      description: >
        Records the caller's IANA time zone, and optionally pins it as their HOME
        zone.


        **This is the only route in the platform that writes a zone after sign-up,
        and that makes the zone rule structural.** The rule is "detect the
        change; DON'T SWITCH SILENTLY", so a client that notices the browser's zone
        differs from the saved one may ASK - and only the learner's answer calls
        this. Nothing anywhere writes a detected value on its own.


        A PATCH rather than the POST `/auth/me/welcome` uses, because this is an
        edit of a field the caller chooses, with a value that can change again: a
        welcome is a one-way stamp, a zone is a current fact about where somebody
        is, and a learner who moves twice must be able to say so twice.


        Answers the whole `MeResponse` rather than 204, so a screen renders the
        SAVED value instead of echoing what it sent - which matters when a second
        tab got there first.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTimeZoneRequest'
      responses:
        '200':
          description: The account as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: >
            Not an IANA zone name. Offsets (`+05:30`, `UTC+05:30`, `Z`) and the
            legacy single-word ids (`Japan`, `UTC`, `EST5EDT`) are refused here
            rather than stored - ATLAS requires a zone NAME, because an offset
            cannot survive a daylight-saving change.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            Missing, malformed, expired, or otherwise unusable access token - or an
            account that no longer exists, which reads identically so a deleted
            account cannot learn it once existed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/google:
    get:
      operationId: startGoogleSignIn
      summary: Start Continue-with-Google
      description: >
        Begins Google OIDC sign-in:
        answers a 302 to Google's authorization endpoint carrying the
        per-attempt state, nonce, and PKCE challenge, and sets a short-lived
        HttpOnly attempt cookie (`__Host-atlas-google-signin`) binding the
        handshake to THIS browser - the callback refuses without it (login-CSRF
        defence), so the flow must run as real navigations in one browser, not
        via fetch. Guest endpoint.
      tags: [auth]
      security: []
      responses:
        '302':
          description: Redirect out to Google's authorization endpoint
          headers:
            Location:
              description: The provider authorization URL for this attempt
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: >
                The per-attempt binding cookie (HttpOnly, Secure,
                SameSite=Lax, expires with the attempt); its hash is stored
                server-side with the state
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >
            Google sign-in is not configured in this environment, or its
            state store is unreachable (problem type
            `.../problems/google-sign-in-unavailable`, `ATLAS-AUTH-013`).
            Password sign-in is unaffected.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/google/callback:
    get:
      operationId: completeGoogleSignIn
      summary: Google's redirect back (OIDC callback)
      description: >
        The provider's redirect target (no ATLAS UI beyond a
        spinner). Validates the attempt (state, its binding cookie from
        `/auth/google`, nonce, PKCE), verifies the ID token, then links or
        creates the user by the Google `sub` claim - never onto a
        still-unverified password account. ALWAYS answers a 302
        to the web finish page: `?code=<single-use sign-in code>` on success
        (redeem at `/auth/google/exchange`), or `?error=<errorCode>` on
        failure - `ATLAS-AUTH-010` (verification failed; retry-shaped),
        `ATLAS-AUTH-011` (Google reports the address itself unverified),
        `ATLAS-AUTH-012` (link refused: the address belongs to a
        still-unverified password account, or is already bound to a different
        Google identity), `ATLAS-AUTH-013` (unavailable). Guest endpoint.
      tags: [auth]
      security: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: The provider's own refusal (e.g. `access_denied`)
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the web finish page with `code` or `error`
          headers:
            Location:
              schema:
                type: string
                format: uri
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/google/exchange:
    post:
      operationId: exchangeGoogleSignInCode
      summary: Redeem the sign-in code for tokens
      description: >
        Exchanges the callback's single-use, short-lived sign-in code for the
        standard token pair, opening a fresh session. The code travels only as
        far as the finish page's query string; the session credentials
        themselves never enter a URL. Guest endpoint - the code IS the
        credential.


        The two-factor gate applies here exactly as on `/auth/login` (Google is
        not the bypass): an enrolled account - or an unenrolled super admin -
        gets the `MfaChallengeResponse` variant and no tokens.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleExchangeRequest'
      responses:
        '200':
          description: >
            Signed in (token pair), or the MFA challenge (no tokens yet)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400':
          description: >
            Validation failed (problem type `.../problems/validation`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            Sign-in code unknown, expired, or already used - one shape for all three
            (`ATLAS-AUTH-014`); start the Google flow again. Or the account changed while the
            session was being started, so none was issued (`ATLAS-AUTH-023`); sign in again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >
            Google sign-in unconfigured or its code store unreachable
            (problem type `.../problems/google-sign-in-unavailable`,
            `ATLAS-AUTH-013`) - or a second factor is owed but the MFA
            pending store is down (`.../problems/mfa-unavailable`,
            `ATLAS-AUTH-022`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/mfa/challenge:
    post:
      operationId: mfaChallenge
      summary: Answer the second-factor challenge
      description: >
        Spends the pending-login `mfaToken` from a login/exchange MFA
        response against a 6-digit authenticator code or a backup code. A wrong code leaves the pending login alive for a
        retry - but counts toward a per-user lockout; success consumes it
        and mints the standard token pair. An accepted authenticator code
        never verifies twice (RFC 6238 §5.2) and a backup code is
        single-use. Guest endpoint - the `mfaToken` IS the credential.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeRequest'
      responses:
        '200':
          description: Second factor accepted; access + refresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: >
            Validation failed (problem type `.../problems/validation`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            Either the pending login is dead - unknown, expired, already
            spent, or wrong-mode token (problem type
            `.../problems/mfa-challenge-invalid`, `ATLAS-AUTH-015`; sign in
            again) - or the code was wrong (`.../problems/mfa-code-invalid`,
            `ATLAS-AUTH-016`; the same `mfaToken` may retry). Each is ONE
            generic shape across its causes - no oracle on which nearly
            worked.


            Rarely, the code was right and the account changed while the session was being
            started - deleted, or signed out everywhere - so none was issued (`ATLAS-AUTH-023`);
            sign in again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >
            MFA pending store unreachable - fails CLOSED (problem type
            `.../problems/mfa-unavailable`, `ATLAS-AUTH-022`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/mfa/setup:
    post:
      operationId: mfaSetup
      summary: Begin authenticator enrolment
      description: >
        Mints a fresh TOTP secret and answers with its Base32 form plus the
        `otpauth://` provisioning URI - the web renders the QR;
        the api never generates images. The credential is EITHER the bearer
        token (Settings → Security) OR, for an unenrolled super admin
        mid-login, the `mfaToken` from the `enrollmentRequired: true` login
        variant. Re-calling while a previous setup is unconfirmed rotates
        the secret; an enabled account gets 409 (disable first - and super
        admins cannot disable).
      tags: [auth]
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaSetupRequest'
      responses:
        '200':
          description: Fresh pending enrolment; verify a code to enable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
        '400':
          description: >
            An `mfaToken` over its bound (`ATLAS-VAL-001`), or a body that could not be read (`ATLAS-VAL-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            No usable credential: neither a valid bearer nor a live
            ENROLL-mode `mfaToken` (problem types
            `.../problems/unauthorized` / `.../problems/mfa-challenge-
            invalid`). A challenge-mode `mfaToken` is refused here by
            design - a stolen password alone must never re-enrol the second
            factor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            MFA is already enabled (problem type
            `.../problems/mfa-already-enabled`, `ATLAS-AUTH-019`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >
            MFA pending store unreachable (problem type
            `.../problems/mfa-unavailable`, `ATLAS-AUTH-022`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/mfa/confirm:
    post:
      operationId: mfaConfirm
      summary: Verify the first code and turn MFA on
      description: >
        Verifies an authenticator code against the pending secret and
        switches MFA ON, answering with the backup codes - shown HERE and
        never again (only hashes are kept server-side). Driven by an
        ENROLL `mfaToken`, it also consumes that token and completes the
        sign-in: `tokens` then carries the standard pair (enrolment doubles
        as the second factor). On the bearer path `tokens` is null. Same
        dual credential as `/auth/mfa/setup`.
      tags: [auth]
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaConfirmRequest'
      responses:
        '200':
          description: MFA is on; backup codes (and tokens on the mid-login path)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaConfirmResponse'
        '400':
          description: >
            Validation failed (`.../problems/validation`), or the code does
            not match the pending secret (problem type
            `.../problems/mfa-confirm-code-invalid`, `ATLAS-AUTH-017`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            No usable credential - as `/auth/mfa/setup` (`ATLAS-SYS-002`); or the account
            changed while the new session was being started, so none was issued
            (`ATLAS-AUTH-023`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            No unconfirmed setup to verify (problem type
            `.../problems/mfa-not-pending`, `ATLAS-AUTH-018`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >
            MFA pending store unreachable (problem type
            `.../problems/mfa-unavailable`, `ATLAS-AUTH-022`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/mfa/disable:
    post:
      operationId: mfaDisable
      summary: Turn MFA off
      description: >
        Deletes the enrolment and every backup code. Requires
        a CURRENT second-factor code - TOTP or backup - because factor
        possession, not the password, is the right proof against a stolen
        session. Bearer-only: never reachable with a pending token. Super
        admins are refused outright - their second factor is mandatory.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
      responses:
        '204':
          description: MFA is off; enrolment and backup codes deleted
        '400':
          description: >
            Validation failed (`.../problems/validation`), or the code was
            wrong (problem type `.../problems/mfa-confirm-code-invalid`,
            `ATLAS-AUTH-017`; counts toward the MFA lockout)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            Missing or unusable access token (problem type
            `.../problems/unauthorized`, `ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Super admin - MFA is mandatory and cannot be disabled (problem
            type `.../problems/mfa-disable-forbidden`, `ATLAS-AUTH-021`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            MFA is not enabled (problem type `.../problems/mfa-not-enabled`,
            `ATLAS-AUTH-020`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sessions:
    get:
      x-atlas-pagination: deferred-j3
      operationId: listSessions
      summary: The caller's active sessions
      description: >
        Lists the signed-in user's active sessions - one entry per refresh-token
        rotation family, i.e. one login/device. The caller's
        own session is flagged `current` (matched by the access token's `sid`
        claim) so the UI can label "this device". Ordered most-recently-active
        first. Bearer-protected.
      tags: [auth]
      responses:
        '200':
          description: The caller's active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
        '401':
          description: >
            Missing, malformed, expired, or otherwise unusable access token
            (problem type `.../problems/unauthorized`, `ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sessions/sign-out-everywhere:
    post:
      operationId: signOutEverywhere
      summary: Sign out of every other session
      description: >
        Revokes every session EXCEPT the caller's current one:
        the "sign out everywhere" action, without locking yourself out - the
        current session (its `sid` claim) is kept. A legacy access token with no
        `sid` claim revokes every session, including this one. Password reset
        remains the path that kills every session, current included.
        Bearer-protected; idempotent.
      tags: [auth]
      responses:
        '204':
          description: Every other session is revoked; the current one survives
        '401':
          description: >
            Missing, malformed, expired, or otherwise unusable access token
            (problem type `.../problems/unauthorized`, `ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke one session
      description: >
        Revokes a single session (rotation family) the caller owns, by its id
        - its refresh tokens die immediately, so that device is
        signed out at its next refresh. Idempotent for an already-revoked own
        session. Bearer-protected.
      tags: [auth]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The session (rotation-family) id from the listing
      responses:
        '204':
          description: The session is revoked (or was already)
        '401':
          description: >
            Missing, malformed, expired, or otherwise unusable access token
            (problem type `.../problems/unauthorized`, `ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such session for this caller - an unknown id and another user's
            id are deliberately indistinguishable (problem type
            `.../problems/session-not-found`, `ATLAS-AUTH-024`), so the response
            never reveals which session ids exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /orgs:
    get:
      x-atlas-pagination: deferred-j3
      operationId: listMyOrgs
      summary: The caller's organisations
      description: >
        Every organisation the authenticated caller belongs to, with their role
        in each, for an org switcher. Private org pinned first
        (the account's automatic org), then shared orgs by name.
        Authenticated but NOT org-scoped - the list spans every org the caller
        belongs to, so it sits outside `/o/{orgId}`. It is derived from the
        caller's identity alone (no id parameter), so it can only ever return
        the caller's own orgs - never an enumeration of others'.
      tags: [orgs]
      responses:
        '200':
          description: The caller's organisations, private org first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgSummaryResponse'
        '401':
          description: >
            Missing, malformed, expired, or otherwise unusable access token -
            one shape, no diagnostic detail (problem type
            `.../problems/unauthorized`, `ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createSharedOrg
      summary: Create a shared organisation
      description: >
        Creates a SHARED organisation and makes the caller its ADMIN. Authenticated but NOT org-scoped - it
        runs before the caller belongs to the org being created, so it sits
        outside `/o/{orgId}`. The new org starts in the free-equivalent limited
        state (there is no subscription until billing). Private orgs are created
        automatically at signup and can never be created here - the type is
        always SHARED.
      tags: [orgs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        '201':
          description: The shared org was created; the caller is its ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
        '400':
          description: >
            Validation failed - e.g. a blank name (problem type
            `.../problems/validation`, the `errors` array names the field)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            Missing, malformed, expired, or otherwise unusable access token -
            one shape, no diagnostic detail (problem type
            `.../problems/unauthorized`, `ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /orgs/developer:
    post:
      operationId: createDeveloperOrg
      summary: Create a developer account
      description: >
        Creates a DEVELOPER organisation and makes the caller its ADMIN. A developer account is an
        organisation like any other - the same three roles, invitable,
        seat-capped, with member management - that additionally owns apps and
        API keys. Authenticated but NOT org-scoped, for the same reason the
        shared-org route is: it runs before the caller belongs to the org being
        created. A separate path rather than a field on the request body,
        because the organisation type is never client-supplied.
      tags: [orgs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        '201':
          description: The developer account was created; the caller is its ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
        '400':
          description: >
            Validation failed - e.g. a blank name (problem type
            `.../problems/validation`, the `errors` array names the field)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            Missing, malformed, expired, or otherwise unusable access token -
            one shape, no diagnostic detail (problem type
            `.../problems/unauthorized`, `ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /key:
    get:
      operationId: describeKey
      summary: Describe the API key making this request
      description: >
        Returns the identity of the API key presented on this request - which
        key, which app, which developer account, and when it stops working. It discloses nothing the caller did not
        already hold: a leaked key must not become a reconnaissance tool for the
        account it was taken from.


        **It needs no scope**, and it is the only operation that does not: a
        key has to be able to ask what it is before it can be told what it
        lacks, and this answer contains nothing the holder was not already
        holding - including `scopes`, which is its own grant.


        Every other key-reachable operation names the scope it costs; a key
        presented on an operation it does not hold the scope for is refused
        `403` `ATLAS-SYS-007`, naming the scope required. A key presented on an
        operation that accepts no key at all is refused `403` `ATLAS-SYS-003`,
        identically for its own organisation and any other.


        Rate-limit state is on the response headers (`RateLimit-Limit`,
        `RateLimit-Remaining`, `RateLimit-Reset`), where every other endpoint
        publishes it, rather than in this body.
      tags: [developer]
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: The key's own identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyIdentityResponse'
        '401':
          description: >
            No credential was presented, or the key does not authenticate
            anything - unknown, revoked, expired, or superseded by a rotation
            whose overlap has closed. One shape for all of them, with no
            diagnostic detail (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A valid credential that cannot be used here - an access token rather
            than an API key (`ATLAS-SYS-003`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/dev/apps:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
    get:
      operationId: listApps
      summary: The developer account's applications
      description: >
        Every application in this developer account, live ones first and newest
        first within each group. Readable by ADMIN, MODERATOR
        and USER - a User has read-only access to the developer
        dashboards. An organisation that is not a developer account reads as
        404, the same shape a nonexistent resource gets.


        `nextCursor` is always null today, and that is a fact rather than an
        unimplemented feature: an account holds a bounded number of
        applications, so one response is always the whole list. Write your
        client against the envelope anyway - when the bound is lifted the cursor
        starts advancing and nothing about this shape changes.
      tags: [developer]
      responses:
        '200':
          description: The account's applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPage'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not a member / no such org (`ATLAS-ORG-002`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            The active org is not a developer account (`ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createApp
      summary: Create an application
      description: >
        Creates an application in this developer account.
        Requires ADMIN or MODERATOR - a Moderator manages applications, API
        keys and webhooks, and a User has read-only access. The
        name must be unique among the account's live applications.
      tags: [developer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
      responses:
        '201':
          description: The application was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '400':
          description: Validation failed - e.g. a blank name
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            A USER (creating is ADMIN/MODERATOR, `ATLAS-ORG-003`), or not a
            member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The active org is not a developer account (`ATLAS-DEV-001`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            A live application in this account already has that name
            (`ATLAS-DEV-002`), or the account already holds the maximum number of
            applications (`ATLAS-DEV-007`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
