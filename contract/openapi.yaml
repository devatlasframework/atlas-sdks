          type: string
          format: uuid
    post:
      operationId: presentForEndUser
      summary: Personalisation for a linked end user
      description: >
        How ATLAS would present content to this learner, given the profile you
        supply: the features it recommends, the
        endorsements behind them and the presentation plan.


        **POST, and it writes nothing.** The profile is too large and too
        structured to be a query string, and it is your learner's scores - a
        value that must not end up in an access log, a browser history or a
        referrer header, which is what a GET would do to it.


        **This is the instant-changes half.** It spends no AI allowance and
        returns no generated text; the AI-rewrite half is tracked and arrives
        later. Revoking the link refuses this immediately.


        **The profile is held to the instrument before anything reads it.** Build
        it the way `GET /questionnaire/profile` returns one: the `taxonomyVersion`
        ATLAS serves, dimension and sub-dimension codes the instrument declares,
        each sub-dimension in the shape the instrument gives it (`bipolar` or
        `multi-category`), only categories that sub-dimension has, every score a
        1-5 mean, and a score only for a dimension listed in
        `completedDimensions`. A profile that disagrees is refused with `400`
        `ATLAS-DEV-020`, whose `errors` names each field that disagrees and never
        repeats what it said there - the values are your learner's.
      tags: [developer]
      security:
        - apiKeyAuth: [ai:use]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentEndUserRequest'
      responses:
