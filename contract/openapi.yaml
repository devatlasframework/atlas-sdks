        `A6`'s recommender. Three properties, and each is a promise this route
        keeps:


        **It scores by need** = how weak the mastery is and how due it is for
        review. Weakness always counts; dueness amplifies it, so a section the
        learner has just got wrong is reachable rather than waiting days to
        cross a threshold.


        **It respects order.** The only forward step offered is the one
        directly after the furthest section reached, so nothing later can be
        suggested before it. Where the resource sits in a course, and the
        learner has finished it, the next lecture is offered using the course's
