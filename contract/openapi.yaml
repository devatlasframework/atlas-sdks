          type: string
          format: uuid
        description: The organisation's id
      - name: appId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The application the endpoint belongs to
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The endpoint
    patch:
      operationId: updateWebhookEndpoint
      summary: Change a webhook endpoint
      description: >
        Changes the address, the subscribed events, or whether ATLAS is calling. Requires ADMIN or MODERATOR.


        **Every field is optional and absent means "leave it".** `events` is the
        exception worth reading twice: when present it REPLACES the whole set, so
        it is how you unsubscribe from something - and when absent it is left
        alone, so a request that only moves the address does not silently
        unsubscribe you from everything.


        **`enabled: true` re-enables an endpoint ATLAS stopped calling**, and
        clears its failure count with it. `enabled: false` pauses one without
        deleting it or its history.
      tags: [developer]
      security:
