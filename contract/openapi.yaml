    get:
      operationId: getUploadPolicy
      summary: The upload limits the upload screen pre-flights against
      description: >
        The size ceiling and accepted content types, so the upload
        screen states the real limits instead of hard-coding numbers that would
        drift from server config, and can refuse a file before a byte moves.
        Client-side pre-flight only - the authoritative gates run at create.
        Admin/Moderator only, like the upload it describes.
      tags: [content]
      responses:
        '200':
          description: The current upload policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPolicyResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: >
            Not an Admin/Moderator of this org (`ATLAS-ORG-003`), or not a member /
            no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/download:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The resource's id
    get:
      operationId: getResourceDownload
      summary: Get a short-lived URL for the original file
      description: >
        Mints a presigned GET URL for the resource's original bytes (the
        "download original" action). Any member may download what their org holds. The
        bytes come straight from object storage, never through the api.


        The URL forces `Content-Disposition: attachment` and
        `application/octet-stream`, so an uploaded HTML or SVG file downloads
        rather than rendering - uploaded bytes are untrusted. Minted
        per request and short-lived; re-request rather than caching it.
      tags: [content]
      security:
        - bearerAuth: []
        - apiKeyAuth: [content:read]
        - delegatedPassAuth: [content:read]
      responses:
        '200':
          description: The download URL and when it lapses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDownloadResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource in this org (`ATLAS-SYS-005`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The resource is not READY, so there are no sealed bytes to download
            (`ATLAS-CNT-008`) - it is still processing, or its upload failed and
            the bytes were discarded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: >
            The file has been taken down (`ATLAS-CNT-016`): a super admin
            upheld a copyright or abuse report against these exact bytes, so the
            fingerprint is blocklisted and every org holding the file loses access
            together - not only the org that was reported. Deliberately NOT
            disguised as a 404: a takedown notice is given openly, never silently,
            and the caller is being told about their own content. The remedy is an
            appeal, not a retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/content:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The resource's id
    get:
      operationId: getResourceContent
      summary: Read a resource's official copy
      description: >
        The processed ContentDocument behind the resource's CURRENT version - the
        immutable block tree the reader renders. Any
        member may read what their org holds.


        **The response may be a PREFIX of the document.** Ingestion accepts 50 000
        blocks and 64 MiB, and nothing between the api and a renderer windows that,
        so the response is bounded (`atlas.content.reader.*`). Read `truncated`
        rather than comparing the counts, and offer the original when it is set -
        the sealed bytes are always complete, which is what makes serving part of a
        document honest rather than lossy.


        **No identifying fields.** The response carries no `sourceFingerprint`, no
        document id, no build time and no extractor version. A ContentDocument row is
        SHARED rather than copied - a second org uploading the same file adopts the
        very same row, with its original build time - so each of those is a stable
        cross-org identifier for a piece of content. Two members in different orgs
        could establish that both hold the same file byte for byte without either
        uploading anything, and a build time predating your own upload says the file
        was already on the platform. Both are conclusions ATLAS refuses to let
        anyone reach by timing, so no field may reveal them either.
      tags: [content]
      responses:
        '200':
          description: The block tree, whole or bounded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderDocumentResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such resource in this org (`ATLAS-SYS-005`, no existence oracle)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            The resource has no readable copy (`ATLAS-CNT-019`): it has no current
            version, or that version sealed without a ContentDocument attached.
            Distinct from `ATLAS-CNT-008` - the sealed bytes and the processed tree
            are different artefacts, and a version can be downloadable while its
            ingestion is still in flight.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: >
            The file has been taken down (`ATLAS-CNT-016`). Same decision and
            same remedy as on the download route - an appeal, not a retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}/content/images/{fileRef}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The resource's id
      - name: fileRef
        in: path
        required: true
        schema:
          type: string
          pattern: '^img-\d{3,4}$'
        description: >
          The document-relative reference an IMAGE block carries in
          `canonicalContent.fileRef`. The storage key is composed server-side from
          the version's own fingerprint; the block never carries one, because a full
          key would put the fingerprint into every image block.
    get:
      operationId: getResourceContentImage
      summary: Get one image out of a resource's official copy
      description: >
        Returns the image BYTES, not a URL, and that is forced rather than chosen:
        every presigned GET the storage port mints signs `attachment` and
        `application/octet-stream` overrides, so a browser handed one in an `<img
        src>` would download a file instead of drawing a picture. Those overrides
        exist because the storage origin is public and must never render uploaded
        bytes as markup.


        The content type is read from the object's own leading bytes and is always
        one of four raster types - never the stored object's declared type (a
        constant `application/octet-stream`) and never anything the document says.
        The response carries `X-Content-Type-Options: nosniff`.
      tags: [content]
      responses:
        '200':
          description: The image bytes
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: >
            No such resource in this org (`ATLAS-SYS-005`), or no such image
            (`ATLAS-CNT-020`). The image case covers a malformed reference, one past
            the slot cap, an absent object, and bytes that are not a supported image
            - all answered alike, because distinguishing them would map the key
            layout for a caller who should not be probing it.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The resource has no readable copy (`ATLAS-CNT-019`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '451':
          description: The file has been taken down (`ATLAS-CNT-016`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/InternalError'
  /o/{orgId}/resources/{resourceId}:
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The organisation's id
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The resource's id
    get:
      operationId: getResource
      summary: Read a resource
      description: >
        The resource's status and, once the upload is confirmed, its size. Any
        member may read; a cross-org id reads as 404 (no existence oracle). The
        bytes' fingerprint is computed and stored server-side but is deliberately
        not returned — see `ResourceResponse`.
      tags: [content]
      security:
        - bearerAuth: []
        - apiKeyAuth: [content:read]
