      description: >
        Idempotent, and `PUT` for that reason: the reader fires it as sections
        scroll past, so it is called far more often than it changes anything.


        **The furthest mark only ever rises.** The write is a single upsert
        whose conflict arm takes `GREATEST` of the stored and incoming ordinals,
        so two overlapping calls cannot walk a learner's progress backwards and
        a first-ever call cannot collide with itself. Re-reading an earlier
        section moves "latest" and leaves "furthest" alone.


        **The client sends only the section.** There is no ordinal and no
        "furthest" flag: the ordinal is derived server-side from the document's
        own section order, so a client cannot claim to have finished a lecture
        it never opened.


