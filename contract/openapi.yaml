    get:
      operationId: getReadingProgress
      tags: [progress]
      summary: How far the caller has read through this lecture
      description: >
        A course page reads its structure and the learner's progress; this is
        the progress half, and what the guided path's "next" pointer and its
        breadcrumbs are computed from.


        **`204` when the learner has not started, never a body of nulls.** The
        api sets no global JSON inclusion, so a nullable field on a response
        record crosses the wire as an explicit `null` while a spec saying
        "absent" reads otherwise - a status code cannot be ambiguous that way.


        **Progress is anchored to the VERSION it was made on**, as notes and
