    post:
      operationId: retireResourceVersion
      summary: Retire a superseded version, freeing its storage
      description: >
        Frees a kept version's stored bytes so it stops counting against the org's
        storage, while its row stays on the timeline: an org can retire old
        versions explicitly. Terminal and idempotent -
        retiring a retired version changes nothing. The CURRENT version and any
        in-flight one are refused: the former is the live content (supersede it
        first), the latter has nothing settled to free. "In flight" includes
        READING and BUILDING - freeing those bytes would pull them out from under a
        running extraction, whose result would then seal a byte-less version READY
        and make it current. Admin/Moderator only.
