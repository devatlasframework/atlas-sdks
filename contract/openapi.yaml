                items:
                  $ref: '#/components/schemas/DiscussionThreadSummary'
        '401':
          description: Missing or unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member of this org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
