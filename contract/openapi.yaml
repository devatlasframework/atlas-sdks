              description: >
                `private, max-age=30`. Private because the body carries BOTH org
                state and CALLER-SCOPED state: a shared cache keyed on the path
                alone would answer across tenants and across members of one
                org as well. Short because it changes the moment a
                generation lands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAllowanceResponse'
        '401':
          description: Missing/unusable access token (`ATLAS-SYS-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not a member / no such org (`ATLAS-ORG-002`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
