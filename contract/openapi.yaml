            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStartedResponse'
        '400':
          description: Terms not accepted, or a malformed body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Not an Admin (`ATLAS-ORG-003`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >
            A checkout is already open (`ATLAS-BIL-003`), the plan cannot be
            bought (`ATLAS-BIL-004`), it does not include that many seats
            (`ATLAS-BIL-005`), the chosen company does not charge that currency
            (`ATLAS-BIL-009`), or this deployment cannot use that company at all
            (`ATLAS-BIL-010`).


            The last two are reachable only by a client that ignored the
            companies `PlanCardResponse.gateways` published, and both are
            PERMANENT - distinct from the 502 below, which is a company that
            could not be reached this time.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
